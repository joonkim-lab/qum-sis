<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qum Academic System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#6b1f2a;        /* 버건디 */
  --brand-ink:#3f1118;
  --accent:#b8923a;       /* 골드 */
  --paper:#f6f1e7;        /* 모래 크림 */
  --paper-2:#ede5d6;
  --ink:#2a2420;
  --muted:#7a6f66;
  --line:#d9cfbf;
  --ok:#2f6b3a; --warn:#b3261e; --pending:#8a6d1f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:"Noto Serif KR",serif;margin:0}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:500}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
/* layout */
#top{background:var(--brand);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;height:58px;position:sticky;top:0;z-index:5}
#top .logo{display:flex;align-items:center;gap:10px}
#top .logo img{height:34px;width:34px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
#top .logo h1{font-size:18px;letter-spacing:.3px}
#top nav{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
#top nav a{color:#f3e6e8;text-decoration:none;padding:6px 10px;border-radius:5px;font-size:14px}
#top nav a.on,#top nav a:hover{background:rgba(255,255,255,.14);color:#fff}
#top .me{margin-left:auto;font-size:13px;opacity:.9;display:flex;gap:10px;align-items:center}
#top .me button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:5px;padding:4px 10px;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px}
.card h2{font-size:19px;color:var(--brand);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--paper-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px}
.grid label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 18px;min-width:140px}
.stat b{display:block;font-size:26px;font-family:"Noto Serif KR",serif;color:var(--brand)}
.stat span{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;background:var(--paper-2);padding:8px 8px;font-weight:600;font-size:12.5px;color:var(--brand-ink);position:sticky;top:58px}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fbf8f2}
td[contenteditable]{outline:none;background:#fffdf7;border-bottom:1px dashed var(--accent)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:12px;background:var(--paper-2);color:var(--brand-ink)}
.tag.ok{background:#e3efe4;color:var(--ok)}.tag.warn{background:#f9e2df;color:var(--warn)}.tag.pend{background:#f3ead2;color:var(--pending)}
.muted{color:var(--muted);font-size:13px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brand-ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
[hidden]{display:none!important}
#login{min-height:100vh;display:grid;place-items:center}
.sub{display:flex;gap:6px;margin:-6px 0 14px}
.sub a{font-size:13px;color:var(--brand);text-decoration:none;padding:4px 10px;border:1px solid var(--line);border-radius:14px}
.sub a.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* transcript */
.tr{background:#fff;color:#000;font-family:"Noto Sans KR",Arial,sans-serif;font-size:10.5pt;max-width:820px;margin:0 auto;padding:28px 34px;border:1px solid var(--line)}
.tr h1{font-family:Georgia,"Noto Serif KR",serif;font-size:20pt;margin:0;color:#000}
.tr .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:8px}
.tr .hd img{height:52px}
.tr .hd .sch{text-align:right;font-size:9.5pt;line-height:1.35;white-space:pre-line}
.tr .info{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:2px 14px;margin:10px 0;font-size:9.5pt}
.tr .info b{display:block;font-size:8.5pt;color:#444;font-weight:600}
.tr .cum{border:1px solid #000;padding:6px 10px;display:flex;gap:26px;font-size:9.5pt;margin:8px 0 12px}
.tr table{font-size:9.5pt}
.tr th{background:#ddd;color:#000;position:static;border-bottom:1px solid #000;padding:4px 6px}
.tr td{padding:3px 6px;border-bottom:0}
.tr tr.tot td{border-top:1px solid #999;font-weight:600;padding-bottom:8px}
.tr tr:hover td{background:transparent}
.tr .legend{display:grid;grid-template-columns:1.1fr 1.3fr 1.3fr 1.2fr;gap:14px;margin-top:16px;font-size:8.5pt}
.tr .legend table{font-size:8.5pt}.tr .legend th{background:#eee;padding:2px 5px}.tr .legend td{padding:1px 5px}
.tr .legend h4{margin:0 0 4px;font-size:9pt}
.tr .wasc{font-size:8pt;color:#333;margin-top:14px;line-height:1.4}
.tr .sign{margin-top:26px;display:flex;justify-content:space-between;align-items:flex-end;font-size:8.5pt}
.tr .sign .line{border-top:1px solid #000;width:300px;padding-top:3px}
@media print{ body{background:#fff} #top,.foot,.noprint{display:none!important} main{padding:0;max-width:none} .tr{border:0;padding:0;max-width:none} @page{size:A4;margin:14mm 12mm} }
#login .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:40px 44px;text-align:center;width:min(420px,92vw)}
#login img{height:72px;margin-bottom:12px}
#login h1{color:var(--brand);font-size:26px;margin-bottom:6px}
#login p{color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:5px 14px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
@media(max-width:720px){#top nav{display:none}}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="box">
    <img id="loginLogo" src="" alt="" hidden>
    <h1 id="loginTitle">Qum Academic System</h1>
    <p id="loginSub">학교 구글 계정으로 로그인하세요</p>
    <button class="btn" id="btnLogin">Google 로그인</button>
    <div class="foot">Educclesia Group</div>
  </div>
</div>
<div id="app" hidden>
  <header id="top">
    <div class="logo"><img id="topLogo" src="" alt="" hidden><h1 id="topTitle">Qum Academic System</h1></div>
    <nav id="nav"></nav>
    <div class="me"><span id="meName"></span><span class="tag" id="meRole"></span><button id="btnOut">나가기</button></div>
  </header>
  <main id="view"></main>
  <div class="foot">Educclesia Group</div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, where, orderBy, limit, writeBatch, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBh_YwVF6xaQv0P5csZwhD9tzz3i7jv2_A",
  authDomain: "qum-sis.firebaseapp.com",
  projectId: "qum-sis",
  storageBucket: "qum-sis.firebasestorage.app",
  messagingSenderId: "324861037215",
  appId: "1:324861037215:web:32f3e749d2fcac93d430aa"
};
const OWNER = "joon.kim@educclesia.com";   // 플랫폼 소유자(에듀클레시아)
const DEFAULT_SCHOOL = "qum";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT; const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); };

/* ---------- 세션 ---------- */
let me = null;          // {email, name, role, schoolId, studentId}
let school = null;      // settings doc
let sid = DEFAULT_SCHOOL;
const col = name => collection(db, "schools", sid, name);
const ref = (name, id) => doc(db, "schools", sid, name, String(id));

const ROLES = { owner:"소유자", admin:"행정", principal:"교장", teacher:"교사", student:"학생" };
const can = {
  manage: () => ["owner","admin","principal"].includes(me.role),
  settings: () => ["owner","principal"].includes(me.role),
};

async function resolveMember(user){
  const email = user.email.toLowerCase();
  if (email === OWNER) {
    // 소유자 첫 로그인: 학교·멤버십 없으면 만든다
    const m = await getDoc(doc(db,"memberships",email));
    if (!m.exists()) await setDoc(doc(db,"memberships",email), {schoolId:DEFAULT_SCHOOL, role:"owner", createdAt:serverTimestamp()});
    sid = m.exists() ? m.data().schoolId : DEFAULT_SCHOOL;
    const s = await getDoc(doc(db,"schools",sid));
    if (!s.exists()) await setDoc(doc(db,"schools",sid), {
      name:"Qum Academic System", nameKo:"쿰 아카데믹 시스템", schoolName:"Qum Educlesia", schoolNameKo:"이오에스 미래 리더스",
      logoUrl:"", color:"#6b1f2a", accent:"#b8923a", address:"", phone:"", ceeb:"", principal:"Joon Kim",
      termCode:"2026F", nextId:9001, createdAt:serverTimestamp()
    });
    return {email, name:user.displayName, role:"owner"};
  }
  const m = await getDoc(doc(db,"memberships",email));
  if (!m.exists()) return null;
  sid = m.data().schoolId;
  return {email, name:user.displayName, role:m.data().role, studentId:m.data().studentId||null};
}

async function loadSchool(){
  school = (await getDoc(doc(db,"schools",sid))).data();
  document.documentElement.style.setProperty("--brand", school.color || "#6b1f2a");
  document.documentElement.style.setProperty("--accent", school.accent || "#b8923a");
  $("#topTitle").textContent = school.name; $("#loginTitle").textContent = school.name;
  document.title = school.name;
  for (const id of ["topLogo","loginLogo"]) { const el=$("#"+id); el.hidden=!school.logoUrl; el.src=school.logoUrl||""; }
}

/* ---------- 로그인 ---------- */
$("#btnLogin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => {
  if (["auth/popup-blocked","auth/popup-closed-by-user","auth/cancelled-popup-request"].includes(e.code)) return signInWithRedirect(auth, new GoogleAuthProvider());
  toast("로그인 실패: "+e.code); console.error(e);
});
getRedirectResult(auth).catch(e=>{ toast("로그인 실패: "+e.code); console.error(e); });
$("#btnOut").onclick = () => signOut(auth);
onAuthStateChanged(auth, async user => {
  if (!user) { $("#login").hidden=false; $("#app").hidden=true; return; }
  $("#loginSub").textContent = user.email + " 확인 중…";
  try {
    const m = await resolveMember(user);
    if (!m) { toast("이 계정은 아직 등록되지 않았습니다. 학교에 문의하세요."); await signOut(auth); return; }
    me = m; await loadSchool();
    $("#meName").textContent = me.name || me.email; $("#meRole").textContent = ROLES[me.role] || me.role;
    $("#login").hidden=true; $("#app").hidden=false;
    buildNav(); route();
  } catch (e) {
    console.error(e); $("#loginSub").textContent = "오류: " + (e.code || e.message);
    toast("오류: " + (e.code || e.message));
  }
});

/* ---------- 라우터 ---------- */
const routes = {
  "":        {label:"현황",       show:()=>true,          view:viewHome},
  "students":{label:"학생",       show:()=>can.manage() || me.role==="teacher", view:viewStudents},
  "courses": {label:"과목",       show:()=>can.manage() || me.role==="teacher", view:viewCourses},
  "new":     {label:"신입생 등록", show:()=>can.manage(),  view:viewNew},
  "import":  {label:"가져오기",   show:()=>can.manage(),  view:viewImport},
  "settings":{label:"학교 설정",  show:()=>can.settings(),view:viewSettings},
  "me":      {label:"내 정보",    show:()=>me.role==="student", view:viewMe},
};
function buildNav(){
  $("#nav").innerHTML = Object.entries(routes).filter(([k,r])=>r.show()).map(([k,r])=>`<a href="#/${k}" data-k="${k}">${r.label}</a>`).join("");
}
window.addEventListener("hashchange", route);
async function route(){
  if (!me) return;
  const [k, arg] = location.hash.replace(/^#\/?/,"").split("/");
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.k===(k||"")));
  const v = $("#view"); v.innerHTML = `<p class="muted">불러오는 중…</p>`;
  const sub = location.hash.replace(/^#\/?/,"").split("/")[2];
  if (k==="students" && arg) return sub==="grades" ? viewStudentGrades(arg) : viewStudent(arg);
  if (k==="transcript" && arg) return viewTranscript(arg);
  const r = routes[k||""]; if (!r || !r.show()) { v.innerHTML="<p>권한이 없습니다.</p>"; return; }
  await r.view();
}

/* ---------- 현황 ---------- */
async function viewHome(){
  const snap = await getDocs(col("students"));
  const all = snap.docs.map(d=>({id:d.id,...d.data()}));
  const byGrade = {}; let review=0, pending=0;
  for (const s of all){ byGrade[s.grade]=(byGrade[s.grade]||0)+1; if (s.needsReview) review++; if (s.status==="pending") pending++; }
  const grades = Object.keys(byGrade).sort((a,b)=>(parseInt(a)||99)-(parseInt(b)||99));
  $("#view").innerHTML = `
  <div class="card"><h2>${esc(school.schoolName)} · ${esc(school.termCode)}</h2>
    <div class="stat">
      <div><b>${all.length}</b><span>학생 전체</span></div>
      ${grades.map(g=>`<div><b>${byGrade[g]}</b><span>${g}학년</span></div>`).join("")}
      <div><b style="color:var(--pending)">${review}</b><span>확인 필요</span></div>
      <div><b style="color:var(--warn)">${pending}</b><span>정보 미입력</span></div>
    </div></div>
  <div class="card"><h2>다음 단계</h2>
    <p class="muted">1단계: 학생 명부 → 과목·성적 → Transcript 발행. 2단계: 출결. 3단계: 학생 자기 입력(수상·활동). 4단계: 학습성장기록부. 5단계: 학교 설정·로고.</p></div>`;
}

/* ---------- 학생 목록 ---------- */
async function viewStudents(){
  const snap = await getDocs(col("students"));
  const gnum = g => parseInt(g) || 99;
  const all = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>gnum(a.grade)-gnum(b.grade) || String(a.last_en).localeCompare(b.last_en));
  const v=$("#view");
  v.innerHTML = `<div class="card"><h2>학생 ${all.length}명</h2>
    <div class="row" style="margin-bottom:12px"><input id="q" placeholder="이름·ID·이메일 검색" style="max-width:280px">
    <select id="g" style="max-width:140px"><option value="">전 학년</option>${[...new Set(all.map(s=>s.grade))].map(g=>`<option>${g}</option>`).join("")}</select>
    <label style="font-size:13px"><input type="checkbox" id="onlyReview" style="width:auto"> 확인 필요만</label></div>
    <div class="scroll"><table><thead><tr><th>ID</th><th>이름</th><th>학년</th><th>생년월일</th><th>이메일</th><th>과정</th><th>상태</th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
  const draw=()=>{
    const q=$("#q").value.toLowerCase(), g=$("#g").value, r=$("#onlyReview").checked;
    $("#tb").innerHTML = all.filter(s=>(!g||String(s.grade)===g)&&(!r||s.needsReview)&&(!q||[s.id,s.last_en,s.first_en,s.name_ko,s.email].join(" ").toLowerCase().includes(q)))
      .map(s=>`<tr><td><a href="#/students/${s.id}">${esc(s.id)}</a></td><td>${esc(s.last_en)}, ${esc(s.first_en)} ${s.name_ko?`<span class="muted">${esc(s.name_ko)}</span>`:""}</td><td>${esc(s.grade)}</td><td>${esc(s.dob)}</td><td class="muted">${esc(s.email)}</td><td>${esc(s.curriculum)}</td><td>${statusTag(s)}</td></tr>`).join("");
  };
  ["q","g","onlyReview"].forEach(i=>$("#"+i).oninput=draw); draw();
}
const statusTag = s => s.status==="pending"?`<span class="tag warn">미입력</span>`: s.needsReview?`<span class="tag pend">확인 필요</span>`:`<span class="tag ok">${s.status==="active"?"재학":esc(s.status)}</span>`;

/* ---------- 학생 필드 정의(한 곳에서 관리) ---------- */
const FIELDS = [
  ["기본",[["last_en","영문 성"],["first_en","영문 이름"],["name_ko","한글 이름"],["dob","생년월일","date"],["gender","성별","select",["","F","M"]],["grade","학년"],["gradYear","졸업연도"],["track","트랙","select",["","CAI","CEI","UI"]]]],
  ["학적",[["status","상태","select",["active","pending","graduated","transferred","leave"]],["enrollDate","입학일","date"],["endDate","종료일","date"],["prevSchool","전입학교"],["curriculum","과정(Apex/Buzz/CW)"],["distinctions","Distinctions"]]],
  ["연락",[["email","학교 이메일"],["phone","학생 휴대폰"],["address_en","주소(영문)"],["address_ko","주소(한글)"],["postal","우편번호"]]],
  ["보호자",[["g1_name","보호자1 이름"],["g1_rel","관계"],["g1_phone","휴대폰"],["g1_email","이메일"],["g2_name","보호자2 이름"],["g2_rel","관계"],["g2_phone","휴대폰"],["smsConsent","알림 수신 동의","select",["","Y","N"]]]],
  ["링크",[["infoSheetUrl","Student Information Sheet"],["resumeUrl","Resume"],["driveUrl","드라이브 폴더"]]],
  ["메모",[["note","메모"]]],
];
const ACCOUNT_FIELDS = [["genius_login","Genius 로그인"],["apex_id","Apex/Buzz ID"],["cw_id","Courseware ID"],["iready_id","iReady ID"]];
function fieldHtml(f, val){
  const [k,label,type,opts]=f;
  if (type==="select") return `<div><label>${label}</label><select name="${k}">${opts.map(o=>`<option ${o===(val??"")?"selected":""}>${o}</option>`).join("")}</select></div>`;
  return `<div><label>${label}</label><input name="${k}" type="${type||"text"}" value="${esc(val)}"></div>`;
}
const readForm = form => Object.fromEntries([...form.querySelectorAll("[name]")].map(e=>[e.name,e.value.trim()]));

/* ---------- 학생 상세 ---------- */
async function viewStudent(id){
  const [s, a] = await Promise.all([getDoc(ref("students",id)), getDoc(ref("accounts",id))]);
  if (!s.exists()) { $("#view").innerHTML="<p>없는 학생입니다.</p>"; return; }
  const d = s.data(), acct = a.exists()? a.data():{};
  $("#view").innerHTML = `<div class="card"><h2>${esc(d.last_en)}, ${esc(d.first_en)} <span class="muted" style="font-size:14px">ID ${esc(id)}</span> ${statusTag({...d})}</h2>
    ${subNav(id,"info")}
    <form id="f">${FIELDS.map(([g,fs])=>`<h3 style="font-size:14px;color:var(--muted);margin:16px 0 8px">${g}</h3><div class="grid">${fs.map(f=>fieldHtml(f,d[f[0]])).join("")}</div>`).join("")}

  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{importType=b.dataset.t; viewImport();});

    let n=0, skipped=0, batch = writeBatch(db), ops=0;

    const stamp = {needsReview:true, importedAt:serverTimestamp(), importedBy:me.email};
    for (const r of importRows){
      if (importType==="students"){
        const id=r.id; if (!id){skipped++;continue;}
        const acc={}, stu={}; for (const [k,v] of Object.entries(r)) if (v!=="") (ACCOUNT_FIELDS.some(f=>f[0]===k) ? acc : stu)[k]=v;
        batch.set(ref("students",id), {...stu, ...stamp}, {merge:true}); batch.set(ref("accounts",id), acc, {merge:true}); ops+=2;
      } else if (importType==="courses"){
        const cid = courseId(r); if (!cid){skipped++;continue;}
        batch.set(ref("courses",cid), {...r, credit:parseFloat(r.credit)||0, active:r.active!=="N", updatedAt:serverTimestamp()}, {merge:true}); ops++;

      }
      n++; if (ops>=400) await flush();
    }
    await flush();
    toast(`${n}줄 저장${skipped?`, ${skipped}줄 건너뜀`:""}`); location.hash = importType==="courses" ? "#/courses" : "#/students";
  };
}
function parseDelimited(text){
  text = text.replace(/\r/g,"").trim(); if (!text) return [];
  const delim = text.split("\n")[0].includes("\t") ? "\t" : ",";
  const rows=[]; let row=[], cell="", inQ=false;
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if (inQ){ if (ch==='"'){ if (text[i+1]==='"'){cell+='"';i++;} else inQ=false; } else cell+=ch; }
    else if (ch==='"') inQ=true;
    else if (ch===delim){ row.push(cell); cell=""; }
    else if (ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch; }
  row.push(cell); rows.push(row);
  const hdr = rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(c=>c.trim())).map(r=>Object.fromEntries(hdr.map((h,i)=>[h,(r[i]||"").trim()])));
}

const subNav = (id, on) => `<div class="sub noprint"><a href="#/students/${id}" class="${on==="info"?"on":""}">정보</a><a href="#/students/${id}/grades" class="${on==="grades"?"on":""}">성적</a><a href="#/transcript/${id}" class="${on==="tr"?"on":""}">Transcript</a></div>`;
const slug = t => String(t).toLowerCase().replace(/[^a-z0-9가-힣]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const courseId = r => r.code ? String(r.code).trim() : (r.title ? "t_"+slug(r.title.replace(/\s+Sem\s*[12].*$/i,"")) : "");
function termLabel(tc){ const m=/^(\d{4})([FSU])$/.exec(tc||""); if(!m) return tc||""; const y=+m[1];
  return m[2]==="F" ? `Fall ${y}-${String(y+1).slice(2)}` : (m[2]==="S"?`Spring ${y-1}-${String(y).slice(2)}`:`Summer ${y-1}-${String(y).slice(2)}`); }
const termKey = tc => { const m=/^(\d{4})([FSU])$/.exec(tc||""); return m ? +m[1] + ({F:0.5,S:0,U:0.25}[m[2]]) : 0; };
const PTS={A:4,B:3,C:2,D:1,F:0}, WPTS={A:5,B:4,C:3,D:2,F:1.7};
function gpaOf(rows){ // 학점 가중 평균 (카운슬러 시트와 동일)
  const done=rows.filter(r=>r.grade in PTS && r.credit>0); const cr=done.reduce((a,r)=>a+r.credit,0);
  if (!cr) return {u:0,w:0,credits:0};
  return {u:done.reduce((a,r)=>a+PTS[r.grade]*r.credit,0)/cr, w:done.reduce((a,r)=>a+(r.weighted?WPTS:PTS)[r.grade]*r.credit,0)/cr, credits:cr};
}
const f2 = n => (Math.round(n*100)/100).toFixed(2);
async function loadGrades(id){ const q=query(col("grades"), where("studentId","==",String(id))); return (await getDocs(q)).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>termKey(a.termCode)-termKey(b.termCode) || (a.gLevel||0)-(b.gLevel||0) || String(a.code).localeCompare(b.code)); }
let courseCache=null; async function loadCourses(){ if(!courseCache){ courseCache=(await getDocs(col("courses"))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.code||"zz").localeCompare(b.code||"zz")||a.title.localeCompare(b.title)); } return courseCache; }

  document.querySelectorAll("[data-g]").forEach(el=>el.onchange=async()=>{ await updateDoc(ref("grades",el.dataset.g),{grade:el.value,updatedBy:me.email,updatedAt:serverTimestamp()}); toast("저장"); });
  document.querySelectorAll("[data-c]").forEach(el=>el.onchange=async()=>{ await updateDoc(ref("grades",el.dataset.c),{credit:parseFloat(el.value)||0}); toast("저장"); });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("이 줄을 지울까요?")) return; await deleteDoc(ref("grades",b.dataset.del)); viewStudentGrades(id); });
  const ok=$("#okall"); if (ok) ok.onclick=async()=>{ const b=writeBatch(db); rows.filter(r=>r.needsReview).forEach(r=>b.update(ref("grades",r.id),{needsReview:false,reviewedBy:me.email})); await b.commit(); viewStudentGrades(id); };
  const gf=$("#gf"); if (gf) gf.onsubmit=async e=>{ e.preventDefault(); const v=readForm(gf);
    const code=v.course.includes(" · ")?v.course.split(" · ")[0]:""; const c=courses.find(x=>(code&&x.code===code)||(!code&&x.title===v.course));
    if(!c) return toast("과목 목록에 없는 과목입니다. 과목 화면에서 먼저 추가하세요");
    const title=c.title+(v.sem?" "+v.sem.replace(/^(\d)$/,"Sem $1"):""); const cid=c.id; const gid=`${id}_${v.termCode}_${cid}_${slug(v.sem||"")}`.replace(/[\/\s]/g,"_");
    await setDoc(ref("grades",gid),{studentId:String(id),courseId:cid,code:c.code||"",title,school:school.schoolName,gLevel:parseInt(v.gLevel)||null,termCode:v.termCode,grade:v.grade,credit:c.credit||0,weighted:!!c.weighted,source:v.source,needsReview:false,createdBy:me.email,createdAt:serverTimestamp()});
    toast("추가"); viewStudentGrades(id); };
}

/* ---------- Transcript ---------- */
async function viewTranscript(id){
  const [s, rows] = await Promise.all([getDoc(ref("students",id)), loadGrades(id)]);
  if (!s.exists()) return $("#view").innerHTML="<p>없는 학생입니다.</p>";
  const d=s.data(), g=gpaOf(rows), terms=[...new Set(rows.map(r=>r.termCode))];
  const dist=(d.distinctions||"").split(/;|\n/).map(x=>x.trim()).filter(Boolean);
  const today=new Date().toISOString().slice(0,10); const us = x => x? `${x.slice(5,7)}/${x.slice(8,10)}/${x.slice(0,4)}` : "";
  const schoolBlock=`${esc(school.schoolName)}\n${esc(school.address||"")}\n${school.phone?"Tel: "+esc(school.phone):""}${school.ceeb?" | CEEB: "+esc(school.ceeb):""}`;
  $("#view").innerHTML=`<div class="noprint row" style="max-width:820px;margin:0 auto 12px">${subNav(id,"tr")}<button class="btn sm" id="pr">인쇄 / PDF 저장</button><span class="muted">브라우저 인쇄 창에서 'PDF로 저장'</span></div>
  <div class="tr">
    <div class="hd"><div>${school.logoUrl?`<img src="${esc(school.logoUrl)}" alt="">`:""}<h1>Unofficial Transcript</h1></div><div class="sch">${schoolBlock}</div></div>
    <div class="info"><div><b>Student</b>${esc(d.last_en)}, ${esc(d.first_en)}</div><div><b>Birthdate</b>${us(d.dob)}</div><div><b>Grade</b>${esc(d.grade)}</div><div><b>Status</b>${d.status==="active"?"FULL TIME":esc(d.status||"").toUpperCase()}</div>
      <div><b>Address</b>${esc(d.address_en)}</div><div><b>Gender</b>${esc(d.gender)}</div><div><b>Graduating Year</b>${esc(d.gradYear)}</div><div><b>Page</b>1 of 1</div></div>
    <div class="cum"><b>Cumulative Totals for All Grade Levels</b><span>Unweighted GPA: <b>${f2(g.u)}</b></span><span>Weighted GPA: <b>${f2(g.w)}</b></span><span>Credits: <b>${g.credits}</b></span></div>
    <table><thead><tr><th>G.Level</th><th>School</th><th>Code</th><th>Course Title</th><th>Term</th><th>Grade</th><th>GPA</th><th>Credit</th></tr></thead><tbody>
    ${terms.map(t=>{ const tr=rows.filter(r=>r.termCode===t); const tg=gpaOf(tr);
      return tr.map(r=>`<tr><td>${r.gLevel??""}</td><td>${esc(r.school)}</td><td>${esc(r.code)}</td><td>${esc(r.title)}${r.weighted?" <b>+</b>":""}</td><td>${termLabel(t)}</td><td>${esc(r.grade)}</td><td>${r.grade in PTS?f2((r.weighted?WPTS:PTS)[r.grade]):"0.00"}</td><td>${r.grade in PTS?r.credit.toFixed(2):"0.00"}</td></tr>`).join("")
        +`<tr class="tot"><td colspan="6" style="text-align:right">Semester Totals:</td><td>${f2(tg.w)}</td><td>${tg.credits.toFixed(2)}</td></tr>`; }).join("")}
    </tbody></table>
    <div class="legend">
      <div><h4>GRADE</h4><table><tr><th>Grade</th><th>CORE</th><th>H / AP</th><th>%</th></tr><tr><td>A</td><td>4.0</td><td>5.0</td><td>90-100</td></tr><tr><td>B</td><td>3.0</td><td>4.0</td><td>80-89</td></tr><tr><td>C</td><td>2.0</td><td>3.0</td><td>70-79</td></tr><tr><td>D</td><td>1.0</td><td>2.0</td><td>60-69</td></tr><tr><td>F</td><td>0.0</td><td>1.7</td><td>0-59</td></tr></table></div>
      <div><h4>Distinctions</h4>${dist.map(x=>`<div>${esc(x)}</div>`).join("")||"<div>—</div>"}</div>
      <div><h4>Enrollment Summary</h4><div>Start Date: ${us(d.enrollDate)}</div><div>End Date: ${us(d.endDate)}</div><div>Graduation Date: ${us(d.gradDate||d.endDate)}</div></div>
      <div><h4>Legend</h4><div>IP = In Progress</div><div>DC = Dual Credit</div><div>MB = Minerva Baccalaureate</div><div>+ = Weighted Course (Honors/AP)</div></div>
    </div>
    <div class="wasc">${esc(school.accreditation||"")}${school.accreditation?"<br>":""}${esc(school.schoolName)} does not rank students.</div>
    <div class="sign"><div><div class="line">Signature of School Official / Title / Date</div><div style="margin-top:4px">This transcript is unofficial unless signed and sealed by a School Official.</div></div><div>${esc(school.principal)} | General Principal Rev. | ${us(today)}</div></div>
  </div>`;
  $("#pr").onclick=()=>window.print();
}

/* ---------- 학생 본인 ---------- */
async function viewMe(){
  if (!me.studentId) { $("#view").innerHTML="<p>학생 ID가 연결되지 않았습니다. 학교에 문의하세요.</p>"; return; }
  return viewStudent(me.studentId);
}
</script>

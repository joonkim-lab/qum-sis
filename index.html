<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qum Academic System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#6b1f2a;        /* 버건디 */
  --brand-ink:#3f1118;
  --accent:#b8923a;       /* 골드 */
  --paper:#f6f1e7;        /* 모래 크림 */
  --paper-2:#ede5d6;
  --ink:#2a2420;
  --muted:#7a6f66;
  --line:#d9cfbf;
  --ok:#2f6b3a; --warn:#b3261e; --pending:#8a6d1f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:"Noto Serif KR",serif;margin:0}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:500}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
/* layout */
#top{background:var(--brand);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;height:58px;position:sticky;top:0;z-index:5}
#top .logo{display:flex;align-items:center;gap:10px}
#top .logo img{height:34px;width:34px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
#top .logo h1{font-size:18px;letter-spacing:.3px}
#top nav{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
#top nav a{color:#f3e6e8;text-decoration:none;padding:6px 10px;border-radius:5px;font-size:14px}
#top nav a.on,#top nav a:hover{background:rgba(255,255,255,.14);color:#fff}
#top .me{margin-left:auto;font-size:13px;opacity:.9;display:flex;gap:10px;align-items:center}
#top .me button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:5px;padding:4px 10px;font-size:12px}
main{max-width:1500px;margin:0 auto;padding:28px 24px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px}
.card h2{font-size:19px;color:var(--brand);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--paper-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px}
.grid label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 18px;min-width:140px}
.stat b{display:block;font-size:26px;font-family:"Noto Serif KR",serif;color:var(--brand)}
.stat span{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;background:var(--paper-2);padding:8px 8px;font-weight:600;font-size:12.5px;color:var(--brand-ink);position:sticky;top:0;z-index:1}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.nw,th.nw{white-space:nowrap}
td .btn.sm{padding:2px 7px;font-size:12px}
tr:hover td{background:#fbf8f2}
td[contenteditable]{outline:none;background:#fffdf7;border-bottom:1px dashed var(--accent)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:12px;background:var(--paper-2);color:var(--brand-ink)}
.tag.ok{background:#e3efe4;color:var(--ok)}.tag.warn{background:#f9e2df;color:var(--warn)}.tag.pend{background:#f3ead2;color:var(--pending)}
.muted{color:var(--muted);font-size:13px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brand-ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
[hidden]{display:none!important}
#login{min-height:100vh;display:grid;place-items:center}
.sub{display:flex;gap:6px;margin:-6px 0 14px}
.row .sub{margin:0}
.sub a{font-size:13px;color:var(--brand);text-decoration:none;padding:4px 10px;border:1px solid var(--line);border-radius:14px}
.sub a.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* transcript */
.tr{background:#fff;color:#000;font-family:"Noto Sans KR",Arial,sans-serif;font-size:10pt;max-width:1000px;margin:0 auto;padding:28px 34px;border:1px solid var(--line)}
.tr h1{font-family:Georgia,"Noto Serif KR",serif;font-size:20pt;margin:0;color:#000}
.tr .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:8px}
.tr .hd img{height:52px}
.tr .hd .sch{text-align:right;font-size:9.5pt;line-height:1.35;white-space:pre-line}
.tr .info{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:4px 14px;margin:10px 0;font-size:9.5pt}
.tr .info .addr{grid-column:1/-1;white-space:nowrap}
.tr .info b{display:block;font-size:8.5pt;color:#444;font-weight:600}
.tr .cum{border:1px solid #000;padding:6px 10px;display:flex;gap:26px;font-size:9.5pt;margin:8px 0 12px}
.tr table{font-size:9pt;table-layout:auto}
.tr td.ct{letter-spacing:-.2px}
.tr td.nw,.tr th.nw{white-space:nowrap}
.tr th{background:#ddd;color:#000;position:static;border-bottom:1px solid #000;padding:4px 6px;text-align:center}
.tr td.c{text-align:center}
.tr .side{display:grid;grid-template-columns:2fr 3fr;gap:4px 18px;align-items:start;margin:0 0 12px}
.tr .side .ft{font-size:8pt;color:#555}
.tr .side>div{min-width:0}
.tr .side table{width:100%}
.tr td{padding:3px 5px;border-bottom:0}
.tr tr.tot td{border-top:1px solid #999;font-weight:600;padding-bottom:8px}
.tr tr:hover td{background:transparent}
.sgdoc{font-family:"Noto Sans KR",sans-serif;font-size:9.5pt}
.sgdoc h3{font-size:11pt;margin:16px 0 6px;font-family:"Noto Serif KR",serif}
.sg{width:100%;border-collapse:collapse;border:1.2px solid #000;margin-bottom:4px}
.sg th,.sg td{border:0.6px solid #000;padding:5px 7px;font-size:9pt;vertical-align:middle}
.sg th{background:#f1f1f1;color:#000;text-align:center;font-weight:600;position:static}
.sg td.c{text-align:center}
.sg tr:hover td{background:transparent}
.tr .legend{display:grid;grid-template-columns:1.5fr 1.3fr 1fr auto;gap:22px;margin-top:16px;font-size:8.5pt;align-items:start}
.tr .legend>div{min-width:0}
.tr .legend>div:last-child{justify-self:end;text-align:left}
.tr .legend table{width:100%;font-size:9pt}
.tr .legend th,.tr .legend td{text-align:center;padding:3px 6px}
.tr .legend h4{text-align:left}
.tr .legend table{font-size:8.5pt}.tr .legend th{background:#eee;padding:2px 5px}.tr .legend td{padding:1px 5px}
.tr .legend h4{margin:0 0 4px;font-size:9pt}
.tr .wasc{font-size:8pt;color:#333;margin-top:14px;line-height:1.4}
.tr .sign{margin-top:30px;display:flex;justify-content:space-between;align-items:flex-start;font-size:8.5pt}
.tr .sign .left{padding-top:34px}
.tr .sign .sp{height:34px}
.tr .sign .line{border-top:1px solid #000;width:340px;padding-top:3px;text-align:center}
@media print{ body{background:#fff} #top,.foot,.noprint{display:none!important} main{padding:0;max-width:none} .tr{border:0;padding:0;max-width:none;font-size:9pt} .tr table{font-size:8.5pt} .tr h1{font-size:18pt} @page{size:A4;margin:12mm 10mm} }
/* 격주 출결 확인서 (A4 반장 × 2) */
.bw{background:#fff;color:#000;font-family:"Noto Sans KR",sans-serif;font-size:9.5pt;max-width:760px;margin:0 auto 14px;padding:16px 20px;border:1px solid var(--line)}
.bw .bwh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:5px;margin-bottom:8px}
.bw .bwh h2{font-size:14pt;color:#000;border:0;padding:0;margin:0;font-family:"Noto Serif KR",serif}
.bw .bwh .sch{text-align:right;font-size:8.5pt;line-height:1.35}
.bw .sg{margin-bottom:5px}.bw .sg th{white-space:nowrap;width:1%}.bw .sg th,.bw .sg td{padding:3px 6px}.bw .sg td.c{text-align:center;white-space:nowrap}
.bw .cm{min-height:34px;outline:none;line-height:1.45}.bw .cm:focus{background:#fffdf0}
.bw .sign3 td{height:22px}
.bw .pt{display:inline-block;padding:0 7px;border-radius:10px;font-size:8.5pt;border:1px solid #999;white-space:nowrap}
.bw .prh{font-weight:700;font-size:9.5pt;margin:6px 0 2px}.bw .units{font-size:8pt;line-height:1.4;color:#222}.bw .tcm{margin-top:3px;padding-top:3px;border-top:0.5px dashed #999;line-height:1.45}
@media print{ #prList .bw{border:0;max-width:none;margin:0;padding:0;page-break-after:always;font-size:8.5pt} #prList .bw:last-child{page-break-after:auto} #prList .bw .sg th,#prList .bw .sg td{font-size:8.5pt;padding:2px 5px} }
@media print{ #bwList .bw{border:0;max-width:none;margin:0;padding:2mm 2mm 0;height:135mm;overflow:hidden;border-bottom:1px dashed #888;page-break-inside:avoid;font-size:8.5pt} #bwList .bw .sg th,#bwList .bw .sg td{font-size:8.5pt;padding:2px 5px} #bwList .bw .bwh h2{font-size:12.5pt} #bwList .bw:nth-of-type(2n){page-break-after:always;border-bottom:0} }
#login .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:40px 44px;text-align:center;width:min(420px,92vw)}
#login img{height:72px;margin-bottom:12px}
#login h1{color:var(--brand);font-size:26px;margin-bottom:6px}
#login p{color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:5px 14px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
@media(max-width:720px){#top nav{display:none}}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="box">
    <img id="loginLogo" src="" alt="" hidden>
    <h1 id="loginTitle">Qum Academic System</h1>
    <p id="loginSub">학교 구글 계정으로 로그인하세요</p>
    <button class="btn" id="btnLogin">Google 로그인</button>
    <div class="foot">Educclesia Group</div>
  </div>
</div>
<div id="app" hidden>
  <header id="top">
    <div class="logo"><img id="topLogo" src="" alt="" hidden><h1 id="topTitle">Qum Academic System</h1></div>
    <nav id="nav"></nav>
    <div class="me"><span id="meName"></span><span class="tag" id="meRole"></span><button id="btnOut">나가기</button></div>
  </header>
  <main id="view"></main>
  <div class="foot">Educclesia Group</div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc as _setDoc, updateDoc as _updateDoc, collection, getDocs, query, where, orderBy, limit, writeBatch as _writeBatch, deleteDoc as _deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBh_YwVF6xaQv0P5csZwhD9tzz3i7jv2_A",
  authDomain: "qum-sis.firebaseapp.com",
  projectId: "qum-sis",
  storageBucket: "qum-sis.firebasestorage.app",
  messagingSenderId: "324861037215",
  appId: "1:324861037215:web:32f3e749d2fcac93d430aa"
};
const OWNER = "joon.kim@educclesia.com";   // 플랫폼 소유자(에듀클레시아)
const DEFAULT_SCHOOL = "qum";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT; const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); };

/* ---------- 세션 ---------- */
let me = null;          // {email, name, role, schoolId, studentId}
let school = null;      // settings doc
let sid = DEFAULT_SCHOOL;
const col = name => collection(db, "schools", sid, name);
const ref = (name, id) => doc(db, "schools", sid, name, String(id));

/* ---------- 변경 이력: 모든 쓰기를 schools/{sid}/audit 에 자동 기록 (교장만 열람) ---------- */
const AUDIT_BEFORE=new Set(["grades","attendance","incidents","students","activities","memberships","accounts","comments"]);
const pathInfo = r => { const p=r.path.split("/"); return {path:r.path, col:p[0]==="schools"?(p[2]||"school"):p[0], docId:p[p.length-1]}; };
const auditJson = v => { if (v==null) return ""; try { const s=JSON.stringify(v,(k,x)=> (x && typeof x==="object" && !Array.isArray(x) && Object.getPrototypeOf(x)!==Object.prototype) ? (x.seconds!=null? new Date(x.seconds*1000).toISOString().slice(0,19) : "(저장 시각)") : x); return s.length>4000? s.slice(0,4000)+"…" : s; } catch(e){ return ""; } };
const stuOf = (c,id,d,b) => (d&&d.studentId) || (b&&b.studentId) || (c==="students"||c==="accounts" ? id : (c==="grades"||c==="attendance") ? String(id).split("_")[0] : "");
async function beforeOf(r){ if (!me) return undefined; if (!AUDIT_BEFORE.has(pathInfo(r).col)) return undefined; try { const x=await getDoc(r); return x.exists()? x.data() : null; } catch(e){ return undefined; } }
function audit(r, op, data, before){ if (!me) return; const {path,col:c,docId}=pathInfo(r); if (c==="audit") return; const st=stuOf(c,docId,data,before);
  _setDoc(doc(collection(db,"schools",sid,"audit")), {path, col:c, docId, op, count:1, studentIds: st?[String(st)]:[], data:auditJson(data), before: before===undefined? null : auditJson(before), by:me.email, role:me.role, at:serverTimestamp()}).catch(e=>console.warn("audit",e)); }
async function setDoc(r,d,o){ const b=await beforeOf(r); const x = o ? await _setDoc(r,d,o) : await _setDoc(r,d); audit(r, o&&o.merge?"merge":"set", d, b); return x; }
async function updateDoc(r,d){ const b=await beforeOf(r); await _updateDoc(r,d); audit(r,"update",d,b); }
async function deleteDoc(r){ const b=await beforeOf(r); await _deleteDoc(r); audit(r,"delete",null,b); }
function writeBatch(dbx){ const b=_writeBatch(dbx), ops=[];
  const w={ set(r,d,o){ o? b.set(r,d,o) : b.set(r,d); ops.push([r,"set",d]); return w; }, update(r,d){ b.update(r,d); ops.push([r,"update",d]); return w; }, delete(r){ b.delete(r); ops.push([r,"delete",null]); return w; },
    async commit(){ await b.commit(); if (!me||!ops.length) return; const cols={}, stu=new Set();
      ops.forEach(([r,op,d])=>{ const i=pathInfo(r); cols[i.col]=(cols[i.col]||0)+1; const x=stuOf(i.col,i.docId,d); if (x) stu.add(String(x)); });
      _setDoc(doc(collection(db,"schools",sid,"audit")), {op:"batch", col:Object.keys(cols).join(","), cols, count:ops.length, studentIds:[...stu].slice(0,300), data:auditJson(ops.slice(0,25).map(([r,op,d])=>({path:r.path,op,d}))), before:null, by:me.email, role:me.role, at:serverTimestamp()}).catch(e=>console.warn("audit",e)); } };
  return w; }

const ROLES = { owner:"소유자", admin:"행정", principal:"교장", teacher:"교사", student:"학생" };
const can = {
  manage: () => ["owner","admin","principal"].includes(me.role),
  settings: () => ["owner","principal"].includes(me.role),
};

async function resolveMember(user){
  const email = user.email.toLowerCase();
  if (email === OWNER) {
    // 소유자 첫 로그인: 학교·멤버십 없으면 만든다
    const m = await getDoc(doc(db,"memberships",email));
    if (!m.exists()) await setDoc(doc(db,"memberships",email), {schoolId:DEFAULT_SCHOOL, role:"owner", createdAt:serverTimestamp()});
    sid = m.exists() ? m.data().schoolId : DEFAULT_SCHOOL;
    const s = await getDoc(doc(db,"schools",sid));
    if (!s.exists()) await setDoc(doc(db,"schools",sid), {
      name:"Qum Academic System", nameKo:"쿰 아카데믹 시스템", schoolName:"Qum Educlesia", schoolNameKo:"이오에스 미래 리더스",
      logoUrl:"", color:"#6b1f2a", accent:"#b8923a", address:"", phone:"", ceeb:"", principal:"Joon Kim",
      termCode:"2026F", nextId:9001, createdAt:serverTimestamp()
    });
    return {email, name:user.displayName, role:"owner"};
  }
  const m = await getDoc(doc(db,"memberships",email));
  if (!m.exists()) return null;
  sid = m.data().schoolId;
  return {email, name:user.displayName, role:m.data().role, studentId:m.data().studentId||null};
}

async function loadSchool(){
  school = (await getDoc(doc(db,"schools",sid))).data();
  document.documentElement.style.setProperty("--brand", school.color || "#6b1f2a");
  document.documentElement.style.setProperty("--accent", school.accent || "#b8923a");
  $("#topTitle").textContent = school.name; $("#loginTitle").textContent = school.name;
  document.title = school.name;
  for (const id of ["topLogo","loginLogo"]) { const el=$("#"+id); el.hidden=!school.logoUrl; el.src=school.logoUrl||""; }
}

/* ---------- 로그인 ---------- */
$("#btnLogin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => {
  if (["auth/popup-blocked","auth/popup-closed-by-user","auth/cancelled-popup-request"].includes(e.code)) return signInWithRedirect(auth, new GoogleAuthProvider());
  toast("로그인 실패: "+e.code); console.error(e);
});
getRedirectResult(auth).catch(e=>{ toast("로그인 실패: "+e.code); console.error(e); });
$("#btnOut").onclick = () => signOut(auth);
onAuthStateChanged(auth, async user => {
  if (!user) { $("#login").hidden=false; $("#app").hidden=true; return; }
  $("#loginSub").textContent = user.email + " 확인 중…";
  try {
    const m = await resolveMember(user);
    if (!m) { toast("이 계정은 아직 등록되지 않았습니다. 학교에 문의하세요."); await signOut(auth); return; }
    me = m; await loadSchool();
    $("#meName").textContent = me.name || me.email; $("#meRole").textContent = ROLES[me.role] || me.role;
    $("#login").hidden=true; $("#app").hidden=false;
    buildNav(); route();
  } catch (e) {
    console.error(e); $("#loginSub").textContent = "오류: " + (e.code || e.message);
    toast("오류: " + (e.code || e.message));
  }
});

/* ---------- 라우터 ---------- */
const routes = {
  "":        {label:"현황",       show:()=>me.role!=="student", view:viewHome},
  "students":{label:"학생",       show:()=>can.manage() || me.role==="teacher", view:viewStudents},
  "courses": {label:"과목",       show:()=>can.manage() || me.role==="teacher", view:viewCourses},
  "attendance":{label:"출결",     show:()=>can.manage() || me.role==="teacher", view:viewAttendance},
  "sections":{label:"반·진도",    show:()=>can.manage() || me.role==="teacher", view:viewSections},
  "biweekly":{label:"출결 확인서", show:()=>can.manage() || me.role==="teacher", view:viewBiweekly},
  "slips":   {label:"슬립 승인",  show:()=>can.manage(),  view:viewSlips},
  "comments":{label:"세특·의견",   show:()=>can.manage() || me.role==="teacher", view:viewComments},
  "report":  {label:"Progress Report", show:()=>can.manage() || me.role==="teacher", view:viewReport},
  "electives":{label:"선택과목 성적", show:()=>can.manage(), view:viewElectives},
  "genius":  {label:"Genius 갱신", show:()=>can.manage(),  view:viewGenius},
  "requests":{label:"수정 요청",  show:()=>can.manage(),  view:viewRequests},
  "new":     {label:"신입생 등록", show:()=>can.manage(),  view:viewNew},
  "import":  {label:"가져오기",   show:()=>can.manage(),  view:viewImport},
  "settings":{label:"학교 설정",  show:()=>can.settings(),view:viewSettings},
  "audit":   {label:"변경 이력",  show:()=>can.settings(),view:viewAudit},

const IMPORT_TYPES = {
  students:{label:"학생 명부", key:"id", cols:["id","last_en","first_en","name_ko","grade","dob","gender","address_en","address_ko","postal","email","genius_login","curriculum","apex_id","iready_id","status","note"], hint:"students_seed.csv 형식. 계정 열(genius_login·apex_id·iready_id)은 계정 컬렉션으로 따로 저장됩니다."},
  courses:{label:"과목", key:"code", cols:["code","title","area","weighted","credit","platform","active","note"], hint:"courses_seed.csv 형식. code가 비어 있으면 title로 식별(학교 선택과목)."},
  attendance:{label:"출결", key:"studentId", cols:["studentId","date","termCode","code","note","slipNo","approved","source"], hint:"attendance_seed.csv 형식. code는 u.t/u.a/e.t/e.a. 같은 학생·날짜는 덮어씀."},
  activities:{label:"수상·활동", key:"studentId", cols:["studentId","kind","awardType","name","date","description","test","subject","score","category","inside","position","rank","startDate","endDate","givenBy","hours","approved"], hint:"kind = award / test / activity / volunteer. 박재영 Student Information Sheet 양식 그대로."},
  grades:{label:"성적", key:"studentId", cols:["studentId","code","title","school","gLevel","termCode","grade","credit","weighted","source"], hint:"grades_seed_g12.csv 형식. termCode는 2026F/2026S/2026U. 같은 학생·학기·과목은 덮어씀. grade 열이 없으면 있는 열만 갱신(예: 미리 주차 grades_patch_miri_weeks_2026F.csv)."},
};
let importRows = [], importType = "students";
async function viewImport(){
  $("#view").innerHTML = `<div class="card"><h2>가져오기</h2>
    <div class="tabs">${Object.entries(IMPORT_TYPES).map(([k,t])=>`<button data-t="${k}" class="${k===importType?"on":""}">${t.label}</button>`).join("")}</div>
    <p class="muted" id="hint">${IMPORT_TYPES[importType].hint}</p>
    <div class="row"><input type="file" id="file" accept=".csv,.tsv,.txt" style="max-width:320px"><span class="muted">또는 아래에 붙여넣기</span></div>
    <textarea id="paste" rows="5" placeholder="CSV 또는 탭 구분 텍스트를 붙여넣으세요 (첫 줄은 열 이름)" style="margin-top:8px"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="parse">미리보기</button></div></div>
    <div class="card" id="preview" hidden><h2>미리보기 — 셀을 눌러 바로 고칠 수 있습니다</h2>
    <div class="scroll"><table id="pt"></table></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="save">저장 (모두 '확인 필요'로 표시)</button><span class="muted" id="cnt"></span></div></div>`;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{importType=b.dataset.t; viewImport();});
  $("#file").onchange = async e => { $("#paste").value = await e.target.files[0].text(); };
  $("#parse").onclick = () => {
    importRows = parseDelimited($("#paste").value);
    if (!importRows.length) return toast("읽을 줄이 없습니다");
    const have = Object.keys(importRows[0]); const known = IMPORT_TYPES[importType].cols; const cols = have;
    const missing = [IMPORT_TYPES[importType].key].filter(c=>!have.includes(c)); const unknown = have.filter(c=>!known.includes(c));
    $("#pt").innerHTML = `<thead><tr>${cols.map(c=>`<th>${c}${known.includes(c)?"":" <span class='tag'>추가 열</span>"}</th>`).join("")}</tr></thead>
      <tbody>${importRows.map((r,i)=>`<tr>${cols.map(c=>`<td contenteditable data-i="${i}" data-c="${c}">${esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody>`;
    $("#pt").oninput = e => { const td=e.target.closest("td"); if (td) importRows[td.dataset.i][td.dataset.c]=td.textContent.trim(); };
    $("#cnt").textContent = `${importRows.length}줄` + (missing.length?` · 필수 열 없음: ${missing.join(", ")}`:"") + (unknown.length?` · 그대로 저장되는 추가 열: ${unknown.join(", ")}`:"");
    $("#save").disabled = missing.length>0;
    $("#preview").hidden=false;
  };
  $("#save").onclick = async () => {
    let n=0, skipped=0, batch = writeBatch(db), ops=0;
    const flush = async()=>{ if (ops){ await batch.commit(); batch=writeBatch(db); ops=0; } };
    const stamp = {needsReview:true, importedAt:serverTimestamp(), importedBy:me.email};
    for (const r of importRows){
      if (importType==="students"){
        const id=r.id; if (!id){skipped++;continue;}
        const acc={}, stu={}; for (const [k,v] of Object.entries(r)) if (v!=="") (ACCOUNT_FIELDS.some(f=>f[0]===k) ? acc : stu)[k]=v;
        batch.set(ref("students",id), {...stu, ...stamp}, {merge:true}); batch.set(ref("accounts",id), acc, {merge:true}); ops+=2;
      } else if (importType==="courses"){
        const cid = courseId(r); if (!cid){skipped++;continue;}
        batch.set(ref("courses",cid), {...r, credit:parseFloat(r.credit)||0, active:r.active!=="N", updatedAt:serverTimestamp()}, {merge:true}); ops++;
      } else if (importType==="attendance"){
        if (!r.studentId || !r.date || !r.code){skipped++;continue;}
        batch.set(ref("attendance",`${r.studentId}_${r.date}`), {studentId:String(r.studentId), date:r.date, termCode:r.termCode||termOf(r.date), code:r.code.trim().toLowerCase(), note:r.note||"", slipNo:r.slipNo||"", approved:/^(Y|1|true)$/i.test(r.approved||""), source:r.source||"sheet", importedAt:serverTimestamp(), importedBy:me.email}, {merge:true}); ops++;
      } else if (importType==="activities"){
        if (!r.studentId || !r.kind){skipped++;continue;}
        const o={}; for (const [k,v] of Object.entries(r)) if (v!=="") o[k]=v;
        batch.set(doc(col("activities")),{...o,studentId:String(r.studentId),approved:/^(Y|1|true)$/i.test(r.approved||""),source:"sheet",importedAt:serverTimestamp(),importedBy:me.email}); ops++;
      } else if (importType==="grades"){
        if (!r.studentId || !r.termCode || !r.title){skipped++;continue;}
        const cid = courseId(r); const gid = `${r.studentId}_${r.termCode}_${cid}`.replace(/[\/\s]/g,"_");
        const wl = r.weekList!==undefined ? String(r.weekList).split(/[\s,;]+/).filter(Boolean).map(Number).filter(x=>!isNaN(x)) : undefined;
        if (!("grade" in r)){   // 부분 갱신: grade 열이 없으면 있는 열만 덮어씀 (예: 미리 주차 weekList)
          const o={}; if (wl) o.weekList=wl; for (const k of ["score","behind"]) if (r[k]!==undefined&&r[k]!=="") o[k]=parseFloat(r[k]); for (const k of ["subjectKo","level","kTerm","transcriptGrade"]) if (r[k]) o[k]=r[k];
          batch.set(ref("grades",gid), {...o, updatedAt:serverTimestamp(), updatedBy:me.email}, {merge:true}); ops++; n++; if (ops>=400) await flush(); continue; }
        const extra={}; if (wl) extra.weekList=wl; if (r.score!==undefined&&r.score!=="") extra.score=parseFloat(r.score); if (r.subjectKo) extra.subjectKo=r.subjectKo; if (r.level) extra.level=r.level; if (r.transcriptGrade) extra.transcriptGrade=r.transcriptGrade; if (r.weeks) extra.weeks=parseInt(r.weeks); if (r.kTerm) extra.kTerm=r.kTerm;
        batch.set(ref("grades",gid), {studentId:String(r.studentId), courseId:cid, code:r.code||"", title:r.title, school:r.school||school.schoolName, gLevel:parseInt(r.gLevel)||null, termCode:r.termCode, grade:r.grade||"IP", credit:parseFloat(r.credit)||0, weighted:/^(Y|1|true)$/i.test(r.weighted||""), source:r.source||"past", ...extra, ...stamp}, {merge:true}); ops++;
      }
      n++; if (ops>=400) await flush();
    }
    await flush();
    toast(`${n}줄 저장${skipped?`, ${skipped}줄 건너뜀`:""}`); location.hash = importType==="courses" ? "#/courses" : importType==="attendance" ? "#/attendance" : "#/students";
  };
}
function parseDelimited(text){
  text = text.replace(/\r/g,"").trim(); if (!text) return [];
  const delim = text.split("\n")[0].includes("\t") ? "\t" : ",";
  const rows=[]; let row=[], cell="", inQ=false;
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if (inQ){ if (ch==='"'){ if (text[i+1]==='"'){cell+='"';i++;} else inQ=false; } else cell+=ch; }
    else if (ch==='"') inQ=true;
    else if (ch===delim){ row.push(cell); cell=""; }
    else if (ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch; }
  row.push(cell); rows.push(row);
  const hdr = rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(c=>c.trim())).map(r=>Object.fromEntries(hdr.map((h,i)=>[h,(r[i]||"").trim()])));
}

/* ---------- 공통: 학기·과목·GPA ---------- */
const subNav = (id, on) => `<div class="sub noprint"><a href="#/students/${id}" class="${on==="info"?"on":""}">정보</a><a href="#/students/${id}/grades" class="${on==="grades"?"on":""}">성적</a><a href="#/students/${id}/attendance" class="${on==="att"?"on":""}">출결</a><a href="#/students/${id}/activities" class="${on==="act"?"on":""}">수상·활동</a><a href="#/transcript/${id}" class="${on==="tr"?"on":""}">Transcript</a><a href="#/miri/${id}" class="${on==="miri"?"on":""}">학습성장기록부</a>${me&&can.settings()?`<a href="#/audit/${id}">변경 이력</a>`:""}</div>`;
const slug = t => String(t).toLowerCase().replace(/[^a-z0-9가-힣]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const courseId = r => r.code ? String(r.code).trim() : (r.title ? "t_"+slug(r.title.replace(/\s+Sem\s*[12].*$/i,"")) : "");
function termLabel(tc){ const m=/^(\d{4})([FSU])$/.exec(tc||""); if(!m) return tc||""; const y=+m[1];
  return m[2]==="F" ? `Fall ${y}-${String(y+1).slice(2)}` : (m[2]==="S"?`Spring ${y-1}-${String(y).slice(2)}`:`Summer ${y-1}-${String(y).slice(2)}`); }
const termKey = tc => { const m=/^(\d{4})([FSU])$/.exec(tc||""); return m ? +m[1] + ({F:0.5,S:0,U:0.25}[m[2]]) : 0; };
const PTS={A:4,B:3,C:2,D:1,F:0}, WPTS={A:5,B:4,C:3,D:2,F:1.7};
function gpaOf(rows){ // 학점 가중 평균 (카운슬러 시트와 동일)
  const done=rows.filter(r=>r.grade in PTS && r.credit>0); const cr=done.reduce((a,r)=>a+r.credit,0);
  if (!cr) return {u:0,w:0,credits:0};
  return {u:done.reduce((a,r)=>a+PTS[r.grade]*r.credit,0)/cr, w:done.reduce((a,r)=>a+(r.weighted?WPTS:PTS)[r.grade]*r.credit,0)/cr, credits:cr};
}
const f2 = n => (Math.round(n*100)/100).toFixed(2);
const AREA_RANK={"2":0,"3":1,"1":2,"4":3,"5":4,"6":5,"7":6,"8":7,"9":8};  // 영어·수학·사회·과학·외국어·예술·경영·체육·학교선택
const areaRank = c => c ? (AREA_RANK[String(c)[0]] ?? 8) : 9;              // 코드 없는 선택과목은 맨 뒤
async function loadGrades(id){ const q=query(col("grades"), where("studentId","==",String(id))); return (await getDocs(q)).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>termKey(a.termCode)-termKey(b.termCode) || (a.gLevel||0)-(b.gLevel||0) || areaRank(a.code)-areaRank(b.code) || String(a.code).localeCompare(b.code) || String(a.title).localeCompare(b.title)); }
let courseCache=null; async function loadCourses(){ if(!courseCache){ courseCache=(await getDocs(col("courses"))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.code||"zz").localeCompare(b.code||"zz")||a.title.localeCompare(b.title)); } return courseCache; }

const isoLocal = t => { t=new Date(t); t.setMinutes(t.getMinutes()-t.getTimezoneOffset()); return t.toISOString().slice(0,10); };
const addDays = (d,n) => { const t=new Date(d+"T00:00:00"); t.setDate(t.getDate()+n); return isoLocal(t); };
const termKo = tc => { const m=/^(\d{4})([FSU])$/.exec(tc||""); if(!m) return tc||""; const y=+m[1]; return m[2]==="F" ? `${y}-${String(y+1).slice(2)} 가을학기` : m[2]==="S" ? `${y-1}-${String(y).slice(2)} 봄학기` : `${y-1}-${String(y).slice(2)} 여름학기`; };

    ${roster.map(st=>{ const rows=rowsOf(st); return rows.map((r,i)=>{ const pid=`${id}_${st.id}_${r.key}`; const p=prog[pid]||{}; return `<tr data-pid="${pid}" data-s="${st.id}" data-k="${r.key}" data-t="${esc(r.title)}" ${i===0?'style="border-top:2px solid var(--line)"':""}>

      <td class="nw">${esc(r.title)}</td><td class="nw muted" style="font-size:12.5px">${gcell(r)}</td><td class="nw">${btns(eff(p,r))}</td>

    const save=async(status)=>{ const cur=prog[pid]||{}; const st=status??cur.status; if(!st) return toast("상태를 먼저 고르세요");

    $("#svR").onclick=async()=>{ const ids=[...document.querySelectorAll("[data-r]:checked")].map(c=>c.dataset.r); await updateDoc(ref("sections",id),{studentIds:ids,updatedAt:serverTimestamp(),by:me.email}); toast("저장"); sectionCache=null; viewSection(id); }; };
}

const ACT_KINDS = {

  volunteer:{label:"교내 봉사 In-School Volunteer", fields:[["date","날짜","date"],["givenBy","담당 교사"],["name","행사·내용"],["hours","시간","number"]], cols:["date","givenBy","name","hours"]},
};
let actKind="award";
async function viewStudentActivities(id){
  const isSelf = me.role==="student" && me.studentId===String(id);
  const staff = can.manage()||me.role==="teacher";
  const [s, as] = await Promise.all([getDoc(ref("students",id)), getDocs(query(col("activities"), where("studentId","==",String(id))))]);
  if (!s.exists()) return $("#view").innerHTML="<p>없는 학생입니다.</p>";

  const K=ACT_KINDS[actKind], rows=all.filter(r=>r.kind===actKind);

    <div class="tabs">${Object.entries(ACT_KINDS).map(([k,v])=>`<button data-k="${k}" class="${k===actKind?"on":""}">${v.label} <span class="tag">${all.filter(r=>r.kind===k).length}</span></button>`).join("")}</div>
    ${canAdd?`<form id="af" class="card" style="background:var(--paper)"><div class="grid">${K.fields.map(f=>fh(f,"")).join("")}</div><input type="hidden" name="_id"><div class="row" style="margin-top:10px"><button class="btn sm" id="afBtn">추가</button><button type="button" class="btn sm ghost" id="afReset" hidden>취소</button></div></form>`:""}
    <div class="scroll"><table><thead><tr>${K.fields.map(f=>`<th>${f[1]}</th>`).join("")}<th>상태</th><th></th></tr></thead><tbody>
    ${rows.map(r=>`<tr>${K.fields.map(f=>`<td>${esc(r[f[0]]).replace(/\n/g,"<br>")}</td>`).join("")}<td class="nw">${r.approved?`<span class="tag ok">승인</span>`:`<span class="tag pend">대기</span>`}</td>
      <td class="nw">${staff&&can.manage()?`<label><input type="checkbox" data-ok="${r.id}" ${r.approved?"checked":""} style="width:auto"> 승인</label> `:""}${(can.manage()||(isSelf&&!r.approved))?`<button class="btn sm ghost" data-e="${r.id}">수정</button> <button class="btn sm ghost" data-del="${r.id}">×</button>`:""}</td></tr>`).join("")||`<tr><td colspan="${K.fields.length+2}" class="muted">아직 없음</td></tr>`}
    </tbody></table></div>
    ${isSelf?`<p class="muted" style="margin-top:10px">입력한 내용은 선생님이 확인한 뒤 성적표·기록부에 실립니다. 승인된 항목은 학교에 수정을 요청하세요.</p>`:""}</div>`;

  }
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("지울까요?")) return; await deleteDoc(ref("activities",b.dataset.del)); viewStudentActivities(id); });

}

  document.querySelectorAll("[data-done]").forEach(el=>el.onchange=async()=>{ await updateDoc(ref("requests",el.dataset.done),{status:el.checked?"done":"open",doneBy:me.email,doneAt:serverTimestamp()}); });
}

/* ---------- 학습성장기록부 (한국 생기부 양식) ---------- */
const MIRI_ORDER=["국어","수학","영어","사회","도덕","한국사","과학"];
const KO_GROUP={"국어":"국어","수학":"수학","영어":"영어","사회":"사회(역사포함)/도덕","도덕":"사회(역사포함)/도덕","한국사":"사회(역사포함)/도덕","과학":"과학"};
const miriGrade = sc => sc>=60?"A":sc>=50?"B":sc>=40?"C":"F";
const ayOf = tc => { const m=/^(\d{4})([FSU])$/.exec(tc||""); return m? (m[2]==="F"? +m[1] : +m[1]-1) : null; };
// 한국 학년도·학기: 3~8월 = 1학기, 9~2월 = 2학기 (2월은 전년도 2학기)
const kTermOfDate = d => { const [y,m]=String(d).split("-").map(Number); return (m>=3&&m<=8)? `${y}K1` : (m>=9? `${y}K2` : `${y-1}K2`); };
const kTermOfUS = tc => { const m=/^(\d{4})([FSU])$/.exec(tc||""); return m? (m[2]==="F"? `${m[1]}K2` : `${m[1]}K1`) : null; };
const kAY = kt => +String(kt).slice(0,4); const kSem = kt => String(kt).endsWith("K1")?"1":"2";
const kGradeLabel = g => g>=10? `고${g-9}` : g>=7? `중${g-6}` : g>=1? `초${g}` : "";
const AREA_KO={"1":"사회","2":"영어","3":"수학","4":"과학","5":"외국어","6":"예술","7":"교양","8":"체육","9":"선택"};
async function viewMiri(id){
  const staff=can.manage()||me.role==="teacher";
  const [s, all, as, acts, cms, U]=await Promise.all([getDoc(ref("students",id)), loadGrades(id), getDocs(query(col("attendance"), where("studentId","==",String(id)))), getDocs(query(col("activities"), where("studentId","==",String(id)))), staff?getDocs(query(col("comments"), where("studentId","==",String(id)))):Promise.resolve({docs:[]}), loadUnits()]);
  if (!s.exists()) return $("#view").innerHTML="<p>없는 학생입니다.</p>";
  const d=s.data(); const birthY=parseInt((d.dob||"").slice(0,4))||null;
  const kGradeOf = ay => birthY? ay-birthY-6 : null;   // 학령 기준: 7세 초1
  const today=new Date(); const todayKo=`${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일`;
  const us = x => x? `${x.slice(0,4)}.${x.slice(5,7)}.${x.slice(8,10)}.` : "";
  // 출결: 학년별
  const Z=()=>({"e.a":0,"e.t":0,"u.a":0,"u.t":0});
  const att={}; as.docs.forEach(x=>{ const r=x.data(); const kt0=kTermOfDate(r.date); const ay=kAY(kt0); const t=att[ay]=att[ay]||{"1":Z(),"2":Z()}; t[kSem(kt0)][finalCode(r)]++; });
  const attCell=(ay,c)=>{ const a=att[ay]["1"][c], b=att[ay]["2"][c]; return a+b ? `${a+b} <span style="font-size:8pt">(${a}/${b})</span>` : "0"; };
  const attGrades=Object.keys(att).map(Number).sort((a,b)=>a-b);
  // 수상·활동·봉사 (승인된 것만)
  const A=acts.docs.map(x=>x.data()).filter(a=>a.approved);
  const awards=A.filter(a=>a.kind==="award").sort((a,b)=>String(a.date||"").localeCompare(b.date||""));
  const activities=A.filter(a=>a.kind==="activity").sort((a,b)=>String(a.startDate||"").localeCompare(b.startDate||""));
  const vols=A.filter(a=>a.kind==="volunteer").sort((a,b)=>String(a.date||"").localeCompare(b.date||""));
  // 교과: 학년별 → 학기별
  const miri=all.filter(r=>r.source==="miri"); const apex=all.filter(r=>r.source!=="miri" && r.grade!=="IP" && r.credit>0 && r.school===school.schoolName);
  const kt = r => r.kTerm || kTermOfUS(r.termCode);
  const ays=[...new Set([...miri,...apex].map(r=>kAY(kt(r))))].filter(x=>x).sort();
  const comments=cms.docs.map(x=>({id:x.id,...x.data()})).filter(c=>c.kind!=="pr");
  const cell=(v)=>v==null||v===""?"&nbsp;":esc(v);
  const T=(hdr,rows,cls="")=>`<table class="sg ${cls}"><thead><tr>${hdr.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.join(""):`<tr><td colspan="${hdr.length}" class="c">해당 사항 없음</td></tr>`}</tbody></table>`;
  const subjectRows = ay => {
    const out=[];
    for (const sem of ["1","2"]){ const k=`${ay}K${sem}`;
      for (const sub of MIRI_ORDER){ const r=miri.find(x=>kt(x)===k&&x.subjectKo===sub); if (!r) continue;
        out.push(`<tr><td class="c">${sem}</td><td>${KO_GROUP[sub]}</td><td>${sub}</td><td class="c">${r.score}</td><td class="c">${miriGrade(r.score)}</td><td class="muted">미리 (${esc(r.level||"")})</td></tr>`); }
      for (const r of apex.filter(x=>kt(x)===k).sort((a,b)=>areaRank(a.code)-areaRank(b.code))){
        out.push(`<tr><td class="c">${sem}</td><td>${AREA_KO[String(r.code||"9")[0]]||"선택"} (심화)</td><td>${esc(r.title)}</td><td class="c">—</td><td class="c">${esc(r.grade)}</td><td class="muted">미국 교육과정 ${termLabel(r.termCode)}${r.weighted?" · Honors/AP":""}</td></tr>`); }
    }
    return out; };
  // 세특: 학기별로 미리 과목은 [통과 단원 자동 문장 + 교사 관찰], 그 밖의 과목·공통은 교사 입력 그대로
  const commentRows = ay => { const out=[];
    for (const sem of ["1","2"]){ const k=`${ay}K${sem}`; const cs=comments.filter(c=>kTermOfUS(c.termCode)===k);
      for (const sub of MIRI_ORDER){ const r=miri.find(x=>kt(x)===k&&x.subjectKo===sub); const tc=cs.filter(c=>c.subject===sub).map(c=>c.text).join(" ");
        const auto=r?unitSentence(U,r):""; if (!auto&&!tc) continue;
        out.push(`<div><b>(${sem}학기)${sub}:</b> ${esc([auto,tc].filter(Boolean).join(" "))}</div>`); }
      cs.filter(c=>!MIRI_ORDER.includes(c.subject)).sort((a,b)=>String(a.subject).localeCompare(b.subject)).forEach(c=>out.push(`<div><b>(${sem}학기)${esc(c.subject||"공통")}:</b> ${esc(c.text)}</div>`)); }
    return out.join("")||`<div class="muted">기록 없음</div>`; };
  $("#view").innerHTML=`<div class="noprint row" style="max-width:860px;margin:0 auto 12px">${subNav(id,"miri")}<button class="btn sm" id="pr">인쇄 / PDF 저장</button></div>
  <div class="tr sgdoc" style="max-width:860px">
    <h1 style="text-align:center;font-size:19pt;margin:0 0 18px;font-family:'Noto Serif KR',serif">학습성장기록부</h1>
    <table class="sg" style="margin-bottom:14px"><tr><th style="width:90px">학교</th><td>${esc(school.schoolNameKo||school.schoolName)}</td><th style="width:90px">학번</th><td>${esc(id)}</td><th style="width:110px">학년 (학령)</th><td>${(()=>{const now=new Date(); const ay=now.getMonth()+1>=3?now.getFullYear():now.getFullYear()-1; const g=kGradeOf(ay); return g?`${kGradeLabel(g)} <span class="muted">(미국 ${esc(d.grade)}학년)</span>`:esc(d.grade);})()}</td></tr></table>
    <h3>1. 인적·학적사항</h3>
    <table class="sg"><tr><th style="width:90px">학생정보</th><td colspan="5"><div>성명 : ${esc(d.name_ko||"")} (${esc(d.last_en)}, ${esc(d.first_en)}) &nbsp;&nbsp; 성별 : ${d.gender==="F"?"여":d.gender==="M"?"남":""} &nbsp;&nbsp; 생년월일 : ${us(d.dob)}</div><div>주소 : ${esc(d.address_ko||d.address_en||"")}</div></td></tr>
      <tr><th>학적사항</th><td colspan="5">${d.enrollDate?`${us(d.enrollDate)} ${esc(school.schoolNameKo||school.schoolName)} 입학`:""}${d.prevSchool?` (${esc(d.prevSchool)} 에서 전입)`:""}${d.track?` · 트랙 ${esc(d.track)}`:""}</td></tr>
      <tr><th>특기사항</th><td colspan="5">${esc(d.distinctions||"")}&nbsp;</td></tr></table>
    <h3>2. 출결상황</h3>
    ${T(["학년도","학년","결석 (인정)","결석 (미인정)","지각 (인정)","지각 (미인정)","특기사항"], attGrades.map(ay=>`<tr><td class="c">${ay}</td><td class="c">${kGradeLabel(kGradeOf(ay))}</td><td class="c">${attCell(ay,"e.a")}</td><td class="c">${attCell(ay,"u.a")}</td><td class="c">${attCell(ay,"e.t")}</td><td class="c">${attCell(ay,"u.t")}</td><td>&nbsp;</td></tr>`))}
    <div style="font-size:8pt;color:#444;margin-top:2px">· 학년 합계이며 괄호 안은 (1학기/2학기)입니다.</div>
    <h3>3. 수상경력</h3>
    ${T(["학년","수상명","등급(위)","수상연월일","수여기관"], awards.map(a=>`<tr><td class="c">${a.date?kGradeLabel(kGradeOf(kAY(kTermOfDate(a.date)))):""}</td><td>${esc(a.name)}</td><td class="c">${esc(a.description||"")}</td><td class="c">${us(a.date)}</td><td class="c">${a.awardType==="School"?esc(school.schoolNameKo||school.schoolName):esc(a.awardType||"")}</td></tr>`))}
    <h3>4. 창의적 체험활동상황</h3>
    ${T(["학년","영역","활동명","역할·결과","기간","특기사항"], activities.map(a=>`<tr><td class="c">${a.startDate?kGradeLabel(kGradeOf(kAY(kTermOfDate(a.startDate)))):""}</td><td class="c">${esc(a.category||"")}</td><td>${esc(a.name)}</td><td>${esc([a.position,a.rank].filter(Boolean).join(" · "))}</td><td class="c nw">${us(a.startDate)}${a.endDate?" ~ "+us(a.endDate):""}</td><td>${esc(a.description||"")}</td></tr>`))}
    <div style="margin-top:8px"><b>봉사활동실적</b></div>
    ${T(["일자 또는 기간","장소 또는 주관기관명","활동내용","시간","누계시간"], (()=>{let acc=0; return vols.map(v=>{acc+=parseFloat(v.hours)||0; return `<tr><td class="c nw">${us(v.date)}</td><td class="c">${esc(school.schoolNameKo||school.schoolName)}${v.givenBy?" ("+esc(v.givenBy)+")":""}</td><td>${esc(v.name)}</td><td class="c">${v.hours||""}</td><td class="c">${acc}</td></tr>`;});})())}
    <h3>5. 교과학습발달상황</h3>
    ${ays.map(ay=>`<div style="margin:8px 0 4px"><b>[${kGradeLabel(kGradeOf(ay))}]</b> <span class="muted">${ay}학년도 (3월~익년 2월)</span></div>
      ${T(["학기","교과","과목","원점수","성취도","비고"], subjectRows(ay))}
      <table class="sg" style="margin-top:-1px"><tr><th style="width:90px;vertical-align:top">세부능력 및 특기사항</th><td style="line-height:1.7">${commentRows(ay)}</td></tr></table>`).join("")||`<p class="muted">교과 기록 없음</p>`}
    <div style="font-size:8.5pt;color:#444;margin-top:12px;line-height:1.6">· 미리 과목의 원점수는 주차별 학습 평가 최고점의 학기 평균이며, 성취도는 A(60–100) · B(50–59) · C(40–49) · F(39 이하)로 표기합니다(검정고시 합격 기준 60점).<br>· 심화 과목은 미국 교육과정(Apex Learning) 성적을 그대로 표기하며, 미국 학기(Fall 8~12월, Spring 1~6월)를 한국 학기(1학기 3~8월, 2학기 9~2월)에 가까운 쪽으로 배치했습니다.<br>· 학년은 학령(만 나이 기준 3월 입학)으로 표기했습니다. 본교는 미국 학제로 운영되며 미국 학년은 괄호에 병기합니다.</div>
    <div class="sign" style="margin-top:24px"><div class="left">* 본 기록부는 학교 직인이 없으면 참고용입니다.</div><div><div class="sp"></div><div class="line">${esc(school.schoolNameKo||school.schoolName)} 교장 ${esc(school.principalKo||school.principal)}</div><div style="margin-top:4px;text-align:center">${todayKo}</div></div></div>
  </div>

    <form id="cf" class="row"><input name="termCode" value="${esc(school.termCode)}" style="max-width:90px" required><select name="subject" style="max-width:130px"><option>공통</option>${MIRI_ORDER.map(x=>`<option>${x}</option>`).join("")}<option>심화</option><option>체육</option><option>예술</option></select><input name="text" placeholder="~을 이해함, ~을 설명할 수 있음 (과정명·점수는 쓰지 않음 · 미리 단원 문장은 자동으로 앞에 붙음)" style="flex:1;min-width:300px" required><button class="btn sm">추가</button></form>
    <table style="margin-top:10px"><tbody>${comments.sort((a,b)=>termKey(b.termCode)-termKey(a.termCode)).map(c=>`<tr><td class="nw">${termLabel(c.termCode)}</td><td class="nw">${esc(c.subject)}</td><td>${esc(c.text)}</td><td class="muted nw">${esc(c.by||"")}</td><td><button class="btn sm ghost" data-cdel="${c.id}">×</button></td></tr>`).join("")}</tbody></table></div>`:""}`;
  $("#pr").onclick=()=>{ const t=document.title; document.title=`${d.last_en}_${d.first_en}_학습성장기록부_${today.toISOString().slice(0,10)}`; window.print(); document.title=t; };
  const cf=$("#cf"); if (cf){ cf.onsubmit=async e=>{ e.preventDefault(); const v=readForm(cf); await setDoc(doc(col("comments")),{studentId:String(id),termCode:v.termCode,subject:v.subject,text:v.text,by:me.email,at:serverTimestamp()}); toast("저장"); viewMiri(id); };
    document.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=async()=>{ if(!confirm("지울까요?")) return; await deleteDoc(ref("comments",b.dataset.cdel)); viewMiri(id); }); }

/* ---------- 세특·Progress Report 의견: 과목별 일괄 입력 ---------- */
// #/comments/{term}/{subject}/{mode: se|pr}/{houseId}
async function viewComments(){
  const P=location.hash.replace(/^#\/?/,"").split("/");
  const term=P[1]||school.termCode, subj=decodeURIComponent(P[2]||""), mode=P[3]==="pr"?"pr":"se", hid=P[4]||"";
  sectionCache=null;
  const [gs, ss, cs, secs, U] = await Promise.all([getDocs(query(col("grades"), where("termCode","==",term))), getDocs(col("students")), getDocs(query(col("comments"), where("termCode","==",term))), loadSections(), loadUnits()]);
  const names={}; ss.docs.forEach(d=>{ const x=d.data(); names[d.id]={n:`${x.last_en}, ${x.first_en}`, ko:x.name_ko||"", g:x.grade}; });
  const houses=secs.filter(x=>x.kind==="house"&&x.termCode===term).sort((a,b)=>a.title.localeCompare(b.title));
  const house=houses.find(x=>x.id===hid)||null;
  const grades=gs.docs.map(d=>d.data()); const subjOf=r=>r.source==="miri"? r.subjectKo : stripSem(r.title);
  const HOME="담임 종합";
  const subjects=[HOME, ...new Set(grades.map(subjOf).sort((a,b)=>a.localeCompare(b,"ko")))];
  let roster = subj===HOME ? [...new Set(grades.map(r=>r.studentId))] : subj ? grades.filter(r=>subjOf(r)===subj).map(r=>r.studentId) : [];
  if (house) roster=roster.filter(id=>(house.studentIds||[]).includes(id));
  const studs=[...new Set(roster)].filter(id=>names[id]).map(id=>({id,...names[id]})).sort((a,b)=>(parseInt(a.g)||0)-(parseInt(b.g)||0)||String(a.n).localeCompare(b.n));
  const kindOf=x=>x.kind==="pr"?"pr":"se";
  const existing={}; cs.docs.forEach(d=>{ const x=d.data(); if (kindOf(x)===mode) existing[x.studentId+"|"+x.subject]={id:d.id,text:x.text}; });
  const prevTerm = term.endsWith("F") ? `${term.slice(0,4)}S` : `${+term.slice(0,4)-1}F`;
  const pcs = subj ? (await getDocs(query(col("comments"), where("termCode","==",prevTerm)))).docs.map(d=>d.data()).filter(x=>x.subject===subj&&kindOf(x)===mode) : [];
  const prev={}; pcs.forEach(x=>prev[x.studentId]=x.text);
  const miriRow=id=>grades.find(r=>r.studentId===id&&r.source==="miri"&&r.subjectKo===subj);
  const isMiri=MIRI_ORDER.includes(subj);
  const hint = mode==="pr" ? (subj===HOME?"학부모께 드리는 학기 종합 의견 (생활·태도·성장)":"학부모께 드리는 과목 의견 (잘한 점·더 노력할 점)") : `세특 (과정명·점수 없이, "~을 이해함 / ~을 설명할 수 있음")`;
  $("#view").innerHTML=`<div class="card"><h2>${mode==="pr"?"Progress Report 의견":"세부능력 및 특기사항"} — 과목별 입력</h2>
    <div class="row" style="margin-bottom:12px"><select id="cmode" style="max-width:230px"><option value="se" ${mode==="se"?"selected":""}>세특 (학습성장기록부)</option><option value="pr" ${mode==="pr"?"selected":""}>Progress Report 의견 (학부모용)</option></select>
      <input id="ct" value="${esc(term)}" style="max-width:90px" title="학기 코드"><select id="csub" style="max-width:300px"><option value="">과목 선택</option>${subjects.map(x=>`<option ${x===subj?"selected":""}>${esc(x)}</option>`).join("")}</select>
      <select id="chouse" style="max-width:180px"><option value="">모든 반</option>${houses.map(x=>`<option value="${x.id}" ${house&&x.id===house.id?"selected":""}>${esc(x.title)}</option>`).join("")}</select>
      <span class="muted">${subj?`${studs.length}명 · 칸에서 나가면 자동 저장 · Tab으로 다음 학생`:"이번 학기 성적 줄이 있는 과목만 보입니다"}</span></div>
    ${isMiri&&mode==="se"?`<p class="muted" style="margin-top:-4px">미리 과목은 통과한 주차의 단원 문장이 학습성장기록부 세특 앞에 자동으로 들어갑니다(가운데 회색 칸). 여기에는 그 뒤에 붙일 선생님 관찰만 쓰면 됩니다.</p>`:""}

      ${studs.map(st=>{ const ex=existing[st.id+"|"+subj]; const mr=isMiri?miriRow(st.id):null; const u=mr?unitsOf(U,mr):[];

    <div class="card" id="gmap" hidden></div><div class="card" id="gprev" hidden></div>`;

  $("#gparse").onclick=async()=>{
    const term2=$("#gt").value.trim(); if (term2!==term){ termGrades=(await getDocs(query(col("grades"), where("termCode","==",term2)))).docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.source!=="miri"); }
    const lines=$("#gp").value.replace(/\r/g,"").split("\n").filter(l=>l.includes("\t"));
    if (lines.length<2) return toast("탭으로 나뉜 표가 아닙니다. 표를 머리줄까지 선택해 복사하세요");
    rows=parseDelimited(lines.join("\n")); const hdr=Object.keys(rows[0]);
    const guess=k=>hdr.find(h=>COLS[k][1].test(h))||"";
    $("#gmap").hidden=false; $("#gmap").innerHTML=`<h2>열 짝 맞추기 <span class="muted" style="font-size:14px">${rows.length}줄</span></h2><div class="row">${Object.entries(COLS).map(([k,[l]])=>`<label style="font-size:13px">${l}<br><select data-m="${k}" style="max-width:220px"><option value="">(없음)</option>${hdr.map(h=>`<option ${h===guess(k)?"selected":""}>${esc(h)}</option>`).join("")}</select></label>`).join("")}<button class="btn sm" id="gplan" style="align-self:flex-end">짝 확인 → 대조</button></div>`;
    $("#gplan").onclick=()=>buildPlan(term2); buildPlan(term2);
  };
  const buildPlan=(term2)=>{
    const M={}; document.querySelectorAll("[data-m]").forEach(s=>M[s.dataset.m]=s.value);
    if (!(M.stu||M.id)||!M.course) return toast("학생과 과목 열은 꼭 골라야 합니다");
    const num=v=>{ const x=parseFloat(String(v??"").replace(/[^0-9.\-]/g,"")); return isNaN(x)?null:x; };
    plan=rows.map(r=>{ const title=String(r[M.course]||"").trim(); if(!title) return null;
      let cands=[]; const idv=String(r[M.id]||"").trim(); if (idv && studs.some(s=>s.id===idv)) cands=[idv]; else cands=[...(nameIdx[normN(r[M.stu])]||[])];
      const nt=normT(title); let match=null;
      if (cands.length>1){ const hit=cands.filter(c=>termGrades.some(g=>g.studentId===c&&normT(g.title)===nt)); if (hit.length===1) cands=hit; }
      const stid=cands.length===1?cands[0]:"";
      if (stid) match=termGrades.find(g=>g.studentId===stid&&normT(g.title)===nt)||null;
      const behind=M.behind? num(r[M.behind]) : null;
      return {raw:r[M.stu]||idv, cands, stid, title, match, score:M.score?num(r[M.score]):null, behind:behind==null?null:Math.max(0,Math.round(behind))}; }).filter(Boolean);
    drawPlan(term2); };
  const drawPlan=(term2)=>{
    const ok=plan.filter(p=>p.stid), upd=ok.filter(p=>p.match), neu=ok.filter(p=>!p.match), bad=plan.filter(p=>!p.stid);
    const sname=id=>{ const s=studs.find(x=>x.id===id); return s?`${s.last_en}, ${s.first_en} (${s.grade})`:id; };
    $("#gprev").hidden=false; $("#gprev").innerHTML=`<h2>대조 결과 — 갱신 ${upd.length} · 새 과목 ${neu.length} · 학생 못 찾음 ${bad.length}</h2>
      <div class="row" style="margin-bottom:10px"><button class="btn" id="gsave" ${ok.length?"":"disabled"}>반영 (${ok.length}줄)</button><span class="muted">새 과목은 '확인 필요'로 들어갑니다. 학생을 못 찾은 줄은 오른쪽에서 골라 주면 함께 반영됩니다.</span></div>
      <div class="scroll" style="max-height:60vh"><table><thead><tr><th>Genius 학생</th><th>SIS 학생</th><th>과목</th><th>점수</th><th>밀린</th><th>상태</th><th>구분</th></tr></thead><tbody>
      ${plan.map((p,i)=>`<tr ${p.stid?"":'style="background:#fff5f5"'}><td class="nw">${esc(p.raw)}</td><td class="nw">${p.stid?esc(sname(p.stid)):`<select data-pick="${i}" style="max-width:220px;padding:3px 6px"><option value="">— 고르기 —</option>${(p.cands.length?p.cands.map(c=>studs.find(s=>s.id===c)).filter(Boolean):studs.filter(s=>s.status==="active"||!s.status)).sort((a,b)=>String(a.last_en).localeCompare(b.last_en)).map(s=>`<option value="${s.id}">${esc(s.last_en)}, ${esc(s.first_en)} (${esc(s.grade)}) ${esc(s.id)}</option>`).join("")}</select>`}</td>
        <td>${esc(p.title)}</td><td class="c">${p.score??""}${p.match&&p.match.score!=null&&p.match.score!==p.score?` <span class="muted">(${p.match.score})</span>`:""}</td><td class="c">${p.behind??""}</td><td class="nw">${PROG[autoOf(p.behind)]?.l||""}</td><td class="nw">${!p.stid?'<span class="warn">학생?</span>':p.match?"갱신":'<span class="tag">새 과목</span>'}</td></tr>`).join("")}</tbody></table></div>`;
    document.querySelectorAll("[data-pick]").forEach(s=>s.onchange=()=>{ const p=plan[+s.dataset.pick]; p.stid=s.value; p.match=termGrades.find(g=>g.studentId===p.stid&&normT(g.title)===normT(p.title))||null; drawPlan(term2); });
    $("#gsave").onclick=async()=>{ const asOf=$("#gd").value||todayISO(); let b=writeBatch(db), n=0, nn=0;
      for (const p of plan.filter(x=>x.stid)){ const g={geniusAsOf:asOf}; if (p.score!=null) g.score=p.score; if (p.behind!=null){ g.behind=p.behind; g.auto=autoOf(p.behind); }
        if (p.match) b.update(ref("grades",p.match.id),g);
        else { const c=cs.find(x=>normT(x.title)===normT(p.title)); const cid=c? c.id : courseId({title:p.title}); const st=studs.find(s=>s.id===p.stid);
          b.set(ref("grades",`${p.stid}_${term2}_${cid}`.replace(/[\/\s]/g,"_")),{studentId:p.stid,courseId:cid,code:c?.code||"",title:p.title,school:school.schoolName,gLevel:parseInt(st?.grade)||null,termCode:term2,grade:"IP",credit:c?.credit??0.5,weighted:!!c?.weighted,source:c?.platform==="cw"?"cw":"apex",...g,needsReview:true,importedAt:serverTimestamp(),importedBy:"genius-refresh"},{merge:true}); nn++; }
        if (++n%400===0){ await b.commit(); b=writeBatch(db); } }
      await b.commit(); toast(`${n}줄 반영 (새 과목 ${nn})`); location.hash="#/sections"; };
  };
}

/* ---------- 미리 단원 (data/miri_units.json: "고졸|과학|1" → {t:제목, s:세특 문장}) ---------- */
let MIRI_UNITS=null;
async function loadUnits(){ if (!MIRI_UNITS){ try { MIRI_UNITS=await (await fetch("data/miri_units.json",{cache:"no-cache"})).json(); } catch(e){ console.warn(e); MIRI_UNITS={}; } } return MIRI_UNITS; }
const unitWeeks = r => Array.isArray(r.weekList) ? r.weekList : Array.from({length:parseInt(r.weeks)||0},(_,i)=>i+1);
const unitsOf = (U,r) => unitWeeks(r).map(w=>({w,...(U[`${r.level}|${r.subjectKo}|${w}`]||{})})).filter(x=>x.s);
const unitSentence = (U,r) => unitsOf(U,r).map(x=>x.s).join(" ");

/* ---------- Progress Report (한글 학업 보고서, 담임반 단위, 학생당 A4 1장) ---------- */
async function viewReport(){
  sectionCache=null; const secs=await loadSections();
  const parts=location.hash.replace(/^#\/?/,"").split("/"); const term=parts[2]||school.termCode;
  const houses=secs.filter(s=>s.kind==="house"&&s.termCode===term).sort((a,b)=>a.title.localeCompare(b.title));
  const h=houses.find(x=>x.id===parts[1])||(me.role==="teacher"?houses.find(x=>x.teacherEmail===me.email):null)||null;
  const go=()=>{ location.hash=`#/report/${$("#rH").value}/${$("#rT").value.trim()}`; };
  const head=`<div class="noprint card" style="max-width:760px;margin:0 auto 12px"><h2>Progress Report (학업 보고서)</h2>
    <div class="row"><select id="rH" style="max-width:220px"><option value="">담임반 선택</option>${houses.map(x=>`<option value="${x.id}" ${h&&x.id===h.id?"selected":""}>${esc(x.title)}</option>`).join("")}</select><input id="rT" value="${esc(term)}" style="max-width:90px" title="학기 코드">
      ${h?`<button class="btn sm" id="pr">인쇄 / PDF 저장</button><a class="btn sm ghost" href="#/comments/${esc(term)}/${encodeURIComponent("담임 종합")}/pr/${h.id}">담임 종합 의견 쓰기</a>`:""}</div>
    <p class="muted" style="margin:8px 0 0">학생당 A4 한 장. 과목 의견은 '세특·의견' 화면에서 종류를 <b>Progress Report 의견</b>으로 놓고 과목별로 한꺼번에 씁니다. 미리 과목의 '배운 내용'은 통과한 주차 단원으로 자동으로 채워집니다.</p></div>`;
  if (!h){ $("#view").innerHTML=head+(houses.length?"":`<p class="muted" style="text-align:center">이 학기 담임반이 없습니다. '반·진도'에서 먼저 만드세요.</p>`); $("#rH").onchange=go; $("#rT").onchange=go; return; }
  const ids=h.studentIds||[];
  const [U, ss, gs, cs, as, ps] = await Promise.all([loadUnits(), getDocs(col("students")), getDocs(query(col("grades"), where("termCode","==",term))), getDocs(query(col("comments"), where("termCode","==",term))), getDocs(query(col("attendance"), where("termCode","==",term))), getDocs(query(col("progress"), where("termCode","==",term)))]);
  const gnum=g=>parseInt(g)||99;
  const studs=ss.docs.map(d=>({id:d.id,...d.data()})).filter(s=>ids.includes(s.id)).sort((a,b)=>gnum(a.grade)-gnum(b.grade)||String(a.last_en).localeCompare(b.last_en));
  const grades=gs.docs.map(d=>d.data()); const att=as.docs.map(d=>d.data()); const prog=ps.docs.map(d=>d.data());
  const cm={}; cs.docs.forEach(d=>{ const x=d.data(); if (x.kind==="pr") cm[x.studentId+"|"+x.subject]=x.text; });
  const us = x => x? `${x.slice(0,4)}.${x.slice(5,7)}.${x.slice(8,10)}.` : "";
  const teacherName=(h.teacherEmail||"").split("@")[0];
  const page=st=>{
    const mine=grades.filter(r=>r.studentId===st.id);
    const miri=MIRI_ORDER.map(sub=>mine.find(r=>r.source==="miri"&&r.subjectKo===sub)).filter(Boolean);
    const us_=mine.filter(r=>r.source!=="miri").sort((a,b)=>areaRank(a.code)-areaRank(b.code)||String(a.title).localeCompare(b.title));
    const stOf=r=>{ const k=(r.courseId||courseId(r)||slug(r.title)).replace(/[\/\s.]/g,"_"); const p=prog.filter(x=>x.studentId===st.id&&x.courseId===k&&x.status).sort((a,b)=>String(b.date).localeCompare(a.date))[0];
      const s=(p&&(!r.auto||(p.date||"")>=(r.geniusAsOf||"")))?p.status:r.auto; return s?PROG[s]?.l||s:""; };
    const t={"e.a":0,"e.t":0,"u.a":0,"u.t":0}; att.filter(a=>a.studentId===st.id).forEach(a=>t[finalCode(a)]++);
    const miriRows=miri.map(r=>{ const u=unitsOf(U,r); return `<tr><td class="c" style="white-space:nowrap">${esc(r.subjectKo)}<br><span class="muted" style="font-size:7.5pt">${esc(r.level||"")}</span></td><td class="c">${r.score??""}</td><td class="c">${r.score!=null?miriGrade(r.score):""}</td>
      <td><div class="units">${u.length?u.map(x=>`${x.w}주 ${esc(x.t)}`).join("<br>"):"<span class='muted'>통과한 주차 없음</span>"}</div>${cm[st.id+"|"+r.subjectKo]?`<div class="tcm">${esc(cm[st.id+"|"+r.subjectKo])}</div>`:""}</td></tr>`; }).join("");
    const usRows=us_.map(r=>{ const k=stripSem(r.title); return `<tr><td>${esc(k)}${r.weighted?' <span class="muted">(Honors/AP)</span>':""}</td><td class="c">${r.score??""}</td><td class="c">${/^[A-F]|^P$/.test(r.grade||"")?esc(r.grade):""}</td><td class="c nw">${esc(stOf(r))}</td><td>${esc(cm[st.id+"|"+k]||"")}</td></tr>`; }).join("");
    return `<div class="bw prp"><div class="bwh"><div><h2>학업 성취 보고서 <span style="font-size:10pt;font-weight:400">Progress Report</span></h2><div>[${termKo(term)}]</div></div><div class="sch">${esc(school.schoolNameKo||school.schoolName)}<br>${esc(school.schoolName)}</div></div>
      <table class="sg"><tr><th>학생</th><td>${esc(st.last_en)}, ${esc(st.first_en)} ${st.name_ko?`(${esc(st.name_ko)})`:""}</td><th>학년</th><td class="c">${esc(st.grade)}</td><th>담임반</th><td>${esc(h.title)}</td><th>담임</th><td>${esc(teacherName)}</td></tr></table>
      ${miriRows?`<div class="prh">한국 교육과정 (미리)</div><table class="sg"><thead><tr><th>과목</th><th>점수</th><th>성취도</th><th style="width:auto">배운 내용 · 선생님 의견</th></tr></thead><tbody>${miriRows}</tbody></table>`:""}
      ${usRows?`<div class="prh">미국 교육과정</div><table class="sg"><thead><tr><th style="width:auto">과목</th><th>현재 점수</th><th>성적</th><th>진도</th><th style="width:45%">선생님 의견</th></tr></thead><tbody>${usRows}</tbody></table>`:""}
      <table class="sg"><thead><tr><th style="width:auto">출결 (학기 누적)</th><th>인정 결석</th><th>인정 지각</th><th>무단 결석</th><th>무단 지각</th></tr></thead><tbody><tr><td>${termLabel(term)}</td><td class="c">${t["e.a"]}</td><td class="c">${t["e.t"]}</td><td class="c">${t["u.a"]}</td><td class="c">${t["u.t"]}</td></tr></tbody></table>
      <table class="sg"><tr><th style="vertical-align:top;padding-top:6px">담임 종합 의견</th><td style="line-height:1.55;height:60px;vertical-align:top">${esc(cm[st.id+"|담임 종합"]||"")}</td></tr></table>
      <div style="font-size:7.5pt;color:#444;margin:3px 0 6px">미리 점수는 주차별 평가 최고점의 평균이며 성취도는 A(60–100)·B(50–59)·C(40–49)·F(39 이하)입니다. 진도: On Track = 계획대로 · Behind = 밀린 과제 5–10개 · Behind (10+) = 11개 이상.</div>
      <table class="sg sign3"><thead><tr><th style="width:auto">확인</th><th style="width:45%">서명</th><th style="width:25%">날짜</th></tr></thead><tbody><tr><td>학부모</td><td></td><td></td></tr><tr><td>담임 교사</td><td></td><td></td></tr></tbody></table></div>`; };
  $("#view").innerHTML=head+`<div id="prList">${studs.map(page).join("")||`<p class="muted" style="text-align:center">이 반에 학생이 없습니다.</p>`}</div>`;
  $("#rH").onchange=go; $("#rT").onchange=go;
  $("#pr").onclick=()=>{ const t=document.title; document.title=`ProgressReport_${h.title}_${term}`; window.print(); document.title=t; };
}

/* ---------- 선택과목 성적 일괄 입력 (과거 자체 선택과목: DIY·R&D 등) ---------- */
async function viewElectives(){
  const parts=location.hash.replace(/^#\/?/,"").split("/"); const term=parts[1]||""; const cid=decodeURIComponent(parts[2]||""); const showAll=parts[3]==="all";
  courseCache=null; const [cs, ss] = await Promise.all([loadCourses(), getDocs(col("students"))]);
  const electives=cs.filter(c=>!c.code||String(c.code).startsWith("9")||c.platform==="inhouse").sort((a,b)=>String(a.title).localeCompare(b.title));
  const c=cs.find(x=>x.id===cid);
  const curAY=ayOf(school.termCode), ay=ayOf(term);
  const gl=s=>{ const g=parseInt(s.grade); return g&&ay!=null? g-(curAY-ay) : null; };
  const go=(all)=>{ location.hash=`#/electives/${$("#et").value.trim()}/${encodeURIComponent($("#ec").value)}${all?"/all":""}`; };
  const termOK=/^\d{4}[FSU]$/.test(term);
  $("#view").innerHTML=`<div class="card"><h2>선택과목 성적 입력</h2>
    <p class="muted">과목과 학기를 고르면 그 학기 재학생 명단이 나옵니다. 성적을 고르고 '저장'. 과목이 목록에 없으면 '과목' 화면에서 코드 없이 추가하세요(코드 없는 자체 선택과목은 제목으로 구분). 여러 과목을 한꺼번에 넣을 때는 '가져오기 → 성적'에 CSV(studentId, termCode, title, grade, credit, source=elective)도 됩니다.</p>
    <div class="row"><input id="et" value="${esc(term)}" placeholder="학기 (2023S)" style="max-width:110px"><select id="ec" style="max-width:380px"><option value="">과목 선택</option>${electives.map(x=>`<option value="${esc(x.id)}" ${x.id===cid?"selected":""}>${esc(x.title)}${x.code?` (${esc(x.code)})`:""} · ${x.credit}학점</option>`).join("")}</select>
      ${termOK&&c?`<label style="font-size:13px"><input type="checkbox" id="eall" style="width:auto" ${showAll?"checked":""}> 학년과 상관없이 전체 학생</label>`:""}</div>
    <div id="eb" style="margin-top:12px">${!termOK?`<p class="muted">학기 코드를 넣으세요 (예: 2024F = Fall 2024-25, 2025S = Spring 2024-25).</p>`:!c?`<p class="muted">과목을 고르세요.</p>`:""}</div></div>`;
  $("#et").onchange=()=>go(); $("#ec").onchange=()=>go(); if ($("#eall")) $("#eall").onchange=e=>go(e.target.checked);
  if (!termOK||!c) return;
  const ex=(await getDocs(query(col("grades"), where("termCode","==",term)))).docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.courseId===c.id);
  const exBy={}; ex.forEach(r=>exBy[r.studentId]=r);
  const studs=ss.docs.map(d=>({id:d.id,...d.data()})).map(s=>({...s,gl:gl(s)})).filter(s=>exBy[s.id]||showAll||(s.gl!=null&&s.gl>=6&&s.gl<=12&&(s.status==="active"||!s.status||s.status==="graduated")))
    .sort((a,b)=>(a.gl??99)-(b.gl??99)||String(a.last_en).localeCompare(b.last_en));
  const G=["","A","B","C","D","F","P","IP"];
  $("#eb").innerHTML=`<div class="row" style="margin-bottom:8px"><b>${esc(c.title)}</b><span class="muted">${termLabel(term)} · ${c.credit}학점${c.weighted?" · "+esc(c.weighted):""} · 입력된 ${ex.length}명</span><button class="btn sm" id="esave">저장</button><span class="muted">빈칸으로 바꾸면 그 학생 성적 줄은 지워집니다.</span></div>
    <table><thead><tr><th>그때 학년</th><th>학생</th><th>성적</th></tr></thead><tbody>${studs.map(s=>`<tr><td>${s.gl??""}</td><td class="nw">${esc(s.last_en)}, ${esc(s.first_en)} <span class="muted">${esc(s.name_ko||"")} · ${esc(s.id)}</span></td>
      <td><select data-eg="${s.id}" style="max-width:90px;padding:3px 6px;${exBy[s.id]?"background:#eef7ee":""}">${G.map(g=>`<option ${(exBy[s.id]?.grade||"")===g?"selected":""}>${g}</option>`).join("")}</select></td></tr>`).join("")||`<tr><td colspan=3 class=muted>해당 학년 학생이 없습니다 — '전체 학생'을 켜 보세요.</td></tr>`}</tbody></table>`;
  $("#esave").onclick=async()=>{ let b=writeBatch(db), n=0, del=0;
    document.querySelectorAll("[data-eg]").forEach(sel=>{ const sidv=sel.dataset.eg, g=sel.value, old=exBy[sidv]; const s=studs.find(x=>x.id===sidv);
      if (!g){ if (old){ b.delete(ref("grades",old.id)); del++; } return; }
      if (old && old.grade===g) return;
      const gid=old?old.id:`${sidv}_${term}_${c.id}`.replace(/[\/\s]/g,"_");
      b.set(ref("grades",gid),{studentId:sidv,courseId:c.id,code:c.code||"",title:c.title,school:school.schoolName,gLevel:s?.gl||null,termCode:term,grade:g,credit:parseFloat(c.credit)||0,weighted:!!c.weighted,source:"elective",needsReview:false,enteredBy:me.email,enteredAt:serverTimestamp()},{merge:true}); n++; });
    await b.commit(); toast(`${n}명 저장${del?`, ${del}명 삭제`:""}`); viewElectives(); };
}

async function viewMe(){
  if (!me.studentId) { $("#view").innerHTML="<p>학생 ID가 연결되지 않았습니다. 학교에 문의하세요.</p>"; return; }
  return viewStudent(me.studentId);
}

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qum Academic System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#6b1f2a;        /* 버건디 */
  --brand-ink:#3f1118;
  --accent:#b8923a;       /* 골드 */
  --paper:#f6f1e7;        /* 모래 크림 */
  --paper-2:#ede5d6;
  --ink:#2a2420;
  --muted:#7a6f66;
  --line:#d9cfbf;
  --ok:#2f6b3a; --warn:#b3261e; --pending:#8a6d1f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:"Noto Serif KR",serif;margin:0}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:500}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
/* layout */
#top{background:var(--brand);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;height:58px;position:sticky;top:0;z-index:5}
#top .logo{display:flex;align-items:center;gap:10px}
#top .logo img{height:34px;width:34px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
#top .logo h1{font-size:18px;letter-spacing:.3px}
#top nav{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
#top nav a{color:#f3e6e8;text-decoration:none;padding:6px 10px;border-radius:5px;font-size:14px}
#top nav a.on,#top nav a:hover{background:rgba(255,255,255,.14);color:#fff}
#top .me{margin-left:auto;font-size:13px;opacity:.9;display:flex;gap:10px;align-items:center}
#top .me button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:5px;padding:4px 10px;font-size:12px}
main{max-width:1500px;margin:0 auto;padding:28px 24px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px}
.card h2{font-size:19px;color:var(--brand);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--paper-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px}
.grid label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 18px;min-width:140px}
.stat b{display:block;font-size:26px;font-family:"Noto Serif KR",serif;color:var(--brand)}
.stat span{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;background:var(--paper-2);padding:8px 8px;font-weight:600;font-size:12.5px;color:var(--brand-ink);position:sticky;top:0;z-index:1}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.nw,th.nw{white-space:nowrap}
td .btn.sm{padding:2px 7px;font-size:12px}
tr:hover td{background:#fbf8f2}
td[contenteditable]{outline:none;background:#fffdf7;border-bottom:1px dashed var(--accent)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:12px;background:var(--paper-2);color:var(--brand-ink)}
.tag.ok{background:#e3efe4;color:var(--ok)}.tag.warn{background:#f9e2df;color:var(--warn)}.tag.pend{background:#f3ead2;color:var(--pending)}
.muted{color:var(--muted);font-size:13px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brand-ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
[hidden]{display:none!important}
#login{min-height:100vh;display:grid;place-items:center}
.sub{display:flex;gap:6px;margin:-6px 0 14px}
.row .sub{margin:0}
.sub a{font-size:13px;color:var(--brand);text-decoration:none;padding:4px 10px;border:1px solid var(--line);border-radius:14px}
.sub a.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* transcript */
.tr{background:#fff;color:#000;font-family:"Noto Sans KR",Arial,sans-serif;font-size:10pt;max-width:1000px;margin:0 auto;padding:28px 34px;border:1px solid var(--line)}
.tr h1{font-family:Georgia,"Noto Serif KR",serif;font-size:20pt;margin:0;color:#000}
.tr .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:8px}
.tr .hd img{height:52px}
.tr .hd .sch{text-align:right;font-size:9.5pt;line-height:1.35;white-space:pre-line}
.tr .info{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:4px 14px;margin:10px 0;font-size:9.5pt}
.tr .info .addr{grid-column:1/-1;white-space:nowrap}
.tr .info b{display:block;font-size:8.5pt;color:#444;font-weight:600}
.tr .cum{border:1px solid #000;padding:6px 10px;display:flex;gap:26px;font-size:9.5pt;margin:8px 0 12px}
.tr table{font-size:9pt;table-layout:auto}
.tr td.ct{letter-spacing:-.2px}
.tr td.nw,.tr th.nw{white-space:nowrap}
.tr th{background:#ddd;color:#000;position:static;border-bottom:1px solid #000;padding:4px 6px;text-align:center}
.tr td.c{text-align:center}
.tr .side{display:grid;grid-template-columns:2fr 3fr;gap:4px 18px;align-items:start;margin:0 0 12px}
.tr .side .ft{font-size:8pt;color:#555}
.tr .side>div{min-width:0}
.tr .side table{width:100%}
.tr td{padding:3px 5px;border-bottom:0}
.tr tr.tot td{border-top:1px solid #999;font-weight:600;padding-bottom:8px}
.tr tr:hover td{background:transparent}
.tr .legend{display:grid;grid-template-columns:1.5fr 1.3fr 1fr auto;gap:22px;margin-top:16px;font-size:8.5pt;align-items:start}
.tr .legend>div{min-width:0}
.tr .legend>div:last-child{justify-self:end;text-align:left}
.tr .legend table{width:100%;font-size:9pt}
.tr .legend th,.tr .legend td{text-align:center;padding:3px 6px}
.tr .legend h4{text-align:left}
.tr .legend table{font-size:8.5pt}.tr .legend th{background:#eee;padding:2px 5px}.tr .legend td{padding:1px 5px}
.tr .legend h4{margin:0 0 4px;font-size:9pt}
.tr .wasc{font-size:8pt;color:#333;margin-top:14px;line-height:1.4}
.tr .sign{margin-top:30px;display:flex;justify-content:space-between;align-items:flex-start;font-size:8.5pt}
.tr .sign .left{padding-top:34px}
.tr .sign .sp{height:34px}
.tr .sign .line{border-top:1px solid #000;width:340px;padding-top:3px;text-align:center}
@media print{ body{background:#fff} #top,.foot,.noprint{display:none!important} main{padding:0;max-width:none} .tr{border:0;padding:0;max-width:none;font-size:9pt} .tr table{font-size:8.5pt} .tr h1{font-size:18pt} @page{size:A4;margin:12mm 10mm} }
#login .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:40px 44px;text-align:center;width:min(420px,92vw)}
#login img{height:72px;margin-bottom:12px}
#login h1{color:var(--brand);font-size:26px;margin-bottom:6px}
#login p{color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:5px 14px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
@media(max-width:720px){#top nav{display:none}}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="box">
    <img id="loginLogo" src="" alt="" hidden>
    <h1 id="loginTitle">Qum Academic System</h1>
    <p id="loginSub">학교 구글 계정으로 로그인하세요</p>
    <button class="btn" id="btnLogin">Google 로그인</button>
    <div class="foot">Educclesia Group</div>
  </div>
</div>
<div id="app" hidden>
  <header id="top">
    <div class="logo"><img id="topLogo" src="" alt="" hidden><h1 id="topTitle">Qum Academic System</h1></div>
    <nav id="nav"></nav>
    <div class="me"><span id="meName"></span><span class="tag" id="meRole"></span><button id="btnOut">나가기</button></div>
  </header>
  <main id="view"></main>
  <div class="foot">Educclesia Group</div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, where, orderBy, limit, writeBatch, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBh_YwVF6xaQv0P5csZwhD9tzz3i7jv2_A",
  authDomain: "qum-sis.firebaseapp.com",
  projectId: "qum-sis",
  storageBucket: "qum-sis.firebasestorage.app",
  messagingSenderId: "324861037215",
  appId: "1:324861037215:web:32f3e749d2fcac93d430aa"
};
const OWNER = "joon.kim@educclesia.com";   // 플랫폼 소유자(에듀클레시아)
const DEFAULT_SCHOOL = "qum";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT; const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); };

/* ---------- 세션 ---------- */
let me = null;          // {email, name, role, schoolId, studentId}
let school = null;      // settings doc
let sid = DEFAULT_SCHOOL;
const col = name => collection(db, "schools", sid, name);
const ref = (name, id) => doc(db, "schools", sid, name, String(id));

const ROLES = { owner:"소유자", admin:"행정", principal:"교장", teacher:"교사", student:"학생" };
const can = {
  manage: () => ["owner","admin","principal"].includes(me.role),
  settings: () => ["owner","principal"].includes(me.role),
};

async function resolveMember(user){
  const email = user.email.toLowerCase();
  if (email === OWNER) {
    // 소유자 첫 로그인: 학교·멤버십 없으면 만든다
    const m = await getDoc(doc(db,"memberships",email));
    if (!m.exists()) await setDoc(doc(db,"memberships",email), {schoolId:DEFAULT_SCHOOL, role:"owner", createdAt:serverTimestamp()});
    sid = m.exists() ? m.data().schoolId : DEFAULT_SCHOOL;
    const s = await getDoc(doc(db,"schools",sid));
    if (!s.exists()) await setDoc(doc(db,"schools",sid), {
      name:"Qum Academic System", nameKo:"쿰 아카데믹 시스템", schoolName:"Qum Educlesia", schoolNameKo:"이오에스 미래 리더스",
      logoUrl:"", color:"#6b1f2a", accent:"#b8923a", address:"", phone:"", ceeb:"", principal:"Joon Kim",
      termCode:"2026F", nextId:9001, createdAt:serverTimestamp()
    });
    return {email, name:user.displayName, role:"owner"};
  }
  const m = await getDoc(doc(db,"memberships",email));
  if (!m.exists()) return null;
  sid = m.data().schoolId;
  return {email, name:user.displayName, role:m.data().role, studentId:m.data().studentId||null};
}

async function loadSchool(){
  school = (await getDoc(doc(db,"schools",sid))).data();
  document.documentElement.style.setProperty("--brand", school.color || "#6b1f2a");
  document.documentElement.style.setProperty("--accent", school.accent || "#b8923a");
  $("#topTitle").textContent = school.name; $("#loginTitle").textContent = school.name;
  document.title = school.name;
  for (const id of ["topLogo","loginLogo"]) { const el=$("#"+id); el.hidden=!school.logoUrl; el.src=school.logoUrl||""; }
}

/* ---------- 로그인 ---------- */
$("#btnLogin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => {
  if (["auth/popup-blocked","auth/popup-closed-by-user","auth/cancelled-popup-request"].includes(e.code)) return signInWithRedirect(auth, new GoogleAuthProvider());
  toast("로그인 실패: "+e.code); console.error(e);
});
getRedirectResult(auth).catch(e=>{ toast("로그인 실패: "+e.code); console.error(e); });
$("#btnOut").onclick = () => signOut(auth);
onAuthStateChanged(auth, async user => {
  if (!user) { $("#login").hidden=false; $("#app").hidden=true; return; }
  $("#loginSub").textContent = user.email + " 확인 중…";
  try {
    const m = await resolveMember(user);
    if (!m) { toast("이 계정은 아직 등록되지 않았습니다. 학교에 문의하세요."); await signOut(auth); return; }
    me = m; await loadSchool();
    $("#meName").textContent = me.name || me.email; $("#meRole").textContent = ROLES[me.role] || me.role;
    $("#login").hidden=true; $("#app").hidden=false;
    buildNav(); route();
  } catch (e) {
    console.error(e); $("#loginSub").textContent = "오류: " + (e.code || e.message);
    toast("오류: " + (e.code || e.message));
  }
});

/* ---------- 라우터 ---------- */
const routes = {
  "":        {label:"현황",       show:()=>me.role!=="student", view:viewHome},
  "students":{label:"학생",       show:()=>can.manage() || me.role==="teacher", view:viewStudents},
  "courses": {label:"과목",       show:()=>can.manage() || me.role==="teacher", view:viewCourses},
  "attendance":{label:"출결",     show:()=>can.manage() || me.role==="teacher", view:viewAttendance},
  "slips":   {label:"슬립 승인",  show:()=>can.manage(),  view:viewSlips},
  "requests":{label:"수정 요청",  show:()=>can.manage(),  view:viewRequests},
  "new":     {label:"신입생 등록", show:()=>can.manage(),  view:viewNew},
  "import":  {label:"가져오기",   show:()=>can.manage(),  view:viewImport},
  "settings":{label:"학교 설정",  show:()=>can.settings(),view:viewSettings},
  "me":      {label:"내 정보 · 성적 · 출결 · 활동", show:()=>me.role==="student", view:viewMe},
};
function buildNav(){
  $("#nav").innerHTML = Object.entries(routes).filter(([k,r])=>r.show()).map(([k,r])=>`<a href="#/${k}" data-k="${k}">${r.label}</a>`).join("");
}
window.addEventListener("hashchange", route);
async function route(){
  if (!me) return;
  const [k, arg] = location.hash.replace(/^#\/?/,"").split("/");
  if (me.role==="student" && !k) { location.hash="#/me"; return; }
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.k===(k||"")));
  const v = $("#view"); v.innerHTML = `<p class="muted">불러오는 중…</p>`;
  const sub = location.hash.replace(/^#\/?/,"").split("/")[2];
  try {
    if (k==="students" && arg) return await (sub==="grades" ? viewStudentGrades(arg) : sub==="attendance" ? viewStudentAttendance(arg) : sub==="activities" ? viewStudentActivities(arg) : viewStudent(arg));
    if (k==="transcript" && arg) return await viewTranscript(arg);
  } catch(e){ console.error(e); v.innerHTML=`<div class="card"><p class="warn">오류: ${esc(e.code||e.message)}</p></div>`; return; }
  const r = routes[k||""]; if (!r || !r.show()) { v.innerHTML="<p>권한이 없습니다.</p>"; return; }
  try { await r.view(); } catch(e){ console.error(e); v.innerHTML=`<div class="card"><p class="warn">오류: ${esc(e.code||e.message)}</p></div>`; }
}

/* ---------- 현황 ---------- */
async function viewHome(){
  const snap = await getDocs(col("students"));
  const all = snap.docs.map(d=>({id:d.id,...d.data()}));
  const byGrade = {}; let review=0, pending=0;
  for (const s of all){ byGrade[s.grade]=(byGrade[s.grade]||0)+1; if (s.needsReview) review++; if (s.status==="pending") pending++; }
  const grades = Object.keys(byGrade).sort((a,b)=>(parseInt(a)||99)-(parseInt(b)||99));
  $("#view").innerHTML = `
  <div class="card"><h2>${esc(school.schoolName)} · ${esc(school.termCode)}</h2>
    <div class="stat">
      <div><b>${all.length}</b><span>학생 전체</span></div>
      ${grades.map(g=>`<div><b>${byGrade[g]}</b><span>${g}학년</span></div>`).join("")}
      <div><b style="color:var(--pending)">${review}</b><span>확인 필요</span></div>
      <div><b style="color:var(--warn)">${pending}</b><span>정보 미입력</span></div>
    </div></div>
  <div class="card"><h2>다음 단계</h2>
    <p class="muted">1단계: 학생 명부 → 과목·성적 → Transcript 발행. 2단계: 출결. 3단계: 학생 자기 입력(수상·활동). 4단계: 학습성장기록부. 5단계: 학교 설정·로고.</p></div>`;
}

/* ---------- 학생 목록 ---------- */
async function viewStudents(){
  const snap = await getDocs(col("students"));
  const gnum = g => parseInt(g) || 99;
  const all = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>gnum(a.grade)-gnum(b.grade) || String(a.last_en).localeCompare(b.last_en));
  const v=$("#view");
  v.innerHTML = `<div class="card"><h2>학생 ${all.length}명</h2>
    <div class="row" style="margin-bottom:12px"><input id="q" placeholder="이름·ID·이메일 검색" style="max-width:280px">
    <select id="g" style="max-width:140px"><option value="">전 학년</option>${[...new Set(all.map(s=>s.grade))].map(g=>`<option>${g}</option>`).join("")}</select>
    <label style="font-size:13px"><input type="checkbox" id="onlyReview" style="width:auto"> 확인 필요만</label></div>
    <div class="scroll"><table><thead><tr><th>ID</th><th>이름</th><th>학년</th><th>생년월일</th><th>이메일</th><th>과정</th><th>상태</th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
  const draw=()=>{
    const q=$("#q").value.toLowerCase(), g=$("#g").value, r=$("#onlyReview").checked;
    $("#tb").innerHTML = all.filter(s=>(!g||String(s.grade)===g)&&(!r||s.needsReview)&&(!q||[s.id,s.last_en,s.first_en,s.name_ko,s.email].join(" ").toLowerCase().includes(q)))
      .map(s=>`<tr><td><a href="#/students/${s.id}">${esc(s.id)}</a></td><td>${esc(s.last_en)}, ${esc(s.first_en)} ${s.name_ko?`<span class="muted">${esc(s.name_ko)}</span>`:""}</td><td>${esc(s.grade)}</td><td>${esc(s.dob)}</td><td class="muted">${esc(s.email)}</td><td>${esc(s.curriculum)}</td><td>${statusTag(s)}</td></tr>`).join("");
  };
  ["q","g","onlyReview"].forEach(i=>$("#"+i).oninput=draw); draw();
}
const statusTag = s => s.status==="pending"?`<span class="tag warn">미입력</span>`: s.needsReview?`<span class="tag pend">확인 필요</span>`:`<span class="tag ok">${s.status==="active"?"재학":esc(s.status)}</span>`;

/* ---------- 학생 필드 정의(한 곳에서 관리) ---------- */
const FIELDS = [
  ["기본",[["last_en","영문 성"],["first_en","영문 이름"],["name_ko","한글 이름"],["dob","생년월일","date"],["gender","성별","select",["","F","M"]],["grade","학년"],["gradYear","졸업연도"],["track","트랙","select",["","CAI","CEI","UI"]]]],
  ["학적",[["status","상태","select",["active","pending","graduated","transferred","leave"]],["enrollDate","입학일","date"],["endDate","종료일","date"],["prevSchool","전입학교"],["curriculum","과정(Apex/Buzz/CW)"],["distinctions","Distinctions"]]],
  ["연락",[["email","학교 이메일"],["phone","학생 휴대폰"],["address_en","주소(영문)"],["address_ko","주소(한글)"],["postal","우편번호"]]],

function parseDelimited(text){
  text = text.replace(/\r/g,"").trim(); if (!text) return [];
  const delim = text.split("\n")[0].includes("\t") ? "\t" : ",";
  const rows=[]; let row=[], cell="", inQ=false;
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if (inQ){ if (ch==='"'){ if (text[i+1]==='"'){cell+='"';i++;} else inQ=false; } else cell+=ch; }
    else if (ch==='"') inQ=true;
    else if (ch===delim){ row.push(cell); cell=""; }
    else if (ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch; }
  row.push(cell); rows.push(row);
  const hdr = rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(c=>c.trim())).map(r=>Object.fromEntries(hdr.map((h,i)=>[h,(r[i]||"").trim()])));
}

const subNav = (id, on) => `<div class="sub noprint"><a href="#/students/${id}" class="${on==="info"?"on":""}">정보</a><a href="#/students/${id}/grades" class="${on==="grades"?"on":""}">성적</a><a href="#/students/${id}/attendance" class="${on==="att"?"on":""}">출결</a><a href="#/students/${id}/activities" class="${on==="act"?"on":""}">수상·활동</a><a href="#/transcript/${id}" class="${on==="tr"?"on":""}">Transcript</a></div>`;
const slug = t => String(t).toLowerCase().replace(/[^a-z0-9가-힣]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const courseId = r => r.code ? String(r.code).trim() : (r.title ? "t_"+slug(r.title.replace(/\s+Sem\s*[12].*$/i,"")) : "");
function termLabel(tc){ const m=/^(\d{4})([FSU])$/.exec(tc||""); if(!m) return tc||""; const y=+m[1];
  return m[2]==="F" ? `Fall ${y}-${String(y+1).slice(2)}` : (m[2]==="S"?`Spring ${y-1}-${String(y).slice(2)}`:`Summer ${y-1}-${String(y).slice(2)}`); }
const termKey = tc => { const m=/^(\d{4})([FSU])$/.exec(tc||""); return m ? +m[1] + ({F:0.5,S:0,U:0.25}[m[2]]) : 0; };
const PTS={A:4,B:3,C:2,D:1,F:0}, WPTS={A:5,B:4,C:3,D:2,F:1.7};
function gpaOf(rows){ // 학점 가중 평균 (카운슬러 시트와 동일)
  const done=rows.filter(r=>r.grade in PTS && r.credit>0); const cr=done.reduce((a,r)=>a+r.credit,0);
  if (!cr) return {u:0,w:0,credits:0};
  return {u:done.reduce((a,r)=>a+PTS[r.grade]*r.credit,0)/cr, w:done.reduce((a,r)=>a+(r.weighted?WPTS:PTS)[r.grade]*r.credit,0)/cr, credits:cr};
}
const f2 = n => (Math.round(n*100)/100).toFixed(2);
const AREA_RANK={"2":0,"3":1,"1":2,"4":3,"5":4,"6":5,"7":6,"8":7,"9":8};  // 영어·수학·사회·과학·외국어·예술·경영·체육·학교선택
const areaRank = c => c ? (AREA_RANK[String(c)[0]] ?? 8) : 9;              // 코드 없는 선택과목은 맨 뒤
async function loadGrades(id){ const q=query(col("grades"), where("studentId","==",String(id))); return (await getDocs(q)).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>termKey(a.termCode)-termKey(b.termCode) || (a.gLevel||0)-(b.gLevel||0) || areaRank(a.code)-areaRank(b.code) || String(a.code).localeCompare(b.code) || String(a.title).localeCompare(b.title)); }
let courseCache=null; async function loadCourses(){ if(!courseCache){ courseCache=(await getDocs(col("courses"))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.code||"zz").localeCompare(b.code||"zz")||a.title.localeCompare(b.title)); } return courseCache; }

      <td>${editable?`<input data-c="${r.id}" value="${r.credit}" style="width:60px;padding:3px">`:r.credit}</td><td>${r.weighted?"+":""}</td><td class="muted">${esc(r.source)}</td>

  const recs={}; as.docs.forEach(d=>recs[d.data().studentId]=d.data());
  const day=["일","월","화","수","목","금","토"][new Date(date+"T00:00:00").getDay()];
  $("#view").innerHTML=`<div class="card"><h2>출결 입력</h2>

    ${studs.map(s=>{ const r=recs[s.id]||{}; return `<tr data-s="${s.id}"><td>${esc(s.grade)}</td><td>${esc(s.last_en)}, ${esc(s.first_en)} <span class="muted">${esc(s.name_ko||"")}</span></td><td class="muted">${esc(s.track||"")}</td>

    </tbody></table></div></div>`;
  $("#dt").onchange=e=>viewAttendance(e.target.value);

      else { await setDoc(ref("attendance",id),{studentId:sid,date,termCode:termOf(date),code:b.dataset.c,note:note.value,approved:false,slipNo:"",source:"app",by:me.email,at:serverTimestamp()},{merge:true});

    });
    note.onchange=async()=>{ await updateDoc(ref("attendance",`${sid}_${date}`),{note:note.value}); toast("저장"); };
  });
}
async function viewSlips(){

  award:{label:"수상 Awards", fields:[["awardType","구분","select",["School","Outside"]],["name","상 이름"],["date","날짜","date"],["description","설명"]], cols:["awardType","name","date","description"]},

  activity:{label:"활동 Extracurricular", fields:[["category","분류","select",["Personal Project","Clubs","Competitions","Internship","Leadership","Arts","Sports","Other"]],["inside","학교 안/밖","select",["Inside","Outside"]],["name","활동 이름"],["position","역할"],["rank","순위·결과"],["startDate","시작","date"],["endDate","끝","date"],["description","무엇을 했나 (3줄 이상)","textarea"]], cols:["category","inside","name","position","rank","startDate","endDate","description"]},

};
let actKind="award";
async function viewStudentActivities(id){
  const isSelf = me.role==="student" && me.studentId===String(id);
  const staff = can.manage()||me.role==="teacher";
  const [s, as] = await Promise.all([getDoc(ref("students",id)), getDocs(query(col("activities"), where("studentId","==",String(id))))]);
  if (!s.exists()) return $("#view").innerHTML="<p>없는 학생입니다.</p>";
  const d=s.data(), all=as.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>String(b.date||b.startDate||"").localeCompare(String(a.date||a.startDate||"")));
  const K=ACT_KINDS[actKind], rows=all.filter(r=>r.kind===actKind);
  const canAdd = isSelf || can.manage();
  const fh=(f,v)=> f[2]==="select"?`<div><label>${f[1]}</label><select name="${f[0]}">${f[3].map(o=>`<option ${o===(v??"")?"selected":""}>${o}</option>`).join("")}</select></div>`
    : f[2]==="textarea"?`<div style="grid-column:1/-1"><label>${f[1]}</label><textarea name="${f[0]}" rows="3">${esc(v)}</textarea></div>`
    : `<div><label>${f[1]}</label><input name="${f[0]}" type="${f[2]||"text"}" value="${esc(v)}"></div>`;
  $("#view").innerHTML=`<div class="card"><h2>${esc(d.last_en)}, ${esc(d.first_en)} <span class="muted" style="font-size:14px">ID ${esc(id)}</span></h2>${subNav(id,"act")}
    <div class="tabs">${Object.entries(ACT_KINDS).map(([k,v])=>`<button data-k="${k}" class="${k===actKind?"on":""}">${v.label} <span class="tag">${all.filter(r=>r.kind===k).length}</span></button>`).join("")}</div>
    ${canAdd?`<form id="af" class="card" style="background:var(--paper)"><div class="grid">${K.fields.map(f=>fh(f,"")).join("")}</div><input type="hidden" name="_id"><div class="row" style="margin-top:10px"><button class="btn sm" id="afBtn">추가</button><button type="button" class="btn sm ghost" id="afReset" hidden>취소</button></div></form>`:""}
    <div class="scroll"><table><thead><tr>${K.fields.map(f=>`<th>${f[1]}</th>`).join("")}<th>상태</th><th></th></tr></thead><tbody>
    ${rows.map(r=>`<tr>${K.fields.map(f=>`<td>${esc(r[f[0]]).replace(/\n/g,"<br>")}</td>`).join("")}<td class="nw">${r.approved?`<span class="tag ok">승인</span>`:`<span class="tag pend">대기</span>`}</td>
      <td class="nw">${staff&&can.manage()?`<label><input type="checkbox" data-ok="${r.id}" ${r.approved?"checked":""} style="width:auto"> 승인</label> `:""}${(can.manage()||(isSelf&&!r.approved))?`<button class="btn sm ghost" data-e="${r.id}">수정</button> <button class="btn sm ghost" data-del="${r.id}">×</button>`:""}</td></tr>`).join("")||`<tr><td colspan="${K.fields.length+2}" class="muted">아직 없음</td></tr>`}
    </tbody></table></div>
    ${isSelf?`<p class="muted" style="margin-top:10px">입력한 내용은 선생님이 확인한 뒤 성적표·기록부에 실립니다. 승인된 항목은 학교에 수정을 요청하세요.</p>`:""}</div>`;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{actKind=b.dataset.k; viewStudentActivities(id);});
  const af=$("#af"); if (af){
    af.onsubmit=async e=>{ e.preventDefault(); const v=readForm(af); const aid=v._id; delete v._id;
      if (!v.name && !v.test) return toast("이름은 필수");
      if (aid) await updateDoc(ref("activities",aid),{...v,updatedAt:serverTimestamp(),updatedBy:me.email});
      else await setDoc(doc(col("activities")),{...v,kind:actKind,studentId:String(id),approved:false,createdAt:serverTimestamp(),createdBy:me.email});
      toast("저장"); viewStudentActivities(id); };
    $("#afReset").onclick=()=>viewStudentActivities(id);
    document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{ const r=rows.find(x=>x.id===b.dataset.e); K.fields.forEach(f=>{ const el=af.querySelector(`[name="${f[0]}"]`); if(el) el.value=r[f[0]]||""; }); af.querySelector("[name=_id]").value=r.id; $("#afBtn").textContent="수정 저장"; $("#afReset").hidden=false; window.scrollTo({top:0,behavior:"smooth"}); });
  }
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("지울까요?")) return; await deleteDoc(ref("activities",b.dataset.del)); viewStudentActivities(id); });
  document.querySelectorAll("[data-ok]").forEach(el=>el.onchange=async()=>{ await updateDoc(ref("activities",el.dataset.ok),{approved:el.checked,approvedBy:me.email,approvedAt:serverTimestamp()}); viewStudentActivities(id); });
}

/* ---------- 수정 요청 (학생 → 행정) ---------- */
async function viewRequests(){
  const [rs, ss]=await Promise.all([getDocs(col("requests")), getDocs(col("students"))]);
  const names={}; ss.docs.forEach(d=>names[d.id]=`${d.data().last_en}, ${d.data().first_en}`);
  const rows=rs.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.status==="done")-(b.status==="done") || (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  $("#view").innerHTML=`<div class="card"><h2>학생 수정 요청 ${rows.filter(r=>r.status!=="done").length}건 대기</h2>
    <table><thead><tr><th>날짜</th><th>학생</th><th>요청 내용</th><th>처리</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="nw">${r.createdAt?new Date(r.createdAt.seconds*1000).toISOString().slice(0,10):""}</td><td class="nw"><a href="#/students/${r.studentId}">${esc(names[r.studentId]||r.studentId)}</a></td><td>${esc(r.message)}</td><td class="nw"><label><input type="checkbox" data-done="${r.id}" ${r.status==="done"?"checked":""} style="width:auto"> 처리 완료</label></td></tr>`).join("")||`<tr><td colspan=4 class=muted>없음</td></tr>`}</tbody></table></div>`;

}

async function viewTranscript(id){
  const us = x => x? `${x.slice(5,7)}/${x.slice(8,10)}/${x.slice(0,4)}` : "";

  if (!s.exists()) return $("#view").innerHTML="<p>없는 학생입니다.</p>";
  const d=s.data(), g=gpaOf(rows), terms=[...new Set(rows.map(r=>r.termCode))];
  const att={}; as.docs.forEach(x=>{ const r=x.data(); const t=att[r.termCode]=att[r.termCode]||{"e.a":0,"e.t":0,"u.a":0,"u.t":0}; t[finalCode(r)]++; });
  const attTerms=Object.keys(att).sort((a,b)=>termKey(a)-termKey(b));
  const inc = can.manage()||me.role==="teacher" ? (await getDocs(query(col("incidents"), where("studentId","==",String(id))))).docs.map(x=>x.data()).sort((a,b)=>a.date.localeCompare(b.date)) : [];
  const incR = inc.filter(r=>r.record);
  const staffV = can.manage()||me.role==="teacher";

    <tbody id="incRows" hidden>${incR.map(r=>`<tr><td class="nw">${us(r.date)}</td><td class="nw c">Action ${esc(r.action)}</td><td class="nw">${esc(r.category)}</td><td class="nw">${esc(r.disposition)}</td><td>${esc(r.note)}</td></tr>`).join("")||`<tr><td colspan="5" class="c" style="color:#777">No incidents on record</td></tr>`}</tbody>
    <tbody id="incBlank"><tr><td colspan="5">&nbsp;</td></tr></tbody></table></div>`;
  const incHtml = staffV ? incTable : "";
  const attHtml=attTerms.length?`<div id="attBox" hidden class="side"><div><table><thead><tr><th>Attendance</th><th>e.a</th><th>e.t</th><th>u.a</th><th>u.t</th></tr></thead><tbody>${attTerms.map(t=>`<tr><td class="nw">${termLabel(t)}</td><td class="c">${att[t]["e.a"]}</td><td class="c">${att[t]["e.t"]}</td><td class="c">${att[t]["u.a"]}</td><td class="c">${att[t]["u.t"]}</td></tr>`).join("")}</tbody></table></div>${incHtml||"<div></div>"}
    <div class="ft">e.a = excused absence · e.t = excused tardy · u.a = unexcused absence · u.t = unexcused tardy</div><div class="ft" id="incFt">Only incidents designated for the official record are shown.</div></div>`:"";
  const dist=(d.distinctions||"").split(/;|\n/).map(x=>x.trim()).filter(Boolean);
  const today=new Date().toISOString().slice(0,10);
  const schoolBlock=`${esc(school.schoolName)}\n${esc(school.address||"")}\n${school.phone?"Tel: "+esc(school.phone):""}${school.ceeb?" | CEEB: "+esc(school.ceeb):""}`;
  $("#view").innerHTML=`<div class="noprint row" style="max-width:1000px;margin:0 auto 12px">${subNav(id,"tr")}<button class="btn sm" id="pr">인쇄 / PDF 저장</button>${can.manage()?`<label style="font-size:13px"><input type="checkbox" id="offOn" style="width:auto"> <b>Official</b>(서명용)</label>`:""}${attHtml?`<label style="font-size:13px"><input type="checkbox" id="attOn" style="width:auto"> 출결 포함</label>`:""}${incHtml?`<label id="incLbl" hidden style="font-size:13px"><input type="checkbox" id="incOn" style="width:auto"> 징계 포함</label>`:""}<span class="muted">브라우저 인쇄 창에서 'PDF로 저장'</span></div>
  <div class="tr">
    <div class="hd"><div>${school.logoUrl?`<img src="${esc(school.logoUrl)}" alt="">`:""}<h1 id="trTitle">Unofficial Transcript</h1></div><div class="sch">${schoolBlock}</div></div>

      <div class="addr"><b>Address</b>${esc(d.address_en)}</div></div>
    ${attHtml}
    <div class="cum"><b>Cumulative Totals for All Grade Levels</b><span>Unweighted GPA: <b>${f2(g.u)}</b></span><span>Weighted GPA: <b>${f2(g.w)}</b></span><span>Credits: <b>${g.credits}</b></span></div>
    <table><thead><tr><th class="nw">G.Level</th><th class="nw">School</th><th>Code</th><th>Course Title</th><th class="nw">Term</th><th>Grade</th><th>GPA</th><th>Credit</th></tr></thead><tbody>
    ${terms.map(t=>{ const tr=rows.filter(r=>r.termCode===t); const tg=gpaOf(tr);
      return tr.map(r=>`<tr><td class="c">${r.gLevel??""}</td><td class="nw c">${esc(r.school)}</td><td class="c">${esc(r.code)}</td><td class="ct">${esc(r.title)}${r.weighted?" <b>+</b>":""}</td><td class="nw c">${termLabel(t)}</td><td class="c">${esc(r.grade)}</td><td class="c">${r.grade in PTS?f2((r.weighted?WPTS:PTS)[r.grade]):"0.00"}</td><td class="c">${r.grade in PTS?r.credit.toFixed(2):"0.00"}</td></tr>`).join("")

    </tbody></table>

      <div><h4>GRADE</h4><table><tr><th>Grade</th><th>CORE</th><th>H / AP</th><th>%</th></tr><tr><td>A</td><td>4.0</td><td>5.0</td><td>90-100</td></tr><tr><td>B</td><td>3.0</td><td>4.0</td><td>80-89</td></tr><tr><td>C</td><td>2.0</td><td>3.0</td><td>70-79</td></tr><tr><td>D</td><td>1.0</td><td>2.0</td><td>60-69</td></tr><tr><td>F</td><td>0.0</td><td>1.7</td><td>0-59</td></tr></table></div>

    </div>
    <div class="wasc">${esc(school.accreditation||"")}${school.accreditation?"<br>":""}${esc(school.schoolName)} does not rank students.</div>

  </div>`;
  const oo=$("#offOn"); if (oo) oo.onchange=()=>{ const on=oo.checked; $("#trTitle").textContent=on?"Official Transcript":"Unofficial Transcript";
    $("#trNote").textContent=on?"* Official transcript. Valid only with the signature of the school official and the school seal.":"* This transcript is unofficial unless signed and sealed by a School Official.";
    $("#trSig").innerHTML=on?`<b>${esc(school.principal)}</b>, General Principal Rev. &nbsp;&nbsp; ${us(today)}`:`Printed on ${us(today)}`; $("#trSig").style.borderTop=on?"1px solid #000":"0"; };
  const ao=$("#attOn"), io=$("#incOn"); if (ao) ao.onchange=()=>{ $("#attBox").hidden=!ao.checked; if ($("#incLbl")) $("#incLbl").hidden=!ao.checked; if (!ao.checked && io){ io.checked=false; $("#incRows").hidden=true; $("#incBlank").hidden=false; } };
  if (io) io.onchange=()=>{ $("#incRows").hidden=!io.checked; $("#incBlank").hidden=io.checked; };

}

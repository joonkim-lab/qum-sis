<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qum Academic System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#23262B;        /* 차콜 */
  --brand-ink:#23262B;
  --accent:#C8553D;       /* 테라코타 */
  --accent-ink:#A9442F;
  --accent-bg:#FBEAE5;
  --paper:#FAFAF9;        /* v37 C안: 버셀식 구조 + 따뜻한 회색(stone) */
  --paper-2:#F5F5F4;
  --ink:#1C1917;
  --muted:#78716C;
  --line:#E7E5E4;
  --line-2:#D6D3D1;
  --ok:#3F6B4E; --warn:#9A3A26; --pending:#8A5A12;
  --mono:"Geist Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Geist","Noto Sans KR",system-ui,sans-serif;font-size:14px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.01em}
a{color:var(--ink);text-decoration-color:var(--line-2);text-underline-offset:2px}
a:hover{text-decoration-color:var(--ink)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--line-2)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:7px 14px;font-weight:500}
.btn.ghost{background:#fff;color:var(--ink);border:0;box-shadow:0 0 0 1px var(--line)}
.btn.ghost:hover{box-shadow:0 0 0 1px var(--line-2);background:var(--paper);filter:none}
.btn:hover{filter:brightness(1.25)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
/* layout */
#top{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;height:48px;position:sticky;top:0;z-index:5}
#top .logo{display:flex;align-items:center;gap:10px}
#top .logo img{height:28px;width:28px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;box-shadow:0 0 0 1px var(--line)}
#top .logo h1{font-family:"Noto Serif KR",Georgia,serif;font-size:16px;font-weight:500;letter-spacing:.2px;white-space:nowrap;color:var(--ink)}
#top nav{display:flex;gap:2px;margin-left:8px;flex-wrap:nowrap;height:100%;align-items:center}
#top nav>a,#top nav .dd>button{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:5px;font-size:14px;background:transparent;border:0;white-space:nowrap}
#top nav>a.on,#top nav>a:hover,#top nav .dd.on>button,#top nav .dd:hover>button,#top nav .dd:focus-within>button{background:transparent;color:var(--ink)}
#top nav>a.on,#top nav .dd.on>button{box-shadow:inset 0 -2px 0 var(--accent);border-radius:0;height:100%;display:flex;align-items:center;font-weight:500}
#top nav .dd{position:relative;height:100%;display:flex;align-items:center}
#top nav .dd .menu{display:none;position:absolute;top:100%;left:0;min-width:170px;background:#fff;border:1px solid var(--line);border-radius:0 0 8px 8px;box-shadow:0 0 0 1px var(--line),0 8px 24px rgba(28,25,23,.08);border:0;padding:6px;z-index:10}
#top nav .dd:hover .menu,#top nav .dd:focus-within .menu{display:block}
#top nav .dd .menu a{display:block;color:var(--ink);text-decoration:none;padding:7px 10px;border-radius:5px;font-size:13.5px;white-space:nowrap}
#top nav .dd .menu a:hover{background:var(--paper)}
#top nav .dd .menu a.on{background:var(--paper-2);color:var(--ink);font-weight:500}
#top .me{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;white-space:nowrap}
#top .me button{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:3px 9px;font-size:12px;white-space:nowrap}
#top .me .tag{white-space:nowrap}
main{max-width:1240px;margin:0 auto;padding:18px 20px 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:16px;color:var(--ink);font-weight:600;letter-spacing:-.02em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px}
.grid label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:0;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat div{background:#fff;padding:10px 12px;outline:1px solid var(--line)}
.stat b{display:block;font-family:var(--mono);font-size:21px;font-weight:500;color:var(--ink);letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;background:var(--paper);padding:8px 8px;font-weight:500;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.nw,th.nw{white-space:nowrap}
td .btn.sm{padding:2px 7px;font-size:12px}
tr:hover td{background:var(--paper)}
td[contenteditable]{outline:none;background:#FFFCFA;border-bottom:1px dashed var(--accent)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--paper-2);color:var(--ink)}
#top .me .tag{background:var(--paper-2);color:var(--ink)}
.tag.ok{background:#EAF1EC;color:var(--ok)}.tag.warn{background:var(--accent-bg);color:var(--warn)}.tag.pend{background:#F7EEDC;color:var(--pending)}
.muted{color:var(--muted);font-size:13px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brand-ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
[hidden]{display:none!important}
#login{min-height:100vh;display:grid;place-items:center}
.sub{display:flex;gap:6px;margin:-6px 0 14px}
.row .sub{margin:0}
.sub a{font-size:13px;color:var(--ink);text-decoration:none;padding:4px 10px;border:1px solid var(--line);border-radius:14px}
.sub a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* transcript */
.tr{background:#fff;color:#000;font-family:"Noto Sans KR",Arial,sans-serif;font-size:10pt;max-width:1000px;margin:0 auto;padding:28px 34px;border:1px solid var(--line)}
.tr h1{font-family:Georgia,"Noto Serif KR",serif;font-size:20pt;margin:0;color:#000}
.tr .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:8px}
.tr .hd img{height:52px}
.tr .hd .sch{text-align:right;font-size:9.5pt;line-height:1.35;white-space:pre-line}
.tr .info{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:4px 14px;margin:10px 0;font-size:9.5pt}
.tr .info .addr{grid-column:1/-1;white-space:nowrap}
.tr .info b{display:block;font-size:8.5pt;color:#444;font-weight:600}
.tr .cum{border:1px solid #000;padding:6px 10px;display:flex;gap:26px;font-size:9.5pt;margin:8px 0 12px}
.tr table{font-size:9pt;table-layout:auto}
.tr td.ct{letter-spacing:-.2px}
.tr td.nw,.tr th.nw{white-space:nowrap}
.tr th{background:#ddd;color:#000;position:static;border-bottom:1px solid #000;padding:4px 6px;text-align:center}
.tr td.c{text-align:center}
.tr.miri-off .miri{display:none}
.tr{position:relative;isolation:isolate}
.tr>.wm{position:absolute;left:50%;top:50%;width:60%;max-width:480px;transform:translate(-50%,-50%);opacity:.07;z-index:-1;pointer-events:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cond-off .cond{display:none}
.tr .side{display:grid;grid-template-columns:2fr 3fr;gap:4px 18px;align-items:start;margin:0 0 12px}
.tr .side .ft{font-size:8pt;color:#555}
.tr .side>div{min-width:0}
.tr .side table{width:100%}
.tr td{padding:3px 5px;border-bottom:0}
.tr tr.tot td{border-top:1px solid #999;font-weight:600;padding-bottom:8px}
.tr tr:hover td{background:transparent}
.sgdoc{font-family:"Noto Sans KR",sans-serif;font-size:9.5pt}
.sgdoc h3{font-size:11pt;margin:16px 0 6px;font-family:"Noto Serif KR",serif}
.sg{width:100%;border-collapse:collapse;border:1.2px solid #000;margin-bottom:4px}
.sg th,.sg td{border:0.6px solid #000;padding:5px 7px;font-size:9pt;vertical-align:middle}
.sg th{background:#f1f1f1;color:#000;text-align:center;font-weight:600;position:static}
.sg td.c{text-align:center}
.sg tr:hover td{background:transparent}
.tr .legend{display:grid;grid-template-columns:1.5fr 1.3fr 1fr auto;gap:22px;margin-top:16px;font-size:8.5pt;align-items:start}
.tr .legend>div{min-width:0}
.tr .legend>div:last-child{justify-self:end;text-align:left}
.tr .legend table{width:100%;font-size:9pt}
.tr .legend th,.tr .legend td{text-align:center;padding:3px 6px}
.tr .legend h4{text-align:left}
.tr .legend table{font-size:8.5pt}.tr .legend th{background:#eee;padding:2px 5px}.tr .legend td{padding:1px 5px}
.tr .legend h4{margin:0 0 4px;font-size:9pt}
.tr .wasc{font-size:8pt;color:#333;margin-top:14px;line-height:1.4}
.tr .sign{margin-top:30px;display:flex;justify-content:space-between;align-items:flex-start;font-size:8.5pt}
.tr .sign .left{padding-top:34px}
.tr .sign .sp{height:34px}
.tr .sign .line{border-top:1px solid #000;width:340px;padding-top:3px;text-align:center}
@media print{ body{background:#fff} #top,.foot,.noprint{display:none!important} main{padding:0;max-width:none} .tr{border:0;padding:0;max-width:none;font-size:9pt} .tr table{font-size:8.5pt} .tr h1{font-size:18pt} .tr>.wm{position:fixed;width:120mm;max-width:none} @page{size:A4;margin:12mm 10mm} }
/* 격주 출결 확인서 (A4 반장 × 2) */
.bw{background:#fff;color:#000;font-family:"Noto Sans KR",sans-serif;font-size:9.5pt;max-width:760px;margin:0 auto 14px;padding:16px 20px;border:1px solid var(--line)}
.bw .bwh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:5px;margin-bottom:8px}
.bw .bwh h2{font-size:14pt;color:#000;border:0;padding:0;margin:0;font-family:"Noto Serif KR",serif}
.bw .bwh .sch{text-align:right;font-size:8.5pt;line-height:1.35}
.bw .sg{margin-bottom:5px}.bw .sg th{white-space:nowrap;width:1%}.bw .sg th,.bw .sg td{padding:3px 6px}.bw .sg td.c{text-align:center;white-space:nowrap}
.bw .cm{min-height:34px;outline:none;line-height:1.45}.bw .cm:focus{background:#fffdf0}
.bw .sign3 td{height:22px}
.bw .pt{display:inline-block;padding:0 7px;border-radius:10px;font-size:8.5pt;border:1px solid #999;white-space:nowrap}
.bw .prh{font-weight:700;font-size:9.5pt;margin:6px 0 2px}.bw .units{font-size:8pt;line-height:1.4;color:#222}.bw .tcm{margin-top:3px;padding-top:3px;border-top:0.5px dashed #999;line-height:1.45}
.pgc{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-weight:600} .pgc.ok{background:#7fc98a} .pgc.pend{background:#f3c46b} .pgc.warn{background:#dd6a52} .pkey{font-size:7.5pt;margin:3px 0 6px;color:#333} .pkey .sw{display:inline-block;width:14px;height:9px;border:1px solid #555;vertical-align:-1px;margin:0 2px 0 8px}
@media print{ #prList .bw{border:0;max-width:none;margin:0;padding:0;page-break-after:always;font-size:8.5pt} #prList .bw:last-child{page-break-after:auto} #prList .bw .sg th,#prList .bw .sg td{font-size:8.5pt;padding:2px 5px} }
@media print{ #bwList .bw{border:0;max-width:none;margin:0;padding:2mm 2mm 0;height:135mm;overflow:hidden;border-bottom:1px dashed #888;page-break-inside:avoid;font-size:8.5pt} #bwList .bw .sg th,#bwList .bw .sg td{font-size:8.5pt;padding:2px 5px} #bwList .bw .bwh h2{font-size:12.5pt} #bwList .bw:nth-of-type(2n){page-break-after:always;border-bottom:0} }
#login .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:40px 44px;text-align:center;width:min(420px,92vw)}
#login img{height:72px;margin-bottom:12px}
#login h1{color:var(--ink);font-family:"Noto Serif KR",Georgia,serif;font-weight:500;font-size:26px;margin-bottom:6px}
#login p{color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:5px 14px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
@media(max-width:900px){#top .logo h1{display:none}}
@media(max-width:620px){#top nav{display:none}}
.qs{display:flex;gap:8px;align-items:center}.qs input{max-width:320px}
.qlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.qlist a{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:3px 10px;background:#fff}
.qlist a:hover{border-color:var(--line-2);background:var(--paper)}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="box">
    <img id="loginLogo" src="" alt="" hidden>
    <h1 id="loginTitle">Qum Academic System</h1>
    <p id="loginSub">학교 구글 계정으로 로그인하세요</p>
    <button class="btn" id="btnLogin">Google 로그인</button>
    <div class="foot">Educclesia Group</div>
  </div>
</div>
<div id="app" hidden>
  <header id="top">
    <div class="logo"><img id="topLogo" src="" alt="" hidden><h1 id="topTitle">Qum Academic System</h1></div>
    <nav id="nav"></nav>
    <div class="me"><span id="meName"></span><span class="tag" id="meRole"></span><button id="btnOut">나가기</button></div>
  </header>
  <main id="view"></main>
  <div class="foot">Educclesia Group</div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc as _setDoc, updateDoc as _updateDoc, collection, getDocs, query, where, orderBy, limit, writeBatch as _writeBatch, deleteDoc as _deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBh_YwVF6xaQv0P5csZwhD9tzz3i7jv2_A",
  authDomain: "qum-sis.firebaseapp.com",
  projectId: "qum-sis",
  storageBucket: "qum-sis.firebasestorage.app",
  messagingSenderId: "324861037215",
  appId: "1:324861037215:web:32f3e749d2fcac93d430aa"
};
const OWNER = "joon.kim@educclesia.com";   // 플랫폼 소유자(에듀클레시아)
const DEFAULT_SCHOOL = "qum";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT; const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); };

/* ---------- 세션 ---------- */
let me = null;          // {email, name, role, schoolId, studentId}
let school = null;      // settings doc
let sid = DEFAULT_SCHOOL;
const col = name => collection(db, "schools", sid, name);
const ref = (name, id) => doc(db, "schools", sid, name, String(id));

/* ---------- 변경 이력: 모든 쓰기를 schools/{sid}/audit 에 자동 기록 (교장만 열람) ---------- */
const AUDIT_BEFORE=new Set(["grades","attendance","incidents","students","activities","memberships","accounts","comments"]);
const pathInfo = r => { const p=r.path.split("/"); return {path:r.path, col:p[0]==="schools"?(p[2]||"school"):p[0], docId:p[p.length-1]}; };
const auditJson = v => { if (v==null) return ""; try { const s=JSON.stringify(v,(k,x)=> (x && typeof x==="object" && !Array.isArray(x) && Object.getPrototypeOf(x)!==Object.prototype) ? (x.seconds!=null? new Date(x.seconds*1000).toISOString().slice(0,19) : "(저장 시각)") : x); return s.length>4000? s.slice(0,4000)+"…" : s; } catch(e){ return ""; } };
const stuOf = (c,id,d,b) => (d&&d.studentId) || (b&&b.studentId) || (c==="students"||c==="accounts" ? id : (c==="grades"||c==="attendance") ? String(id).split("_")[0] : "");
async function beforeOf(r){ if (!me) return undefined; if (!AUDIT_BEFORE.has(pathInfo(r).col)) return undefined; try { const x=await getDoc(r); return x.exists()? x.data() : null; } catch(e){ return undefined; } }
function audit(r, op, data, before){ if (!me) return; const {path,col:c,docId}=pathInfo(r); if (c==="audit") return; const st=stuOf(c,docId,data,before);
  _setDoc(doc(collection(db,"schools",sid,"audit")), {path, col:c, docId, op, count:1, studentIds: st?[String(st)]:[], data:auditJson(data), before: before===undefined? null : auditJson(before), by:me.email, role:me.role, at:serverTimestamp()}).catch(e=>console.warn("audit",e)); }
async function setDoc(r,d,o){ const b=await beforeOf(r); const x = o ? await _setDoc(r,d,o) : await _setDoc(r,d); audit(r, o&&o.merge?"merge":"set", d, b); return x; }
async function updateDoc(r,d){ const b=await beforeOf(r); await _updateDoc(r,d); audit(r,"update",d,b); }
async function deleteDoc(r){ const b=await beforeOf(r); await _deleteDoc(r); audit(r,"delete",null,b); }
function writeBatch(dbx){ const b=_writeBatch(dbx), ops=[];
  const w={ set(r,d,o){ o? b.set(r,d,o) : b.set(r,d); ops.push([r,"set",d]); return w; }, update(r,d){ b.update(r,d); ops.push([r,"update",d]); return w; }, delete(r){ b.delete(r); ops.push([r,"delete",null]); return w; },
    async commit(){ await b.commit(); if (!me||!ops.length) return; const cols={}, stu=new Set();
      ops.forEach(([r,op,d])=>{ const i=pathInfo(r); cols[i.col]=(cols[i.col]||0)+1; const x=stuOf(i.col,i.docId,d); if (x) stu.add(String(x)); });
      _setDoc(doc(collection(db,"schools",sid,"audit")), {op:"batch", col:Object.keys(cols).join(","), cols, count:ops.length, studentIds:[...stu].slice(0,300), data:auditJson(ops.slice(0,25).map(([r,op,d])=>({path:r.path,op,d}))), before:null, by:me.email, role:me.role, at:serverTimestamp()}).catch(e=>console.warn("audit",e)); } };
  return w; }

const ROLES = { owner:"소유자", principal:"교장", academic:"학사", admin:"행정", teacher:"교사", student:"학생" };
const can = {
  manage: () => ["owner","admin","principal","academic"].includes(me.role),
  settings: () => ["owner","principal"].includes(me.role),
  staff: () => ["owner","admin","principal","academic","teacher"].includes(me.role),
};
// 교사(teacher)는 자기 담임반 학생만. 학사·행정·교장은 전교.
const isTeacherOnly = () => me.role==="teacher";
let myHouseCache=null;
async function myHouse(term){ term=term||school.termCode; if (myHouseCache&&myHouseCache.t===term) return myHouseCache.h;
  const secs=await loadSections(); const h=secs.find(x=>x.kind==="house"&&x.termCode===term&&x.teacherEmail===me.email)||null; myHouseCache={t:term,h}; return h; }
// 교사 열람 범위: schools/{sid}/scopes/{email}.studentIds (담임반 + 맡은 과목 수강생). 학사·행정이 '과목 담당 교사'·'반' 화면에서 다시 계산
let scopeCache=null;
async function myScope(){ if (!isTeacherOnly()) return null; if (!scopeCache){ const d=await getDoc(ref("scopes",me.email)).catch(()=>null); scopeCache=(d&&d.exists()&&d.data().studentIds)||[]; } return scopeCache; }
const snapOf = arr => ({docs:arr.map(x=>({id:x.id, data:()=>x.d})), size:arr.length, empty:!arr.length});
// 학생 목록 — 관리자는 전체, 교사는 범위 안 학생만(한 명씩)
async function stuSnap(){ const S=await myScope(); if (!S) return getDocs(col("students"));
  const ds=await Promise.all(S.map(id=>getDoc(ref("students",id)).catch(()=>null))); return snapOf(ds.filter(d=>d&&d.exists()).map(d=>({id:d.id,d:d.data()}))); }
// 학생 기록 질의 — 관리자는 field==val 그대로, 교사는 범위 안 학생별 질의 후 걸러냄(규칙이 학생 단위로 검사)
async function scoped(name, field, val, withCommon, only){ const S=await myScope(); if (!S) return getDocs(field?query(col(name), where(field,"==",val)):col(name));
  const ids=[...(only?S.filter(i=>only.includes(i)):S), ...(withCommon?["__common"]:[])];
  const rs=await Promise.all(ids.map(id=>getDocs(query(col(name), where("studentId","==",String(id)))).catch(()=>({docs:[]}))));
  const out=[]; rs.forEach(r=>r.docs.forEach(d=>{ const x=d.data(); if (!field||x[field]===val) out.push({id:d.id,d:x}); })); return snapOf(out); }
// 열람 범위 다시 계산(학사·행정·교장): 담임반 학생 ∪ 담당 과목(이번 학기 성적 줄) 수강생
async function rebuildScopes(term, gradesArr){ term=term||school.termCode; sectionCache=null; mentorCache=null;
  const [secs, M, old] = await Promise.all([loadSections(), loadMentors(), getDocs(col("scopes")).catch(()=>({docs:[]}))]);
  const grades = gradesArr || (await getDocs(query(col("grades"), where("termCode","==",term)))).docs.map(d=>d.data());
  const sc={}; const add=(em,ids)=>{ if(!em) return; (sc[em]=sc[em]||new Set()); ids.forEach(i=>sc[em].add(String(i))); };
  secs.filter(x=>x.kind==="house"&&x.termCode===term).forEach(h=>add(h.teacherEmail,h.studentIds||[]));
  Object.values(M).forEach(m=>{ const k=normSubj(m.subject); const ids=grades.filter(r=>r.source!=="miri"&&normSubj(r.title)===k).map(r=>r.studentId); (m.emails||[]).forEach(e=>add(e,ids)); });
  let b=writeBatch(db), n=0;
  for (const [em,set] of Object.entries(sc)){ b.set(ref("scopes",em),{studentIds:[...set].sort(),term,updatedAt:serverTimestamp(),by:me.email}); n++; }
  old.docs.forEach(d=>{ if (!sc[d.id] && d.id!=="_meta") { b.set(ref("scopes",d.id),{studentIds:[],term,updatedAt:serverTimestamp(),by:me.email}); } });
  b.set(ref("scopes","_meta"),{term,teachers:n,at:Date.now(),by:me.email});
  await b.commit(); return n; }
// 자동 갱신: 학사·행정·교장이 앱을 열 때 1시간 넘게 지났으면 뒤에서 다시 계산 (Genius 갱신·선택과목 동기화로 바뀐 수강생 반영)
async function autoScopes(){ if (!can.manage()) return; try {
  const m=await getDoc(ref("scopes","_meta")); const last=m.exists()?m.data().at||0:0;
  if (Date.now()-last < 3600e3 && m.data()?.term===school.termCode) return;
  const n=await rebuildScopes(school.termCode); console.log("scopes rebuilt",n);
} catch(e){ console.warn("autoScopes",e); } }
// 징계는 교사에게 학생별 질의로만(규칙: 담임반 학생만 읽기)
async function incidentsFor(ids){ const r=await Promise.all(ids.map(i=>getDocs(query(col("incidents"), where("studentId","==",String(i)))).then(s=>s.docs.map(d=>({id:d.id,...d.data()}))).catch(()=>[]))); return r.flat(); }

async function resolveMember(user){
  const email = user.email.toLowerCase();
  if (email === OWNER) {
    // 소유자 첫 로그인: 학교·멤버십 없으면 만든다
    const m = await getDoc(doc(db,"memberships",email));
    if (!m.exists()) await setDoc(doc(db,"memberships",email), {schoolId:DEFAULT_SCHOOL, role:"owner", createdAt:serverTimestamp()});
    sid = m.exists() ? m.data().schoolId : DEFAULT_SCHOOL;
    const s = await getDoc(doc(db,"schools",sid));
    if (!s.exists()) await setDoc(doc(db,"schools",sid), {
      schoolName:"Qum Educlesia", schoolNameKo:"이오에스 미래 리더스",
      logoUrl:"", color:"#23262B", accent:"#C8553D", address:"", phone:"", ceeb:"", principal:"Joon Kim",
      termCode:"2026F", nextId:9001, createdAt:serverTimestamp()
    });
    return {email, name:user.displayName, role:"owner"};
  }
  const m = await getDoc(doc(db,"memberships",email));
  if (!m.exists()) return null;
  sid = m.data().schoolId;
  return {email, name:user.displayName, role:m.data().role, studentId:m.data().studentId||null};
}

function buildNav(){

window.addEventListener("hashchange", route);
async function route(){
  if (!me) return;
  const [k, arg] = location.hash.replace(/^#\/?/,"").split("/");
  if (me.role==="student" && !k) { location.hash="#/me"; return; }
  const KMAP={transcript:"students",miri:"students"}; const kk=KMAP[k]||k||"";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.k===kk));
  const gg=routes[kk]?.g; document.querySelectorAll("#nav .dd").forEach(d=>d.classList.toggle("on", d.dataset.g===gg));
  if (document.activeElement && document.activeElement.closest && document.activeElement.closest("#nav")) document.activeElement.blur();
  const v = $("#view"); v.innerHTML = `<p class="muted">불러오는 중…</p>`;
  const sub = location.hash.replace(/^#\/?/,"").split("/")[2];
  try {
    if (k==="comments") return await viewComments();
    if (k==="biweekly") return await viewBiweekly();
    if (k==="sections" && arg) return await viewSection(arg);
  if (k==="students" && arg) return await (sub==="grades" ? viewStudentGrades(arg) : sub==="attendance" ? viewStudentAttendance(arg) : sub==="activities" ? viewStudentActivities(arg) : sub==="discipline" ? viewDiscipline(arg) : viewStudent(arg));
    if (k==="transcript" && arg) return await viewTranscript(arg);
    if (k==="miri" && arg) return await viewMiri(arg);
  } catch(e){ console.error(e); v.innerHTML=e.code==="permission-denied"?`<div class="card"><p>볼 수 있는 범위가 아닙니다. (교사는 담임반 학생과 맡은 과목 수강생만)</p></div>`:`<div class="card"><p class="warn">오류: ${esc(e.code||e.message)}</p></div>`; return; }
  const r = routes[k||""]; if (!r || !r.show()) { v.innerHTML="<p>권한이 없습니다.</p>"; return; }
  try { await r.view(); } catch(e){ console.error(e); v.innerHTML=e.code==="permission-denied"?`<div class="card"><p>볼 수 있는 범위가 아닙니다. (교사는 담임반 학생과 맡은 과목 수강생만)</p></div>`:`<div class="card"><p class="warn">오류: ${esc(e.code||e.message)}</p></div>`; }
}

async function viewHome(){

  const cur = all.filter(s=>!s.status||s.status==="active"||s.status==="pending");
  const byGrade = {}; let review=0, pending=0;
  for (const s of cur){ const g=s.grade||"?"; byGrade[g]=(byGrade[g]||0)+1; if (s.needsReview) review++; if (s.status==="pending") pending++; }
  const past = {}; all.filter(s=>!cur.includes(s)).forEach(s=>past[s.status]=(past[s.status]||0)+1);
  const grades = Object.keys(byGrade).sort((a,b)=>(parseInt(a)||99)-(parseInt(b)||99));
  const gl = g => /^\d+$/.test(g)?g+"학년":g==="?"?"학년 미입력":g;
  $("#view").innerHTML = `
  <div class="card"><h2>학생 찾기</h2>
    <div class="qs"><input id="qsIn" placeholder="이름(한글·영문) 또는 ID" autocomplete="off"><label class="muted" style="white-space:nowrap"><input type="checkbox" id="qsAll" style="width:auto"> 졸업·자퇴생 포함</label></div>
    <div class="qlist" id="qsOut"></div></div>
  <div class="card"><h2>${esc(school.schoolName)} · ${esc(termLabel(school.termCode))}</h2>
    <div class="stat">
      <div><b>${cur.length}</b><span>재학생</span></div>
      ${grades.map(g=>`<div><b>${byGrade[g]}</b><span>${gl(g)}</span></div>`).join("")}
      <div><b style="color:var(--pending)">${review}</b><span>확인 필요</span></div>
      <div><b style="color:var(--warn)">${pending}</b><span>정보 미입력</span></div>
    </div>
    ${Object.keys(past).length?`<p class="muted" style="margin:10px 0 0">기록 보관: ${Object.entries(past).map(([k,v])=>`${STATUS_KO[k]||k} ${v}명`).join(" · ")}</p>`:""}
  </div>`;
  const norm=x=>String(x||"").toLowerCase().replace(/\s+/g,"");
  const draw=()=>{ const q=norm($("#qsIn").value); const pool=$("#qsAll").checked?all:cur;
    const hit=q?pool.filter(s=>[s.id,s.name_ko,s.last_en+s.first_en,s.first_en+s.last_en,s.last_en+","+s.first_en].some(v=>norm(v).includes(q))).slice(0,40):[];
    $("#qsOut").innerHTML=hit.map(s=>`<a href="#/students/${esc(s.id)}">${esc(s.name_ko||"")} ${esc(s.last_en||"")}, ${esc(s.first_en||"")} <span class="muted">${esc(s.id)}${s.grade?" · "+esc(s.grade)+"학년":""}${s.status&&s.status!=="active"?" · "+(STATUS_KO[s.status]||s.status):""}</span></a>`).join("")||(q?`<span class="muted">없음</span>`:""); };
  $("#qsIn").oninput=draw; $("#qsAll").onchange=draw; $("#qsIn").focus();
}

  const draw=()=>{
    const q=$("#q").value.toLowerCase(), g=$("#g").value, r=$("#onlyReview").checked, st=$("#st").value;
    const list = all.filter(s=>(st==="all"||(st==="cur"?isCur(s):s.status===st))&&(!g||String(s.grade)===g)&&(!r||s.needsReview)&&(!q||[s.id,s.last_en,s.first_en,s.name_ko,s.email].join(" ").toLowerCase().includes(q)));

          batch.set(ref("grades",gid), {...o, updatedAt:serverTimestamp(), updatedBy:me.email}, {merge:true}); ops++; n++; if (ops>=400) await flush(); continue; }
        const extra={}; if (wl) extra.weekList=wl; if (r.score!==undefined&&r.score!=="") extra.score=parseFloat(r.score); if (r.subjectKo) extra.subjectKo=r.subjectKo; if (r.level) extra.level=r.level; if (r.transcriptGrade) extra.transcriptGrade=r.transcriptGrade; if (r.weeks) extra.weeks=parseInt(r.weeks); if (r.kTerm) extra.kTerm=r.kTerm;

function parseDelimited(text){
  text = text.replace(/\r/g,"").trim(); if (!text) return [];
  const delim = text.split("\n")[0].includes("\t") ? "\t" : ",";
  const rows=[]; let row=[], cell="", inQ=false;
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if (inQ){ if (ch==='"'){ if (text[i+1]==='"'){cell+='"';i++;} else inQ=false; } else cell+=ch; }
    else if (ch==='"') inQ=true;
    else if (ch===delim){ row.push(cell); cell=""; }
    else if (ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch; }
  row.push(cell); rows.push(row);
  const hdr = rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(c=>c.trim())).map(r=>Object.fromEntries(hdr.map((h,i)=>[h,(r[i]||"").trim()])));
}

const subNav = (id, on) => `<div class="sub noprint"><a href="#/students/${id}" class="${on==="info"?"on":""}">정보</a><a href="#/students/${id}/grades" class="${on==="grades"?"on":""}">성적</a><a href="#/students/${id}/attendance" class="${on==="att"?"on":""}">출결</a>${me&&(can.staff())?`<a href="#/students/${id}/discipline" class="${on==="disc"?"on":""}">징계</a>`:""}<a href="#/students/${id}/activities" class="${on==="act"?"on":""}">수상·활동</a><a href="#/transcript/${id}" class="${on==="tr"?"on":""}">Transcript</a>${me&&(can.staff())?`<a href="#/report//${school.termCode}/${id}">Progress Report</a>`:""}<a href="#/miri/${id}" class="${on==="miri"?"on":""}">학습성장기록부</a>${me&&can.settings()?`<a href="#/audit/${id}">변경 이력</a>`:""}</div>`;
const slug = t => String(t).toLowerCase().replace(/[^a-z0-9가-힣]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const courseId = r => r.code ? String(r.code).trim() : (r.title ? "t_"+slug(r.title.replace(/\s+Sem\s*[12].*$/i,"")) : "");
function termLabel(tc){ const m=/^(\d{4})([FSU])$/.exec(tc||""); if(!m) return tc||""; const y=+m[1];
  return m[2]==="F" ? `Fall ${y}-${String(y+1).slice(2)}` : (m[2]==="S"?`Spring ${y-1}-${String(y).slice(2)}`:`Summer ${y-1}-${String(y).slice(2)}`); }
const termKey = tc => { const m=/^(\d{4})([FSU])$/.exec(tc||""); return m ? +m[1] + ({F:0.5,S:0,U:0.25}[m[2]]) : 0; };
const PTS={A:4,B:3,C:2,D:1,F:0}, WPTS={A:5,B:4,C:3,D:2,F:1.7};
function gpaOf(rows){ // 학점 가중 평균 (카운슬러 시트와 동일)
  const done=rows.filter(r=>r.grade in PTS && r.credit>0); const cr=done.reduce((a,r)=>a+r.credit,0);
  if (!cr) return {u:0,w:0,credits:0};
  return {u:done.reduce((a,r)=>a+PTS[r.grade]*r.credit,0)/cr, w:done.reduce((a,r)=>a+(r.weighted?WPTS:PTS)[r.grade]*r.credit,0)/cr, credits:cr};
}
const f2 = n => (Math.round(n*100)/100).toFixed(2);
const AREA_RANK={"2":0,"3":1,"1":2,"4":3,"5":4,"6":5,"7":6,"8":7,"9":8};  // 영어·수학·사회·과학·외국어·예술·경영·체육·학교선택
const areaRank = c => c ? (AREA_RANK[String(c)[0]] ?? 8) : 9;              // 코드 없는 선택과목은 맨 뒤
async function loadGrades(id){ const q=query(col("grades"), where("studentId","==",String(id))); return (await getDocs(q)).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>termKey(a.termCode)-termKey(b.termCode) || (a.gLevel||0)-(b.gLevel||0) || areaRank(a.code)-areaRank(b.code) || String(a.code).localeCompare(b.code) || String(a.title).localeCompare(b.title)); }
let courseCache=null; async function loadCourses(){ if(!courseCache){ courseCache=(await getDocs(col("courses"))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.code||"zz").localeCompare(b.code||"zz")||a.title.localeCompare(b.title)); } return courseCache; }

      <td>${editable?`<input data-c="${r.id}" value="${r.credit}" style="width:60px;padding:3px">`:r.credit}</td><td>${r.weighted?"+":""}</td><td class="muted">${esc(r.source)}</td>
      <td class="nw">${r.needsReview?`<span class="tag pend">확인</span>`:""} ${can.manage()?`<button class="btn sm ghost" data-del="${r.id}">×</button>`:""}</td></tr>`).join("")+`<tr class="tot"><td colspan="5" style="text-align:right">Semester Totals</td><td>${f2(tg.u)} / ${f2(tg.w)}</td><td>${tg.credits}</td><td colspan="3"></td></tr>`; }).join("")}

const ATT_CODES={"u.t":"무단 지각","u.a":"무단 결석","e.t":"사유 지각","e.a":"사유 결석"};

const attSheetNote = () => `<p class="tag" style="display:inline-block;margin:0 0 10px">출결 입력·슬립 승인은 <a href="${ATT_SHEET}" target="_blank" rel="noopener"><b>출결 원본 시트</b></a>에서 합니다. 여기는 보기 전용이며 15분마다 갱신됩니다.</p>`;
const finalCode = a => a.approved ? a.code.replace("u.","e.") : a.code;
const todayISO = () => { const t=new Date(); t.setMinutes(t.getMinutes()-t.getTimezoneOffset()); return t.toISOString().slice(0,10); };
async function viewAttendance(dateSel){

  const recs={}; as.docs.forEach(d=>recs[d.data().studentId]=d.data());

    ${studs.map(s=>{ const r=recs[s.id]||{}; return `<tr data-s="${s.id}"><td>${esc(s.grade)}</td><td>${esc(s.last_en)}, ${esc(s.first_en)} <span class="muted">${esc(s.name_ko||"")}</span></td><td class="muted">${esc(s.track||"")}</td>
      <td class="nw">${Object.entries(ATT_CODES).map(([c,l])=>`<button class="btn sm ${r.code===c?"":"ghost"}" data-c="${c}" title="${l}" ${ATT_SHEET?"disabled":""}>${c}</button>`).join(" ")}</td>
      <td><input data-note value="${esc(r.note||"")}" placeholder="사유" ${r.code&&!ATT_SHEET?"":"disabled"} style="padding:4px 8px"></td></tr>`; }).join("")}
    </tbody></table></div></div>`;
  $("#dt").onchange=e=>viewAttendance(e.target.value);

    });
    note.onchange=async()=>{ await updateDoc(ref("attendance",`${sid}_${date}`),{note:note.value}); toast("저장"); };
  });
}
async function viewSlips(){

  const [as, ss]=await Promise.all([scoped("attendance","termCode",term), stuSnap()]);

  const inc = incRows.sort((a,b)=>b.date.localeCompare(a.date));
  const head = id ? `<h2>${esc(d.last_en)}, ${esc(d.first_en)} <span class="muted" style="font-size:14px">ID ${esc(id)}</span></h2>${subNav(id,"disc")}` : `<h2>징계 기록${houseIds?` <span class="muted" style="font-size:14px">내 담임반</span>`:""}</h2>`;

      <div><label>카테고리</label><select name="category" id="dCat" disabled><option value="">먼저 단계 선택</option></select></div>
      <div><label>해당 행위</label><select name="behavior" id="dBeh" disabled><option value="">먼저 카테고리 선택</option></select></div>
    </div><div class="grid" style="grid-template-columns:1fr 1.4fr 1.6fr 140px;margin-top:8px">

/* ---------- 반(section) · 진도 상태 ---------- */
// 담임반(house) = 학년 1반, 담임이 전 과목(미리)·출결 확인서·세특 담당. 과목반(course) = 심화 과목별, 담당 교사가 진도 상태 입력.
const HOUSE_NAME = g => { const n=parseInt(g); if (n>=6&&n<=8) return "Middle School"; return {9:"Freshman",10:"Sophomore",11:"Junior",12:"Senior"}[n] || (String(g).toUpperCase()==="PG"?"Senior":`Grade ${g}`); };
const US_GRADE_LABEL = (g,tc) => { const t=/([FSU])$/.exec(tc||"")?.[1]; const base=String(g).toUpperCase()==='PG'?'PG':(g!==undefined&&g!==null&&g!==''?`G${g}`:''); if (!base) return ''; return t==='F'?`${base} Sem 1`:t==='S'?`${base} Sem 2`:t==='U'?`${base} Summer`:base; };
const KO_GRADE_LABEL = (dob,tc) => { const by=parseInt(String(dob||"").slice(0,4)); const m=/^(\d{4})([FSU])$/.exec(tc||""); if (!by||!m) return ""; const g=+m[1]-by-6; const lab=g>=10?`고${g-9}`:g>=7?`중${g-6}`:g>=1?`초${g}`:""; return lab?`${lab}-${m[2]==="F"?2:1}학기`:""; };
const STAFF_NAMES = {"julie.cho":"조성하 (Julie Cho)","eunji.ahn":"안은지 (Eunji Ahn)","jin.kim":"김형진 (Jin Kim)","onyou.na":"나온유 (Onyou Na)","jeein.kang":"강지인 (Jeein Kang)"};
const maskKo = t => String(t||"").replace(/[가-힣]{2,}/g, w => w.length===2 ? w[0]+"*" : w[0]+"*".repeat(w.length-2)+w[w.length-1]);   // 한국 이름 가운데 * (조성하 → 조*하)
const TEACHER_OF = h => { const id=(h?.teacherEmail||"").split("@")[0]; return maskKo(h?.teacherName || STAFF_NAMES[id] || id); };
const PROG = {ontrack:{l:"On Track",c:"ok"}, behind:{l:"Behind (5–10)",c:"pend"}, far:{l:"Severely Behind",c:"warn"}};
const isoLocal = t => { t=new Date(t); t.setMinutes(t.getMinutes()-t.getTimezoneOffset()); return t.toISOString().slice(0,10); };
const addDays = (d,n) => { const t=new Date(d+"T00:00:00"); t.setDate(t.getDate()+n); return isoLocal(t); };
const termKo = tc => { const m=/^(\d{4})([FSU])$/.exec(tc||""); if(!m) return tc||""; const y=+m[1]; return m[2]==="F" ? `${y}-${String(y+1).slice(2)} 가을학기` : m[2]==="S" ? `${y-1}-${String(y).slice(2)} 봄학기` : `${y-1}-${String(y).slice(2)} 여름학기`; };
let sectionCache=null;
async function loadSections(){ if(!sectionCache) sectionCache=(await getDocs(col("sections"))).docs.map(d=>({id:d.id,...d.data()})); return sectionCache; }
const stripSem = t => String(t||"").replace(/\s+Sem\s*[12].*$/i,"");

    ${cur.map(s=>`<tr><td>${s.kind==="house"?`<span class="tag">담임</span>`:`<span class="tag ok">과목</span>`}</td><td><a href="#/sections/${s.id}">${esc(s.title)}</a></td>

async function viewSection(id){
  const [sd, ss, ps] = await Promise.all([getDoc(ref("sections",id)), stuSnap(), scoped("progress","sectionId",id)]);
  if (!sd.exists()) return $("#view").innerHTML="<p>없는 반입니다.</p>";
  const s={id,...sd.data()}; const names={}; ss.docs.forEach(d=>names[d.id]={id:d.id,...d.data()});
  const prog={}; ps.docs.forEach(d=>prog[d.id]=d.data());
  const canEdit=can.staff(); const gnum=g=>parseInt(g)||99;
  const roster=(s.studentIds||[]).map(i=>names[i]).filter(Boolean).sort((a,b)=>gnum(a.grade)-gnum(b.grade)||String(a.last_en).localeCompare(b.last_en));
  // 담임반: 학생마다 이번 학기 듣는 과목(성적 줄) + 미리 한 줄. 과목반: 과목 한 줄.

  const btns=(e)=>Object.entries(PROG).map(([k,v])=>`<button class="btn sm ${e.st===k?"":"ghost"}" data-p="${k}" ${canEdit?"":"disabled"} ${e.st===k&&e.auto?'style="opacity:.75"':""}>${v.l}</button>`).join(" ");
  const gcell=r=> r.asOf ? `${r.score!=null?r.score+"점 · ":""}밀린 ${Math.max(0,r.behind??0)}개 <span class="muted">(${r.asOf.slice(5)})</span>` : "";
  $("#view").innerHTML=`<div class="card"><h2>${esc(s.title)} <span class="tag">${s.kind==="house"?"담임반":"과목반"}</span> <span class="muted" style="font-size:14px">${termLabel(s.termCode)} · ${esc(s.teacherEmail||"담당 미정")}</span></h2>

    <div id="rosterEd" hidden class="card" style="background:var(--paper)"></div>
    <table><thead><tr><th>학년</th><th>학생</th><th>과목</th><th>Genius</th><th>진도 상태</th><th>메모</th><th>최근 기록</th></tr></thead><tbody>
    ${roster.map(st=>{ const rows=rowsOf(st); return rows.map((r,i)=>{ const pid=`${id}_${st.id}_${r.key}`; const p=prog[pid]||{}; return `<tr data-pid="${pid}" data-s="${st.id}" data-k="${r.key}" data-t="${esc(r.title)}" ${i===0?'style="border-top:2px solid var(--line)"':""}>
      ${i===0?`<td rowspan="${rows.length}">${esc(st.grade)}</td><td rowspan="${rows.length}" class="nw"><a href="#/students/${st.id}">${esc(st.last_en)}, ${esc(st.first_en)}</a><br><span class="muted">${esc(st.name_ko||"")}</span></td>`:""}
      <td class="nw">${esc(r.title)}</td><td class="nw muted" style="font-size:12.5px">${gcell(r)}</td><td class="nw">${btns(eff(p,r))}</td>
      <td><input data-note value="${esc(p.note||"")}" placeholder="메모" style="padding:4px 8px" ${canEdit?"":"disabled"}></td><td class="muted nw" data-when>${p.date?`${p.date} · ${esc((p.by||"").split("@")[0])}`:"—"}</td></tr>`; }).join(""); }).join("")||`<tr><td colspan=7 class=muted>명단이 비어 있습니다${can.manage()?" — '명단 수정'으로 넣으세요":""}</td></tr>`}
    </tbody></table></div>`;
  document.querySelectorAll("tr[data-pid]").forEach(tr=>{ const pid=tr.dataset.pid, stid=tr.dataset.s, note=tr.querySelector("[data-note]");
    const save=async(status)=>{ const cur=prog[pid]||{}; const st=status??cur.status; if(!st) return toast("상태를 먼저 고르세요");
      const hist=(cur.history||[]).slice(-19); if (cur.status && (cur.status!==st||(cur.note||"")!==note.value.trim())) hist.push({date:cur.date||"",status:cur.status,note:cur.note||"",by:cur.by||""});
      const data={sectionId:id,studentId:stid,termCode:s.termCode,courseId:tr.dataset.k,title:tr.dataset.t,status:st,note:note.value.trim(),date:today,by:me.email,at:serverTimestamp(),history:hist};
      await setDoc(ref("progress",pid),data); prog[pid]=data; tr.querySelector("[data-when]").textContent=`${today} · ${me.email.split("@")[0]}`;
      updateDoc(ref("sections",id),{progressDate:today}).catch(()=>{}); toast("저장"); };

  const er=$("#edR"); if (er) er.onclick=()=>{ const all=Object.values(names).filter(x=>x.status==="active"||!x.status).sort((a,b)=>gnum(a.grade)-gnum(b.grade)||String(a.last_en).localeCompare(b.last_en)); const set=new Set(s.studentIds||[]);

    $("#svR").onclick=async()=>{ const ids=[...document.querySelectorAll("[data-r]:checked")].map(c=>c.dataset.r); await updateDoc(ref("sections",id),{studentIds:ids,updatedAt:serverTimestamp(),by:me.email}); toast("저장"); sectionCache=null; viewSection(id); }; };
}

  if (!h){ $("#view").innerHTML=head; $("#bwH").onchange=go; $("#bwS").onchange=go; $("#bwE").onchange=go; return; }
  const ids=h.studentIds||[];
  const [ss, as, ps, cd, gs] = await Promise.all([stuSnap(), scoped("attendance","termCode",term), scoped("progress","termCode",term), getDoc(ref("biweekly",`${h.id}_${end}`)), getDocs(query(col("grades"), where("termCode","==",term)))]);
  const gRows=gs.docs.map(d=>d.data()).filter(r=>r.source!=="miri");
  const gnum=g=>parseInt(g)||99;
  const studs=ss.docs.map(d=>({id:d.id,...d.data()})).filter(s=>ids.includes(s.id)).sort((a,b)=>gnum(a.grade)-gnum(b.grade)||String(a.last_en).localeCompare(b.last_en));
  const att=as.docs.map(d=>d.data()); const prog={}; ps.docs.forEach(d=>{ prog[d.id]=d.data(); });
  const comments=cd.exists()?(cd.data().comments||{}):{};
  const Z=()=>({"e.a":0,"e.t":0,"u.a":0,"u.t":0});
  const count=(sid,from,to)=>{ const t=Z(); att.filter(a=>a.studentId===sid&&(!from||(a.date>=from&&a.date<=to))).forEach(a=>t[finalCode(a)]++); return t; };
  const us = x => x? `${x.slice(0,4)}.${x.slice(5,7)}.${x.slice(8,10)}.` : "";
  const teacherName = TEACHER_OF(h);
  const slip=st=>{ const p2=count(st.id,start,end), pt=count(st.id);
    const man=Object.values(prog).filter(p=>p.studentId===st.id&&p.status);
    const items=gRows.filter(r=>r.studentId===st.id).sort((a,b)=>areaRank(a.code)-areaRank(b.code)||String(a.title).localeCompare(b.title)).map(r=>{ const k=(r.courseId||courseId(r)||slug(r.title)).replace(/[\/\s.]/g,"_"); const p=man.find(x=>x.courseId===k)||{};
        const useMan=p.status&&(!r.auto||(p.date||"")>=(r.geniusAsOf||"")); const stt=useMan?p.status:r.auto; if(!stt) return null;
        return {title:stripSem(r.title), st:stt, note:useMan?(p.note||""):(r.behind>0?`밀린 과제 ${r.behind}개`:""), score:r.score, date:useMan?p.date:r.geniusAsOf}; }).filter(Boolean);
    const mp=man.find(x=>x.courseId==="miri"); if (mp) items.push({title:"미리 (전 과목)", st:mp.status, note:mp.note||"", score:null, date:mp.date});
    const progRows=items.map(i=>`<tr><td>${esc(i.title)}</td><td class="c">${i.score!=null?i.score:""}</td><td class="c"><span class="pt">${PROG[i.st]?.l||esc(i.st)}</span></td><td>${esc(i.note)}</td><td class="c">${i.date||""}</td></tr>`).join("");
    return `<div class="bw"><div class="bwh"><div><h2>격주 출결 보고서</h2><div>[${termKo(term)}] &nbsp; ${us(start)} ~ ${us(end)}</div></div><div class="sch">${esc(school.schoolNameKo||school.schoolName)}<br>${esc(school.schoolName)}</div></div>
      <table class="sg"><tr><th>학생</th><td>${esc(st.last_en)}, ${esc(st.first_en)} ${st.name_ko?`(${esc(st.name_ko)})`:""}</td><th>생년월일</th><td>${us(st.dob)}</td><th>학년</th><td class="c">${esc(st.grade)}</td><th>재학 상태</th><td class="c">전일제</td></tr>
        <tr><th>담임반</th><td>${esc(h.title)}</td><th>성별</th><td class="c">${esc(st.gender)}</td><th>졸업 연도</th><td class="c">${esc(st.gradYear)}</td><th>담임 교사</th><td>${esc(teacherName)}</td></tr></table>

        <tbody><tr><td>이번 2주</td><td class="c">${p2["e.a"]}</td><td class="c">${p2["e.t"]}</td><td class="c">${p2["u.a"]}</td><td class="c">${p2["u.t"]}</td></tr>
        <tr><td>학기 누적 (${termLabel(term)})</td><td class="c"><b>${pt["e.a"]}</b></td><td class="c"><b>${pt["e.t"]}</b></td><td class="c"><b>${pt["u.a"]}</b></td><td class="c"><b>${pt["u.t"]}</b></td></tr></tbody></table>

const ACT_KINDS = {
  award:{label:"수상 Awards", fields:[["awardType","구분","select",["School","Outside"]],["name","상 이름"],["date","날짜","date"],["description","설명"]], cols:["awardType","name","date","description"]},
  test:{label:"공인 시험 Test Scores", fields:[["test","시험","select",["Duolingo","TOEFL","IELTS","SAT","ACT","AP","Other"]],["date","응시일","month"],["subject","과목(AP)"],["score","점수"]], cols:["test","date","subject","score"]},
  activity:{label:"활동 Extracurricular", fields:[["category","분류","select",["Personal Project","Clubs","Competitions","Internship","Leadership","Arts","Sports","Other"]],["inside","학교 안/밖","select",["Inside","Outside"]],["name","활동 이름"],["position","역할"],["rank","순위·결과"],["startDate","시작","date"],["endDate","끝","date"],["description","무엇을 했나 (3줄 이상)","textarea"]], cols:["category","inside","name","position","rank","startDate","endDate","description"]},
  volunteer:{label:"교내 봉사 In-School Volunteer", fields:[["date","날짜","date"],["givenBy","담당 교사"],["name","행사·내용"],["hours","시간","number"]], cols:["date","givenBy","name","hours"]},
};
let actKind="award";
async function viewStudentActivities(id){
  const isSelf = me.role==="student" && me.studentId===String(id);
  const staff = can.staff();
  const [s, as] = await Promise.all([getDoc(ref("students",id)), getDocs(query(col("activities"), where("studentId","==",String(id))))]);
  if (!s.exists()) return $("#view").innerHTML="<p>없는 학생입니다.</p>";
  const d=s.data(), all=as.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>String(b.date||b.startDate||"").localeCompare(String(a.date||a.startDate||"")));
  const K=ACT_KINDS[actKind], rows=all.filter(r=>r.kind===actKind);
  const canAdd = isSelf || can.manage();
  const fh=(f,v)=> f[2]==="select"?`<div><label>${f[1]}</label><select name="${f[0]}">${f[3].map(o=>`<option ${o===(v??"")?"selected":""}>${o}</option>`).join("")}</select></div>`
    : f[2]==="textarea"?`<div style="grid-column:1/-1"><label>${f[1]}</label><textarea name="${f[0]}" rows="3">${esc(v)}</textarea></div>`
    : `<div><label>${f[1]}</label><input name="${f[0]}" type="${f[2]||"text"}" value="${esc(v)}"></div>`;
  $("#view").innerHTML=`<div class="card"><h2>${esc(d.last_en)}, ${esc(d.first_en)} <span class="muted" style="font-size:14px">ID ${esc(id)}</span></h2>${subNav(id,"act")}
    <div class="tabs">${Object.entries(ACT_KINDS).map(([k,v])=>`<button data-k="${k}" class="${k===actKind?"on":""}">${v.label} <span class="tag">${all.filter(r=>r.kind===k).length}</span></button>`).join("")}</div>
    ${canAdd?`<form id="af" class="card" style="background:var(--paper)"><div class="grid">${K.fields.map(f=>fh(f,"")).join("")}</div><input type="hidden" name="_id"><div class="row" style="margin-top:10px"><button class="btn sm" id="afBtn">추가</button><button type="button" class="btn sm ghost" id="afReset" hidden>취소</button></div></form>`:""}
    <div class="scroll"><table><thead><tr>${K.fields.map(f=>`<th>${f[1]}</th>`).join("")}<th>상태</th><th></th></tr></thead><tbody>
    ${rows.map(r=>`<tr>${K.fields.map(f=>`<td>${esc(r[f[0]]).replace(/\n/g,"<br>")}</td>`).join("")}<td class="nw">${r.approved?`<span class="tag ok">승인</span>`:`<span class="tag pend">대기</span>`}</td>
      <td class="nw">${staff&&can.manage()?`<label><input type="checkbox" data-ok="${r.id}" ${r.approved?"checked":""} style="width:auto"> 승인</label> `:""}${(can.manage()||(isSelf&&!r.approved))?`<button class="btn sm ghost" data-e="${r.id}">수정</button> <button class="btn sm ghost" data-del="${r.id}">×</button>`:""}</td></tr>`).join("")||`<tr><td colspan="${K.fields.length+2}" class="muted">아직 없음</td></tr>`}
    </tbody></table></div>
    ${isSelf?`<p class="muted" style="margin-top:10px">입력한 내용은 선생님이 확인한 뒤 성적표·기록부에 실립니다. 승인된 항목은 학교에 수정을 요청하세요.</p>`:""}</div>`;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{actKind=b.dataset.k; viewStudentActivities(id);});
  const af=$("#af"); if (af){
    af.onsubmit=async e=>{ e.preventDefault(); const v=readForm(af); const aid=v._id; delete v._id;
      if (!v.name && !v.test) return toast("이름은 필수");
      if (aid) await updateDoc(ref("activities",aid),{...v,updatedAt:serverTimestamp(),updatedBy:me.email});
      else await setDoc(doc(col("activities")),{...v,kind:actKind,studentId:String(id),approved:false,createdAt:serverTimestamp(),createdBy:me.email});
      toast("저장"); viewStudentActivities(id); };
    $("#afReset").onclick=()=>viewStudentActivities(id);
    document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{ const r=rows.find(x=>x.id===b.dataset.e); K.fields.forEach(f=>{ const el=af.querySelector(`[name="${f[0]}"]`); if(el) el.value=r[f[0]]||""; }); af.querySelector("[name=_id]").value=r.id; $("#afBtn").textContent="수정 저장"; $("#afReset").hidden=false; window.scrollTo({top:0,behavior:"smooth"}); });
  }
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("지울까요?")) return; await deleteDoc(ref("activities",b.dataset.del)); viewStudentActivities(id); });
  document.querySelectorAll("[data-ok]").forEach(el=>el.onchange=async()=>{ await updateDoc(ref("activities",el.dataset.ok),{approved:el.checked,approvedBy:me.email,approvedAt:serverTimestamp()}); viewStudentActivities(id); });
}

}

/* ---------- 학습성장기록부 (한국 생기부 양식) ---------- */
const MIRI_ORDER=["국어","수학","영어","사회","도덕","한국사","과학"];
const KO_GROUP={"국어":"국어","수학":"수학","영어":"영어","사회":"사회(역사포함)/도덕","도덕":"사회(역사포함)/도덕","한국사":"사회(역사포함)/도덕","과학":"과학"};
const miriGrade = sc => sc>=60?"A":sc>=50?"B":sc>=40?"C":"F";
const ayOf = tc => { const m=/^(\d{4})([FSU])$/.exec(tc||""); return m? (m[2]==="F"? +m[1] : +m[1]-1) : null; };
// 한국 학년도·학기: 3~8월 = 1학기, 9~2월 = 2학기 (2월은 전년도 2학기)
const kTermOfDate = d => { const [y,m]=String(d).split("-").map(Number); return (m>=3&&m<=8)? `${y}K1` : (m>=9? `${y}K2` : `${y-1}K2`); };
const kTermOfUS = tc => { const m=/^(\d{4})([FSU])$/.exec(tc||""); return m? (m[2]==="F"? `${m[1]}K2` : `${m[1]}K1`) : null; };
const kAY = kt => +String(kt).slice(0,4); const kSem = kt => String(kt).endsWith("K1")?"1":"2";
const kGradeLabel = g => g>=10? `고${g-9}` : g>=7? `중${g-6}` : g>=1? `초${g}` : "";
const AREA_KO={"1":"사회","2":"영어","3":"수학","4":"과학","5":"외국어","6":"예술","7":"교양","8":"체육","9":"선택"};
async function viewMiri(id){
  const staff=can.staff();
  const [s, all, as, acts, cms, U]=await Promise.all([getDoc(ref("students",id)), loadGrades(id), getDocs(query(col("attendance"), where("studentId","==",String(id)))), getDocs(query(col("activities"), where("studentId","==",String(id)))), staff?getDocs(query(col("comments"), where("studentId","==",String(id)))):Promise.resolve({docs:[]}), loadUnits()]);
  if (!s.exists()) return $("#view").innerHTML="<p>없는 학생입니다.</p>";
  const d=s.data(); const birthY=parseInt((d.dob||"").slice(0,4))||null;
  const kGradeOf = ay => birthY? ay-birthY-6 : null;   // 학령 기준: 7세 초1
  const today=new Date(); const todayKo=`${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일`;
  const us = x => x? `${x.slice(0,4)}.${x.slice(5,7)}.${x.slice(8,10)}.` : "";
  // 출결: 학년별
  const Z=()=>({"e.a":0,"e.t":0,"u.a":0,"u.t":0});
  const att={}; as.docs.forEach(x=>{ const r=x.data(); const kt0=kTermOfDate(r.date); const ay=kAY(kt0); const t=att[ay]=att[ay]||{"1":Z(),"2":Z()}; t[kSem(kt0)][finalCode(r)]++; });
  const attCell=(ay,c)=>{ const a=att[ay]["1"][c], b=att[ay]["2"][c]; return a+b ? `${a+b} <span style="font-size:8pt">(${a}/${b})</span>` : "0"; };
  const attGrades=Object.keys(att).map(Number).sort((a,b)=>a-b);
  // 수상·활동·봉사 (승인된 것만)
  const A=acts.docs.map(x=>x.data()).filter(a=>a.approved);
  const awards=A.filter(a=>a.kind==="award").sort((a,b)=>String(a.date||"").localeCompare(b.date||""));
  const activities=A.filter(a=>a.kind==="activity").sort((a,b)=>String(a.startDate||"").localeCompare(b.startDate||""));
  const vols=A.filter(a=>a.kind==="volunteer").sort((a,b)=>String(a.date||"").localeCompare(b.date||""));
  // 교과: 학년별 → 학기별
  const miri=all.filter(r=>r.source==="miri"); const apex=all.filter(r=>r.source!=="miri" && r.grade!=="IP" && r.credit>0 && r.school===school.schoolName);
  const kt = r => r.kTerm || kTermOfUS(r.termCode);
  const ays=[...new Set([...miri,...apex].map(r=>kAY(kt(r))))].filter(x=>x).sort();
  const comments=cms.docs.map(x=>({id:x.id,...x.data()})).filter(c=>c.kind!=="pr");
  const cell=(v)=>v==null||v===""?"&nbsp;":esc(v);
  const T=(hdr,rows,cls="")=>`<table class="sg ${cls}"><thead><tr>${hdr.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.join(""):`<tr><td colspan="${hdr.length}" class="c">해당 사항 없음</td></tr>`}</tbody></table>`;
  const subjectRows = ay => {
    const out=[];
    for (const sem of ["1","2"]){ const k=`${ay}K${sem}`;
      for (const sub of MIRI_ORDER){ const r=miri.find(x=>kt(x)===k&&x.subjectKo===sub); if (!r) continue;
        out.push(`<tr><td class="c">${sem}</td><td>${KO_GROUP[sub]}</td><td>${sub}</td><td class="c">${r.score}</td><td class="c">${miriGrade(r.score)}</td><td class="muted">미리 (${esc(r.level||"")})</td></tr>`); }
      for (const r of apex.filter(x=>kt(x)===k).sort((a,b)=>areaRank(a.code)-areaRank(b.code))){
        out.push(`<tr><td class="c">${sem}</td><td>${AREA_KO[String(r.code||"9")[0]]||"선택"} (심화)</td><td>${esc(r.title)}</td><td class="c">—</td><td class="c">${esc(r.grade)}</td><td class="muted">Apex 커리큘럼 ${termLabel(r.termCode)}${r.weighted?" · Honors/AP":""}</td></tr>`); }
    }
    return out; };
  // 세특: 학기별로 미리 과목은 [통과 단원 자동 문장 + 교사 관찰], 그 밖의 과목·공통은 교사 입력 그대로
  const commentRows = ay => { const out=[];
    for (const sem of ["1","2"]){ const k=`${ay}K${sem}`; const cs=comments.filter(c=>kTermOfUS(c.termCode)===k);
      for (const sub of MIRI_ORDER){ const r=miri.find(x=>kt(x)===k&&x.subjectKo===sub); const tc=cs.filter(c=>c.subject===sub).map(c=>c.text).join(" ");
        const auto=r?unitSentence(U,r):""; if (!auto&&!tc) continue;
        out.push(`<div><b>(${sem}학기)${sub}:</b> ${esc([auto,tc].filter(Boolean).join(" "))}</div>`); }
      cs.filter(c=>!MIRI_ORDER.includes(c.subject)).sort((a,b)=>String(a.subject).localeCompare(b.subject)).forEach(c=>out.push(`<div><b>(${sem}학기)${esc(c.subject||"공통")}:</b> ${esc(c.text)}</div>`)); }
    return out.join("")||`<div class="muted">기록 없음</div>`; };
  $("#view").innerHTML=`<div class="noprint row" style="max-width:860px;margin:0 auto 12px">${subNav(id,"miri")}<button class="btn sm" id="pr">인쇄 / PDF 저장</button></div>
  <div class="tr sgdoc" style="max-width:860px"><img class="wm" src="img/wm-eos.png" alt="">
    <h1 style="text-align:center;font-size:19pt;margin:0 0 18px;font-family:'Noto Serif KR',serif">학습성장기록부</h1>
    <table class="sg" style="margin-bottom:14px"><tr><th style="width:90px">학교</th><td>${esc(school.schoolNameKo||school.schoolName)}</td><th style="width:90px">학번</th><td>${esc(id)}</td><th style="width:110px">학년 (학령)</th><td>${(()=>{const now=new Date(); const ay=now.getMonth()+1>=3?now.getFullYear():now.getFullYear()-1; const g=kGradeOf(ay); return g?kGradeLabel(g):"";})()}</td></tr></table>
    <h3>1. 인적·학적사항</h3>
    <table class="sg"><tr><th style="width:90px">학생정보</th><td colspan="5"><div>성명 : ${esc(d.name_ko||"")} (${esc(d.last_en)}, ${esc(d.first_en)}) &nbsp;&nbsp; 성별 : ${d.gender==="F"?"여":d.gender==="M"?"남":""} &nbsp;&nbsp; 생년월일 : ${us(d.dob)}</div><div>주소 : ${esc(d.address_ko||d.address_en||"")}</div></td></tr>
      <tr><th>학적사항</th><td colspan="5">${d.enrollDate?`${us(d.enrollDate)} ${esc(school.schoolNameKo||school.schoolName)} 입학`:""}${d.prevSchool?` (${esc(d.prevSchool)} 에서 전입)`:""}${d.track?` · 트랙 ${esc(d.track)}`:""}</td></tr>
      <tr><th>특기사항</th><td colspan="5">${esc(d.distinctions||"")}&nbsp;</td></tr></table>
    <h3>2. 출결상황</h3>
    ${T(["학년도","학년","결석 (인정)","결석 (미인정)","지각 (인정)","지각 (미인정)","특기사항"], attGrades.map(ay=>`<tr><td class="c">${ay}</td><td class="c">${kGradeLabel(kGradeOf(ay))}</td><td class="c">${attCell(ay,"e.a")}</td><td class="c">${attCell(ay,"u.a")}</td><td class="c">${attCell(ay,"e.t")}</td><td class="c">${attCell(ay,"u.t")}</td><td>&nbsp;</td></tr>`))}
    <div style="font-size:8pt;color:#444;margin-top:2px">· 학년 합계이며 괄호 안은 (1학기/2학기)입니다.</div>
    <h3>3. 수상경력</h3>
    ${T(["학년","수상명","등급(위)","수상연월일","수여기관"], awards.map(a=>`<tr><td class="c">${a.date?kGradeLabel(kGradeOf(kAY(kTermOfDate(a.date)))):""}</td><td>${esc(a.name)}</td><td class="c">${esc(a.description||"")}</td><td class="c">${us(a.date)}</td><td class="c">${a.awardType==="School"?esc(school.schoolNameKo||school.schoolName):esc(a.awardType||"")}</td></tr>`))}
    <h3>4. 창의적 체험활동상황</h3>
    ${T(["학년","영역","활동명","역할·결과","기간","특기사항"], activities.map(a=>`<tr><td class="c">${a.startDate?kGradeLabel(kGradeOf(kAY(kTermOfDate(a.startDate)))):""}</td><td class="c">${esc(a.category||"")}</td><td>${esc(a.name)}</td><td>${esc([a.position,a.rank].filter(Boolean).join(" · "))}</td><td class="c nw">${us(a.startDate)}${a.endDate?" ~ "+us(a.endDate):""}</td><td>${esc(a.description||"")}</td></tr>`))}
    <div style="margin-top:8px"><b>봉사활동실적</b></div>
    ${T(["일자 또는 기간","장소 또는 주관기관명","활동내용","시간","누계시간"], (()=>{let acc=0; return vols.map(v=>{acc+=parseFloat(v.hours)||0; return `<tr><td class="c nw">${us(v.date)}</td><td class="c">${esc(school.schoolNameKo||school.schoolName)}${v.givenBy?" ("+esc(v.givenBy)+")":""}</td><td>${esc(v.name)}</td><td class="c">${v.hours||""}</td><td class="c">${acc}</td></tr>`;});})())}
    <h3>5. 교과학습발달상황</h3>
    ${ays.map(ay=>`<div style="margin:8px 0 4px"><b>[${kGradeLabel(kGradeOf(ay))}]</b> <span class="muted">${ay}학년도 (3월~익년 2월)</span></div>
      ${T(["학기","교과","과목","원점수","성취도","비고"], subjectRows(ay))}
      <table class="sg" style="margin-top:-1px"><tr><th style="width:90px;vertical-align:top">세부능력 및 특기사항</th><td style="line-height:1.7">${commentRows(ay)}</td></tr></table>`).join("")||`<p class="muted">교과 기록 없음</p>`}
    <div style="font-size:8.5pt;color:#444;margin-top:12px;line-height:1.6">· 미리 과목의 원점수는 주차별 학습 평가 최고점의 학기 평균이며, 성취도는 A(60–100) · B(50–59) · C(40–49) · F(39 이하)로 표기합니다(검정고시 합격 기준 60점).<br>· 심화 과목은 학부모 동의를 받아 기본 과정 외에 추가로 수강한 Apex 커리큘럼 과목이며, 수강한 학생에게만 표기합니다. 성적은 Apex 성적을 그대로 옮기고, Apex 학기(Fall 8~12월, Spring 1~6월)는 가까운 한국 학기(1학기 3~8월, 2학기 9~2월)에 배치했습니다.<br>· 학년은 학령(만 나이 기준 3월 입학)으로 표기했습니다.</div>
    <div class="sign" style="margin-top:24px"><div class="left">* 본 기록부는 학교 직인이 없으면 참고용입니다.</div><div><div class="sp"></div><div class="line">${esc(school.schoolNameKo||school.schoolName)} 교장 ${esc(school.principalKo||school.principal)}</div><div style="margin-top:4px;text-align:center">${todayKo}</div></div></div>
  </div>
  ${staff?`<div class="card noprint" style="max-width:860px;margin:16px auto"><h2>세부능력 및 특기사항 입력</h2>
    <form id="cf" class="row"><input name="termCode" value="${esc(school.termCode)}" style="max-width:90px" required><select name="subject" style="max-width:130px"><option>공통</option>${MIRI_ORDER.map(x=>`<option>${x}</option>`).join("")}<option>심화</option><option>체육</option><option>예술</option></select><input name="text" placeholder="~을 이해함, ~을 설명할 수 있음 (과정명·점수는 쓰지 않음 · 미리 단원 문장은 자동으로 앞에 붙음)" style="flex:1;min-width:300px" required><button class="btn sm">추가</button></form>
    <table style="margin-top:10px"><tbody>${comments.sort((a,b)=>termKey(b.termCode)-termKey(a.termCode)).map(c=>`<tr><td class="nw">${termLabel(c.termCode)}</td><td class="nw">${esc(c.subject)}</td><td>${esc(c.text)}</td><td class="muted nw">${esc(c.by||"")}</td><td><button class="btn sm ghost" data-cdel="${c.id}">×</button></td></tr>`).join("")}</tbody></table></div>`:""}`;
  $("#pr").onclick=()=>{ const t=document.title; document.title=`${d.last_en}_${d.first_en}_학습성장기록부_${today.toISOString().slice(0,10)}`; window.print(); document.title=t; };
  const cf=$("#cf"); if (cf){ cf.onsubmit=async e=>{ e.preventDefault(); const v=readForm(cf); await setDoc(doc(col("comments")),{studentId:String(id),termCode:v.termCode,subject:v.subject,text:v.text,by:me.email,at:serverTimestamp()}); toast("저장"); viewMiri(id); };
    document.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=async()=>{ if(!confirm("지울까요?")) return; await deleteDoc(ref("comments",b.dataset.cdel)); viewMiri(id); }); }
}

/* ---------- 과목 담당 교사(멘토) — 과목에 붙여 두고 학기마다 이어받음 ---------- */
// schools/{sid}/mentors/{slug(과목)} = {subject, emails:[...], pending?}
const HOME="담임 종합";
const NO_COMMENT=/^(study hall|senior forum|club meeting|house meeting|miri\s*\/?\s*keyboarding|pe log)/i;   // 학기 코멘트 안 쓰는 시간
const normSubj = t => stripSem(t).toLowerCase().replace(/[^a-z0-9가-힣]+/g,"");
const EOS = n => `${n}@eliteopenschool.org`;
// 2026 Fall Semester Info(Course Contacts · Afternoon Details) 기준 기본값 — 과목명 앞부분이 맞으면 채움(가장 긴 것 우선)
const MENTOR_SEED = [
  ["English 7","eunji.ahn"],["English 8","eunji.ahn"],["AP U.S. History","eunji.ahn"],["U.S. Government","eunji.ahn"],["AP U.S. Government","eunji.ahn"],["United States History","eunji.ahn"],

  ["Spanish I","eunji.ahn"],["Beginner Spanish","eunji.ahn"],["Design Thinking","eunji.ahn"],["SSLDe","eunji.ahn"],
  ["AP English Language","jeein.kang"],["AP English Literature","jeein.kang"],["English 9","jeein.kang"],["English 10","jeein.kang"],["English 11","jeein.kang"],["English 12","jeein.kang"],
  ["English Foundations","jeein.kang"],["Speed Reading","jeein.kang"],["Grammar Essentials","jeein.kang"],
  ["Algebra I","jin.kim onyou.na"],["Algebra I Part","jin.kim"],["Algebra II","jin.kim"],["AP Calculus","jin.kim"],["AP Statistics","jin.kim"],["Geometry","jin.kim onyou.na"],["Geometry Honors","jin.kim"],["Geometry Part","jin.kim"],
  ["Precalculus","jin.kim"],["Economics","jin.kim"],["Applied Innovation","jin.kim"],
  ["Math 7","onyou.na"],["Math 8","onyou.na"],["Pre-Algebra","onyou.na"],["Earth Science","onyou.na"],["Math Essentials","onyou.na"],["Do It Yourself","onyou.na"],["DIY","onyou.na"],
  ["Spanish II","julie.cho"],["Advanced Spanish","julie.cho"],["Physics Honors","julie.cho"],["AP Human Geography","julie.cho"],["Leadership","julie.cho"],["AP Art History","julie.cho"],["AP Physics C","julie.cho"],
  ["Rhetoric","julie.cho"],["R&D","julie.cho"],
  ["AP Biology","",1],["AP Chemistry","",1],["AP Environmental Science","",1],["AP EnvSci","",1],["Biology","",1],["Chemistry","",1],["Physical Science","",1],["Earth Science Part","",1],
].map(([k,e,p])=>({k:normSubj(k), emails:e?e.split(" ").map(EOS):[], pending:p?"Mr. Isaac (11/1 풀타임)":""}));
const seedFor = subj => { const n=normSubj(subj); return MENTOR_SEED.filter(x=>n.startsWith(x.k)).sort((a,b)=>b.k.length-a.k.length)[0]||null; };
let mentorCache=null;
async function loadMentors(){ if(!mentorCache){ mentorCache={}; (await getDocs(col("mentors")).catch(()=>({docs:[]}))).docs.forEach(d=>{ const x=d.data(); mentorCache[normSubj(x.subject)]={id:d.id,...x}; }); } return mentorCache; }
const mentorsOf = (M,subj) => (M[normSubj(subj)]?.emails)||[];
const who = e => String(e||"").split("@")[0];

// 이번 학기 과목 목록(미리·코멘트 없는 시간 제외)과 수강생
function termSubjects(grades){ const by={}; grades.filter(r=>r.source!=="miri").forEach(r=>{ const k=stripSem(r.title); if (!k||NO_COMMENT.test(k)) return; (by[k]=by[k]||new Set()).add(r.studentId); }); return by; }

async function viewMentors(){
  const term=school.termCode; mentorCache=null;
  const [gs, M, ms] = await Promise.all([getDocs(query(col("grades"), where("termCode","==",term))), loadMentors(), getDocs(query(collection(db,"memberships"), where("schoolId","==",sid))).catch(()=>({docs:[]}))]);
  const by=termSubjects(gs.docs.map(d=>d.data())); const subs=Object.keys(by).sort((a,b)=>a.localeCompare(b));
  const staffEm=[...new Set(ms.docs.filter(d=>["teacher","academic","principal","admin"].includes(d.data().role)).map(d=>d.id))].sort();
  const missing=subs.filter(s=>!mentorsOf(M,s).length);
  $("#view").innerHTML=`<div class="card"><h2>과목 담당 교사 <span class="muted" style="font-size:14px">${termLabel(term)} · 과목 ${subs.length}개</span></h2>
    <p class="muted">학기 코멘트를 쓰는 사람입니다. 교내 과목은 담당 교사, Apex·Buzz 과목은 On-Site Mentor. 과목에 붙어 있어서 다음 학기에도 그대로 이어집니다 — 바뀐 것만 고치세요. 두 명이면 쉼표로.</p>
    <div class="row" style="margin-bottom:10px">${missing.length?`<span class="tag warn">담당 없는 과목 ${missing.length}개</span>`:`<span class="tag ok">모든 과목에 담당 있음</span>`}<button class="btn sm ghost" id="seed">빈 칸을 2026 가을 시트 기준으로 채우기</button><button class="btn sm ghost" id="rbs" title="교사는 담임반 학생과 맡은 과목 수강생만 볼 수 있습니다. 학사·행정·교장이 앱을 열 때(1시간 간격)와 Genius 갱신 때 자동으로 다시 계산됩니다.">교사 열람 범위 지금 계산</button><span class="muted" id="scAt"></span><span class="muted">Study Hall · Senior Forum · Miri/Keyboarding · 미리 과목은 학기 코멘트가 없어 빠집니다</span></div>
    <div class="scroll"><table><thead><tr><th>과목</th><th>학생</th><th style="width:46%">담당 (이메일)</th><th></th></tr></thead><tbody>
    ${subs.map(s=>{ const m=M[normSubj(s)]; const em=(m?.emails||[]).join(", "); const sd=!em?seedFor(s):null;
      return `<tr><td>${esc(s)}</td><td>${by[s].size}명</td><td><input list="sl" data-ms="${esc(s)}" value="${esc(em)}" placeholder="${sd&&sd.emails.length?"제안: "+esc(sd.emails.map(who).join(", ")):"이메일"}" style="padding:4px 8px"></td>
        <td class="nw">${em?"":(m?.pending||sd?.pending)?`<span class="tag pend">${esc(m?.pending||sd.pending)}</span>`:`<span class="tag warn">담당 없음</span>`}</td></tr>`; }).join("")||`<tr><td colspan=4 class=muted>이번 학기 성적 줄이 없습니다</td></tr>`}
    </tbody></table></div><datalist id="sl">${staffEm.map(e=>`<option value="${esc(e)}">`).join("")}</datalist></div>`;
  const save=async(subj,emails,pending)=>{ await setDoc(ref("mentors",slug(subj)),{subject:subj,emails,pending:pending||"",updatedBy:me.email,updatedAt:serverTimestamp()},{merge:true}); };
  const G=gs.docs.map(d=>d.data());
  document.querySelectorAll("[data-ms]").forEach(el=>el.onchange=async()=>{ const em=el.value.split(/[,\s]+/).map(x=>x.trim().toLowerCase()).filter(Boolean); await save(el.dataset.ms,em,""); mentorCache=null; await rebuildScopes(term,G); toast("저장 · 교사 열람 범위 갱신"); });
  $("#seed").onclick=async()=>{ let n=0, p=0; for (const s of subs){ if (mentorsOf(M,s).length) continue; const sd=seedFor(s); if (!sd) continue; await save(s,sd.emails,sd.pending); sd.emails.length?n++:p++; }
    mentorCache=null; await rebuildScopes(term,G); toast(`채움 ${n}개${p?` · Isaac 대기 ${p}개`:""} · 교사 열람 범위 갱신`); viewMentors(); };
  $("#rbs").onclick=async()=>{ const n=await rebuildScopes(term,G); toast(`교사 ${n}명 열람 범위 갱신`); viewMentors(); };
  getDoc(ref("scopes","_meta")).then(m=>{ if (m.exists()&&$("#scAt")) $("#scAt").textContent=`열람 범위 마지막 계산 ${new Date(m.data().at).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})} (자동)`; }).catch(()=>{});
}

/* ---------- 세특 · 학기 교사 코멘트 · 월간 담임 의견: 과목(반) 하나 = 한 페이지 ---------- */
// #/comments/{term}/{subject}/{mode: pr|prm|se}/{houseId}/{YYYY-MM}
//  pr  = 학기 1회 과목 코멘트(과목 공통 문단 + 학생별 문단) + 담임 종합(학년 공통 문단 + 개별)
//  prm = 월간 Progress Report 담임 의견 (담임만)
//  se  = 세특 (학습성장기록부)
async function viewComments(){
  const P=location.hash.replace(/^#\/?/,"").split("/");
  const term=P[1]||school.termCode, mode=["pr","prm","se"].includes(P[3])?P[3]:"pr";
  let subj=decodeURIComponent(P[2]||""); const hid=P[4]||""; const month=/^\d{4}-\d{2}$/.test(P[5]||"")?P[5]:todayISO().slice(0,7);
  sectionCache=null; mentorCache=null;
  const [gs, ss, cs, secs, U, M] = await Promise.all([scoped("grades","termCode",term), stuSnap(), scoped("comments","termCode",term,true), loadSections(), loadUnits(), loadMentors()]);
  const names={}; ss.docs.forEach(d=>{ const x=d.data(); names[d.id]={n:`${x.last_en}, ${x.first_en}`, ko:x.name_ko||"", g:x.grade}; });
  const allHouses=secs.filter(x=>x.kind==="house"&&x.termCode===term).sort((a,b)=>a.title.localeCompare(b.title));
  const own=allHouses.find(x=>x.teacherEmail===me.email)||null;
  const T=isTeacherOnly();
  const houses=T?(own?[own]:[]):allHouses;
  const grades=gs.docs.map(d=>d.data()); const bySub=termSubjects(grades);
  const mine=Object.keys(bySub).filter(s=>mentorsOf(M,s).includes(me.email)).sort((a,b)=>a.localeCompare(b));
  // 화면에 보일 과목
  let subjects;
  if (mode==="prm") { subjects=[HOME]; subj=HOME; }
  else if (mode==="pr") subjects = T ? [...(own?[HOME]:[]), ...mine] : [HOME, ...Object.keys(bySub).sort((a,b)=>a.localeCompare(b))];
  else subjects = ["공통", ...MIRI_ORDER.filter(x=>grades.some(r=>r.source==="miri"&&r.subjectKo===x)), ...(T?[]:Object.keys(bySub).sort((a,b)=>a.localeCompare(b)))];
  if (subj && !subjects.includes(subj)) subj="";
  // 반: 담임 종합·월간·세특은 담임반 단위. 교사는 자기 반으로 고정
  const needHouse = subj===HOME || (mode==="se" && T);
  let house = T ? own : (houses.find(x=>x.id===hid)||null);
  if (!house && needHouse && subj===HOME && !T) house=own;
  const kindOf=x=>x.kind==="pr"?"pr":x.kind==="prm"?"prm":"se";
  const docs=cs.docs.map(d=>({id:d.id,...d.data()})).filter(x=>kindOf(x)===mode&&(mode!=="prm"||x.month===month));
  const existing={}; docs.filter(x=>x.studentId!=="__common").forEach(x=>existing[x.studentId+"|"+x.subject]={id:x.id,text:x.text});
  const commonId = subj ? `common_${term}_${slug(subj)}${subj===HOME?"_"+(house?.id||""):""}` : "";
  const common = docs.find(x=>x.id===commonId);
  // 명단
  let roster = subj===HOME||subj==="공통" ? (house?house.studentIds||[]:[...new Set(grades.map(r=>r.studentId))])
    : MIRI_ORDER.includes(subj) ? grades.filter(r=>r.source==="miri"&&r.subjectKo===subj).map(r=>r.studentId)
    : subj ? [...(bySub[subj]||[])] : [];
  if (house && (needHouse || hid)) roster=roster.filter(id=>(house.studentIds||[]).includes(id));
  if (T && mode!=="pr") roster=roster.filter(id=>(own?.studentIds||[]).includes(id));
  const studs=[...new Set(roster)].filter(id=>names[id]).map(id=>({id,...names[id]})).sort((a,b)=>(parseInt(a.g)||0)-(parseInt(b.g)||0)||String(a.n).localeCompare(b.n));
  const prevTerm = term.endsWith("F") ? `${term.slice(0,4)}S` : `${+term.slice(0,4)-1}F`;
  const pcs = subj && mode!=="prm" ? (await scoped("comments","termCode",prevTerm)).docs.map(d=>d.data()).filter(x=>x.subject===subj&&kindOf(x)===mode&&x.studentId!=="__common") : [];
  const prev={}; pcs.forEach(x=>prev[x.studentId]=x.text);
  const miriRow=id=>grades.find(r=>r.studentId===id&&r.source==="miri"&&r.subjectKo===subj);
  const isMiri=MIRI_ORDER.includes(subj);
  const done=id=>!!existing[id+"|"+subj];
  const nDone=studs.filter(s=>done(s.id)).length;
  const hint = mode==="prm" ? "이번 달 담임 의견 (생활·태도·진도)" : mode==="pr" ? (subj===HOME?"학생별 문단 (학년 공통 문단 뒤에 붙음)":"학생별 문단 (과목 공통 문단 뒤에 붙음)") : `세특 (과정명·점수 없이, "~을 이해함 / ~을 설명할 수 있음")`;
  const TITLE={pr:"학기 교사 코멘트",prm:"월간 담임 의견",se:"세부능력 및 특기사항"}[mode];
  // 과목 고르기 전: 내 과목 + 진행 현황
  const countOf=s=>{ const ids=s===HOME?(house||own)?.studentIds||[]:[...(bySub[s]||[])]; const n=ids.filter(id=>docs.some(x=>x.studentId===id&&x.subject===s)).length; return [n,ids.length]; };
  const landing = !subj && mode==="pr" ? `<table><thead><tr><th>과목</th><th>담당</th><th>작성</th><th></th></tr></thead><tbody>${
      (T||!can.manage()?subjects:[...(own?[HOME]:[]), ...mine, ...subjects.filter(s=>s!==HOME&&!mine.includes(s))]).map(s=>{ const [n,t]=countOf(s); const m=s===HOME?[(house||own)?.teacherEmail].filter(Boolean):mentorsOf(M,s);
        return `<tr><td><a href="#/comments/${esc(term)}/${encodeURIComponent(s)}/pr/${s===HOME&&(house||own)?(house||own).id:""}">${esc(s)}</a>${mine.includes(s)||(s===HOME&&own)?' <span class="tag">내 과목</span>':""}</td><td class="muted">${m.length?esc(m.map(who).join(", ")):(M[normSubj(s)]?.pending?`<span class="tag pend">${esc(M[normSubj(s)].pending)}</span>`:`<span class="tag warn">담당 없음</span>`)}</td><td class="nw">${t?`${n} / ${t}명`:"—"}</td><td>${t&&n===t?'<span class="tag ok">완료</span>':""}</td></tr>`; }).join("")||`<tr><td colspan=4 class=muted>맡은 과목이 없습니다. 교무(학사)에서 '과목 담당 교사'에 이메일을 넣어야 보입니다.</td></tr>`}</tbody></table>` : "";
  $("#view").innerHTML=`<div class="card"><h2>${TITLE}${subj?` — ${esc(subj)}`:""} <span class="muted" style="font-size:14px">${termLabel(term)}${mode==="prm"?" · "+month:""}${house&&(needHouse||hid)?" · "+esc(house.title):""}</span></h2>
    <div class="row" style="margin-bottom:12px"><select id="cmode" style="max-width:230px"><option value="pr" ${mode==="pr"?"selected":""}>학기 교사 코멘트 (학기 1회)</option>${own||!T?`<option value="prm" ${mode==="prm"?"selected":""}>월간 담임 의견 (매달)</option><option value="se" ${mode==="se"?"selected":""}>세특 (학습성장기록부)</option>`:""}</select>
      <input id="ct" value="${esc(term)}" style="max-width:90px" title="학기 코드">${mode==="prm"?`<input type="month" id="cm" value="${month}" style="max-width:150px">`:""}
      ${mode==="prm"?"":`<select id="csub" style="max-width:300px"><option value="">${mode==="pr"?"과목 목록":"과목 선택"}</option>${subjects.map(x=>`<option ${x===subj?"selected":""}>${esc(x)}</option>`).join("")}</select>`}
      ${T?"":`<select id="chouse" style="max-width:180px"><option value="">${needHouse?"담임반 선택":"모든 반"}</option>${houses.map(x=>`<option value="${x.id}" ${house&&x.id===house.id?"selected":""}>${esc(x.title)}</option>`).join("")}</select>`}
      <span class="muted">${subj&&studs.length?`<b id="cdone">${nDone}</b> / ${studs.length}명 작성 · 칸에서 나가면 자동 저장 · Tab으로 다음 학생 <label style="margin-left:8px"><input type="checkbox" id="onlyTodo" style="width:auto"> 안 쓴 학생만</label>`:""}</span></div>
    ${landing}
    ${subj&&needHouse&&!house?`<p class="muted">담임반을 고르세요.${T?" (담임반이 지정되지 않았습니다 — 교무에 문의)":""}</p>`:""}
    ${subj&&mode==="pr"&&(subj!==HOME||house)?`<div style="margin-bottom:12px"><label style="font-weight:600">${subj===HOME?"학년 공통 문단":"과목 공통 문단"}</label> <span class="muted">${subj===HOME?"이 반 모든 학생 총평의 첫 문단 (이번 학기 학년 활동)":"이 과목 모든 학생 코멘트의 첫 문단 (이번 학기에 배운 것)"} — 한 번만 쓰면 됩니다</span>
      <textarea id="commonTa" rows="3" style="width:100%;resize:vertical;margin-top:4px;${common?"background:#eef7ee":""}" placeholder="${subj===HOME?"예: This semester, sophomores began with bonding activities before…":"예: This semester, students explored…"}">${esc(common?.text||"")}</textarea></div>`:""}
    ${isMiri&&mode==="se"?`<p class="muted" style="margin-top:-4px">미리 과목은 통과한 주차의 단원 문장이 학습성장기록부 세특 앞에 자동으로 들어갑니다(가운데 회색 칸). 여기에는 그 뒤에 붙일 선생님 관찰만 쓰면 됩니다.</p>`:""}
    ${subj&&studs.length&&(!needHouse||house)?`<table><thead><tr><th style="width:60px">학년</th><th style="width:200px">학생</th>${isMiri?`<th style="width:30%">${mode==="se"?"자동 문장 (미리 단원)":"배운 단원 (자동)"}</th>`:""}<th>${hint}</th>${pcs.length?`<th style="width:22%">지난 학기 (${termLabel(prevTerm)})</th>`:""}</tr></thead><tbody>
      ${studs.map(st=>{ const ex=existing[st.id+"|"+subj]; const mr=isMiri?miriRow(st.id):null; const u=mr?unitsOf(U,mr):[];
        return `<tr data-row="${st.id}"><td>${esc(st.g)}</td><td class="nw">${esc(st.n)} <span class="muted">${esc(st.ko)}</span></td>${isMiri?`<td class="muted" style="font-size:12px;line-height:1.45">${u.length?(mode==="se"?esc(u.map(x=>x.s).join(" ")):u.map(x=>`${x.w}주 ${esc(x.t)}`).join("<br>")):"—"}</td>`:""}<td><textarea data-s="${st.id}" data-cid="${ex?ex.id:""}" rows="${isMiri?3:3}" style="width:100%;resize:vertical;${ex?"background:#eef7ee":""}">${esc(ex?ex.text:"")}</textarea></td>${pcs.length?`<td class="muted" style="font-size:12.5px">${esc(prev[st.id]||"")}</td>`:""}</tr>`; }).join("")}
      </tbody></table>`:subj&&(!needHouse||house)?`<p class="muted">학생이 없습니다.</p>`:""}</div>`;
  const go=()=>{ location.hash=`#/comments/${$("#ct").value.trim()}/${encodeURIComponent($("#csub")?$("#csub").value:HOME)}/${$("#cmode").value}/${$("#chouse")?$("#chouse").value:""}/${$("#cm")?$("#cm").value:month}`; };
  ["csub","ct","cmode","chouse","cm"].forEach(i=>{ if($("#"+i)) $("#"+i).onchange=go; });
  const ot=$("#onlyTodo"); if (ot) ot.onchange=()=>document.querySelectorAll("tr[data-row]").forEach(tr=>{ const ta=tr.querySelector("textarea"); tr.hidden=ot.checked&&!!ta.value.trim(); });
  const cta=$("#commonTa"); if (cta){ let last=cta.value; cta.addEventListener("blur", async()=>{ const v=cta.value.trim(); if (v===last) return; last=v;
    if (v) await setDoc(ref("comments",commonId),{studentId:"__common",termCode:term,subject:subj,kind:"pr",houseId:subj===HOME?(house?.id||""):"",text:v,by:me.email,at:serverTimestamp()});
    else await deleteDoc(ref("comments",commonId)).catch(()=>{});
    cta.style.background=v?"#eef7ee":""; toast("공통 문단 저장"); }); }
  document.querySelectorAll("textarea[data-s]").forEach(ta=>{
    let last=ta.value;
    ta.addEventListener("blur", async()=>{ const v=ta.value.trim(); if (v===last) return; last=v;
      if (ta.dataset.cid){ if (v) await updateDoc(ref("comments",ta.dataset.cid),{text:v,by:me.email,at:serverTimestamp()}); else { await deleteDoc(ref("comments",ta.dataset.cid)); ta.dataset.cid=""; } }
      else if (v){ const r=doc(col("comments")); await setDoc(r,{studentId:ta.dataset.s,termCode:term,subject:subj,text:v,...(mode==="pr"?{kind:"pr"}:mode==="prm"?{kind:"prm",month}:{}),by:me.email,at:serverTimestamp()}); ta.dataset.cid=r.id; }
      ta.style.background=v?"#eef7ee":""; const c=$("#cdone"); if (c) c.textContent=[...document.querySelectorAll("textarea[data-s]")].filter(x=>x.value.trim()).length; toast("저장"); });
  });
}

/* ---------- Transcript ---------- */
async function viewTranscript(id){
  const us = x => x? `${x.slice(5,7)}/${x.slice(8,10)}/${x.slice(0,4)}` : "";
  let [s, rows, as] = await Promise.all([getDoc(ref("students",id)), loadGrades(id), getDocs(query(col("attendance"), where("studentId","==",String(id))))]);
  if (!s.exists()) return $("#view").innerHTML="<p>없는 학생입니다.</p>";
  const d=s.data(); const level=(location.hash.split("/")[3]||"hs");
  const miriRows = rows.filter(r=>r.source==="miri" && ["국어","한국사","도덕"].includes(r.subjectKo)).sort((a,b)=>termKey(a.termCode)-termKey(b.termCode));
  rows = rows.filter(r=>r.source!=="miri");
  rows = level==="ms" ? rows.filter(r=>r.gLevel>=6&&r.gLevel<=8) : rows.filter(r=>!(r.gLevel>=6&&r.gLevel<=8));
  const lvOk=r=>r.gLevel==null?true:(level==="ms"?(r.gLevel>=6&&r.gLevel<=8):!(r.gLevel>=6&&r.gLevel<=8));
  const miriT=miriRows.filter(lvOk);
  const miriHtml = miriT.length ? "1" : "";
  const g=gpaOf(rows), terms=[...new Set([...rows,...miriT].map(r=>r.termCode))].sort((a,b)=>termKey(a)-termKey(b));
  const att={}; as.docs.forEach(x=>{ const r=x.data(); const t=att[r.termCode]=att[r.termCode]||{"e.a":0,"e.t":0,"u.a":0,"u.t":0}; t[finalCode(r)]++; });
  const attTerms=Object.keys(att).sort((a,b)=>termKey(a)-termKey(b));
  const inc = can.staff() ? (await incidentsFor([id])).sort((a,b)=>a.date.localeCompare(b.date)) : [];
  const incR = inc.filter(r=>r.record);
  const staffV = can.staff();

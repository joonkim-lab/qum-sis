    <tbody id="incRows" hidden>${incR.map(r=>`<tr><td class="nw c">${us(r.date)}</td><td class="nw c">Action ${esc(r.action)}</td><td class="nw c">${esc(r.category)}</td><td class="nw c">${esc(r.disposition)}</td><td class="c">${esc(r.trNote||"")}</td></tr>`).join("")||`<tr><td colspan="5" class="c" style="color:#777">No incidents on record</td></tr>`}</tbody>
    <tbody id="incBlank"><tr><td colspan="5">&nbsp;</td></tr></tbody></table></div>`;
  const incHtml = staffV ? incTable : "";
  const attHtml=attTerms.length?`<div id="attBox" hidden class="side"><div><table><thead><tr><th>Attendance</th><th>e.a</th><th>e.t</th><th>u.a</th><th>u.t</th></tr></thead><tbody>${attTerms.map(t=>`<tr><td class="nw">${termLabel(t)}</td><td class="c">${att[t]["e.a"]}</td><td class="c">${att[t]["e.t"]}</td><td class="c">${att[t]["u.a"]}</td><td class="c">${att[t]["u.t"]}</td></tr>`).join("")}</tbody></table></div>${incHtml||"<div></div>"}
    <div class="ft">e.a = excused absence · e.t = excused tardy · u.a = unexcused absence · u.t = unexcused tardy</div><div class="ft" id="incFt">Only incidents designated for the official record are shown.</div></div>`:"";
  const dist=(d.distinctions||"").split(/;|\n/).map(x=>x.trim()).filter(Boolean);
  const today=new Date().toISOString().slice(0,10);
  const schoolBlock=`${esc(school.schoolName)}\n${esc(school.address||"")}\n${school.phone?"Tel: "+esc(school.phone):""}${school.ceeb?" | CEEB: "+esc(school.ceeb):""}`;
  $("#view").innerHTML=`<div class="noprint row" style="max-width:1000px;margin:0 auto 12px">${subNav(id,"tr")}<select id="trLevel" style="max-width:170px;padding:5px 8px"><option value="hs" ${level==="hs"?"selected":""}>High School (9–12)</option><option value="ms" ${level==="ms"?"selected":""}>Middle School (6–8)</option></select><button class="btn sm" id="pr">인쇄 / PDF 저장</button><div style="flex-basis:100%;height:0"></div>${can.manage()?`<label style="font-size:13px"><input type="checkbox" id="offOn" style="width:auto"> <b>Official</b>(서명용)</label>`:""}${attHtml?`<label style="font-size:13px"><input type="checkbox" id="attOn" style="width:auto"> 출결 포함</label>`:""}${incHtml?`<label id="incLbl" hidden style="font-size:13px"><input type="checkbox" id="incOn" style="width:auto"> 징계 포함</label>`:""}${miriHtml?`<label style="font-size:13px"><input type="checkbox" id="miriOn" style="width:auto"> 미리 포함</label>`:""}<span class="muted">브라우저 인쇄 창에서 'PDF로 저장'</span></div>
  <div class="tr miri-off"><img class="wm" id="trWm" src="img/wm-elite.png" alt="" hidden>
    <div class="hd"><div>${school.logoUrl?`<img src="${esc(school.logoUrl)}" alt="">`:""}<h1 id="trTitle">Unofficial ${level==="ms"?"Middle School ":""}Transcript</h1></div><div class="sch">${schoolBlock}</div></div>
    <div class="info"><div><b>Student</b>${esc(d.last_en)}, ${esc(d.first_en)}</div><div><b>Birthdate</b>${us(d.dob)}</div><div><b>Grade</b>${esc(d.grade)}</div><div><b>Status</b>${d.status==="active"?"FULL TIME":esc(d.status||"").toUpperCase()}</div>
      <div><b>Student ID</b>${esc(id)}</div><div><b>Gender</b>${esc(d.gender)}</div><div><b>Graduating Year</b>${esc(d.gradYear)}</div><div><b>Page</b>1 of 1</div>
      <div class="addr"><b>Address</b>${esc(d.address_en)}</div></div>

/* ---------- Genius 갱신 (행정이 2주마다 붙여넣기) ---------- */
const autoOf = b => b==null||isNaN(b) ? null : b<=4 ? "ontrack" : b<=10 ? "behind" : "far";
const normT = t => stripSem(t).toLowerCase().replace(/[®™©]/g,"").replace(/[^a-z0-9가-힣]+/g," ").trim();

async function viewGenius(){

    <div class="card" id="gmap" hidden></div><div class="card" id="gprev" hidden></div>`;
  const [ss, gs, cs] = await Promise.all([getDocs(col("students")), getDocs(query(col("grades"), where("termCode","==",term))), loadCourses()]);

  let termGrades=gs.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.source!=="miri");
  const COLS={stu:["학생 (이름 또는 ID)",/student|name|이름|학생/i], id:["학생 ID (있으면)",/^(student ?)?id$|genius ?id|sis ?id/i], course:["과목",/course|class|title|subject|과목/i], score:["현재 점수",/score|grade|%|avg|percent|점수/i], behind:["밀린 과제 수",/behind|late|past ?due|missing|overdue|밀린/i]};
  $("#gparse").onclick=async()=>{
    const term2=$("#gt").value.trim(); if (term2!==term){ termGrades=(await getDocs(query(col("grades"), where("termCode","==",term2)))).docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.source!=="miri"); }

    rows=parseDelimited(lines.join("\n")); const hdr=Object.keys(rows[0]);

    $("#gmap").hidden=false; $("#gmap").innerHTML=`<h2>열 짝 맞추기 <span class="muted" style="font-size:14px">${rows.length}줄</span></h2><div class="row">${Object.entries(COLS).map(([k,[l]])=>`<label style="font-size:13px">${l}<br><select data-m="${k}" style="max-width:220px"><option value="">(없음)</option>${hdr.map(h=>`<option ${h===guess(k)?"selected":""}>${esc(h)}</option>`).join("")}</select></label>`).join("")}<button class="btn sm" id="gplan" style="align-self:flex-end">짝 확인 → 대조</button></div>`;

          b.set(ref("grades",`${p.stid}_${term2}_${cid}`.replace(/[\/\s]/g,"_")),{studentId:p.stid,courseId:cid,code:c?.code||"",title:p.title,school:school.schoolName,gLevel:parseInt(st?.grade)||null,termCode:term2,grade:"IP",credit:c?.credit??0.5,weighted:!!c?.weighted,source:c?.platform==="cw"?"cw":"apex",...g,needsReview:true,importedAt:serverTimestamp(),importedBy:"genius-refresh"},{merge:true}); nn++; }

async function viewReport(){
  sectionCache=null; const secs=await loadSections();
  const parts=location.hash.replace(/^#\/?/,"").split("/"); const term=parts[2]||school.termCode;
  const houses=secs.filter(s=>s.kind==="house"&&s.termCode===term).filter(s=>!isTeacherOnly()||s.teacherEmail===me.email).sort((a,b)=>a.title.localeCompare(b.title));
  const one=parts[3]||""; const mode=parts[4]==="s"?"s":"m"; const month=/^\d{4}-\d{2}$/.test(parts[5]||"")?parts[5]:todayISO().slice(0,7);
  const mStart=month+"-01", mEnd=month+"-31", monthKo=`${month.slice(0,4)}년 ${+month.slice(5)}월`;
  const ownH=houses.find(x=>x.teacherEmail===me.email)||null;
  let h=isTeacherOnly() ? (ownH&&(!one||(ownH.studentIds||[]).includes(one))?ownH:null)
    : (houses.find(x=>x.id===parts[1])||(one?houses.find(x=>(x.studentIds||[]).includes(one)):null)||(!one?ownH:null)||null);
  if (!h && one && !isTeacherOnly()){ const st=await getDoc(ref("students",one)); if (st.exists()) h={id:"",title:HOUSE_NAME(st.data().grade),teacherEmail:"",studentIds:[one]}; }
  const go=()=>{ location.hash=`#/report/${$("#rH").value}/${$("#rT").value.trim()}/${one}/${$("#rMode").value}/${$("#rM")?$("#rM").value:month}`; };
  const head=`<div class="noprint card" style="max-width:760px;margin:0 auto 12px"><h2>Progress Report — ${mode==="s"?"학기 보고서 (교사 의견 포함)":"월간 보고서 (점수·진도)"}</h2>
    <div class="row"><select id="rH" style="max-width:220px"><option value="">담임반 선택</option>${houses.map(x=>`<option value="${x.id}" ${h&&x.id===h.id?"selected":""}>${esc(x.title)}</option>`).join("")}</select><input id="rT" value="${esc(term)}" style="max-width:90px" title="학기 코드">
      <select id="rMode" style="max-width:170px"><option value="m" ${mode==="m"?"selected":""}>월간 (매달)</option><option value="s" ${mode==="s"?"selected":""}>학기 (의견 포함, 학기 1회)</option></select>
      ${mode==="m"?`<input type="month" id="rM" value="${month}" style="max-width:150px">`:""}
      ${h?`<label style="font-size:13px"><input type="checkbox" id="condOn" style="width:auto"> 생활 기록 포함</label><button class="btn sm" id="pr">인쇄 / PDF 저장</button>${one?`<a class="btn sm ghost" href="#/students/${esc(one)}">학생 화면</a>`:""}${mode==="s"?`<a class="btn sm ghost" href="#/comments/${esc(term)}/${encodeURIComponent(HOME)}/pr/${h.id}">담임 종합 의견 쓰기</a>`:`<a class="btn sm ghost" href="#/comments/${esc(term)}/${encodeURIComponent(HOME)}/prm/${h.id}/${month}">이달 담임 의견 쓰기</a>`}`:""}</div>
    <p class="muted" style="margin:8px 0 0">${mode==="m"?"매달: 과목 점수·진도·출결(이번 달 + 학기 누적) + 담임 의견. 담임 의견은 '코멘트·세특 → 월간 담임 의견'에서 반 전원을 한 페이지에 씁니다.":"학기 1회: 학생당 A4 한 장. 과목 코멘트는 담당 교사(Apex는 On-Site Mentor)가 '코멘트·세특'에서 과목 하나씩 씁니다 — 과목 공통 문단 + 학생별 문단이 합쳐져 들어갑니다."}</p></div>`;
  if (!h){ $("#view").innerHTML=head+(houses.length?"":`<p class="muted" style="text-align:center">이 학기 담임반이 없습니다. '반·진도'에서 먼저 만드세요.</p>`); ["rH","rT","rMode","rM"].forEach(i=>{ if($("#"+i)) $("#"+i).onchange=go; }); return; }
  const ids=one?[one]:(h.studentIds||[]);
  const [U, ss, gs, cs, as, ps, is] = await Promise.all([loadUnits(), stuSnap(), scoped("grades","termCode",term,false,ids), scoped("comments","termCode",term,true,ids), scoped("attendance","termCode",term,false,ids), scoped("progress","termCode",term,false,ids), incidentsFor(ids)]);
  const incAll=is.sort((a,b)=>String(a.date).localeCompare(b.date));
  const gnum=g=>parseInt(g)||99;
  const studs=ss.docs.map(d=>({id:d.id,...d.data()})).filter(s=>ids.includes(s.id)).sort((a,b)=>gnum(a.grade)-gnum(b.grade)||String(a.last_en).localeCompare(b.last_en));
  const grades=gs.docs.map(d=>d.data()); const att=as.docs.map(d=>d.data()); const prog=ps.docs.map(d=>d.data());
  const cm={}, common={}, cmm={};
  cs.docs.forEach(d=>{ const x=d.data();
    if (x.kind==="pr"){ if (x.studentId==="__common") common[x.subject+"|"+(x.houseId||"")]=x.text; else cm[x.studentId+"|"+x.subject]=x.text; }
    if (x.kind==="prm"&&x.month===month) cmm[x.studentId]=x.text; });
  // 학기 코멘트 = 공통 문단(과목 / 학년) + 학생별 문단. 학생 문단이 없으면 비워 둠
  const cmt=(stid,subj)=>{ const t=cm[stid+"|"+subj]; if (!t) return ""; const c=subj===HOME?common[HOME+"|"+(h.id||"")]:common[subj+"|"]; return c?c+"\n\n"+t:t; };
  const us = x => x? `${x.slice(0,4)}.${x.slice(5,7)}.${x.slice(8,10)}.` : "";
  const teacherName=TEACHER_OF(h);
  const page=st=>{
    const mine=grades.filter(r=>r.studentId===st.id);
    const miri=MIRI_ORDER.map(sub=>mine.find(r=>r.source==="miri"&&r.subjectKo===sub)).filter(Boolean);
    const us_=mine.filter(r=>r.source!=="miri").sort((a,b)=>areaRank(a.code)-areaRank(b.code)||String(a.title).localeCompare(b.title));
    const stOf=r=>{ const k=(r.courseId||courseId(r)||slug(r.title)).replace(/[\/\s.]/g,"_"); const p=prog.filter(x=>x.studentId===st.id&&x.courseId===k&&x.status).sort((a,b)=>String(b.date).localeCompare(a.date))[0];
      if (p&&(!r.auto||(p.date||"")>=(r.geniusAsOf||""))) return {c:PROG[p.status]?.c||"", t:PROG[p.status]?.l||p.status};
      if (r.behind!=null&&!isNaN(r.behind)){ const b=Math.max(0,Math.round(r.behind)); const a=autoOf(b); return {c:PROG[a].c, t:b===0?"On Track":`${b} overdue${b>1?"s":""}`}; }
      return r.auto?{c:PROG[r.auto]?.c||"", t:PROG[r.auto]?.l||r.auto}:{c:"",t:""}; };
    const t={"e.a":0,"e.t":0,"u.a":0,"u.t":0}, tm={"e.a":0,"e.t":0,"u.a":0,"u.t":0}; att.filter(a=>a.studentId===st.id).forEach(a=>{ t[finalCode(a)]++; if (a.date>=mStart&&a.date<=mEnd) tm[finalCode(a)]++; });
    const miriRows=miri.map(r=>{ const u=unitsOf(U,r); return `<tr><td class="c" style="white-space:nowrap">${esc(r.subjectKo)}<br><span class="muted" style="font-size:7.5pt">${esc(r.level||"")}</span></td><td class="c">${r.score??""}</td><td class="c">${r.score!=null?miriGrade(r.score):""}</td>
      <td><div class="units">${u.length?u.map(x=>`${x.w}주 ${esc(x.t)}`).join("<br>"):"<span class='muted'>통과한 주차 없음</span>"}</div>${cm[st.id+"|"+r.subjectKo]?`<div class="tcm">${esc(cm[st.id+"|"+r.subjectKo])}</div>`:""}</td></tr>`; }).join("");
    const usRows=us_.map(r=>{ const k=stripSem(r.title); return `<tr><td>${esc(k)}${r.weighted?' <span class="muted">(Honors/AP)</span>':""}</td><td class="c">${r.score??""}</td>${(()=>{ const x=stOf(r); return `<td class="c nw${x.c?" pgc "+x.c:""}">${esc(x.t)}</td>`; })()}${mode==="s"?`<td style="white-space:pre-line">${esc(cmt(st.id,k))}</td>`:""}</tr>`; }).join("");
    return `<div class="bw prp"><div class="bwh"><div><h2>${mode==="s"?"학업 성취 보고서":"월간 학업 보고서"} <span style="font-size:10pt;font-weight:400">${mode==="s"?"Progress Report":"Monthly Progress Report"}</span></h2><div>[${termKo(term)}]${mode==="m"?` &nbsp; ${monthKo}`:""}</div></div><div class="sch">${esc(school.schoolNameKo||school.schoolName)}</div></div>
      <table class="sg"><tr><th>이름</th><td>${st.name_ko?`${esc(st.name_ko)} (${esc(st.last_en)}, ${esc(st.first_en)})`:`${esc(st.last_en)}, ${esc(st.first_en)}`}</td><th>학년</th><td class="c nw">${esc(KO_GRADE_LABEL(st.dob,term))}</td><th>Gr.</th><td class="c nw">${esc(US_GRADE_LABEL(st.grade,term))}</td><th>담임</th><td class="nw">${esc(teacherName)}</td></tr></table>
      ${miriRows?`<div class="prh">기본 (miri 커리큘럼)</div><table class="sg"><thead><tr><th>과목</th><th>점수</th><th>성취도</th><th style="width:auto">${mode==="s"?"배운 내용 · 선생님 의견":"배운 내용"}</th></tr></thead><tbody>${miriRows}</tbody></table>`:""}
      ${usRows?`<div class="prh">심화 (apex 커리큘럼)</div><table class="sg"><thead><tr><th style="width:auto">과목</th><th>현재 점수</th><th style="width:120px">진도</th>${mode==="s"?`<th style="width:45%">선생님 의견</th>`:""}</tr></thead><tbody>${usRows}</tbody></table><div class="pkey"><b>Progress Key</b> <span class="sw pgc ok"></span> On Track: 밀린 과제 0–4개 <span class="sw pgc pend"></span> Behind: 5–10개 <span class="sw pgc warn"></span> Severely Behind: 11개 이상</div>`:""}
      <table class="sg"><thead><tr><th style="width:auto">출결 (학기 누적)</th><th>인정 결석</th><th>인정 지각</th><th>무단 결석</th><th>무단 지각</th></tr></thead><tbody>${mode==="m"?`<tr><td>${monthKo}</td><td class="c">${tm["e.a"]}</td><td class="c">${tm["e.t"]}</td><td class="c">${tm["u.a"]}</td><td class="c">${tm["u.t"]}</td></tr>`:""}<tr><td>학기 누적 (${termLabel(term)})</td><td class="c">${t["e.a"]}</td><td class="c">${t["e.t"]}</td><td class="c">${t["u.a"]}</td><td class="c">${t["u.t"]}</td></tr></tbody></table>
      ${(()=>{ const ir=incAll.filter(x=>x.studentId===st.id); return `<div class="cond"><div class="prh">생활 기록 (입학 후 누적)</div><table class="sg"><thead><tr><th style="width:80px">날짜</th><th style="width:70px">단계</th><th style="width:auto">내용</th><th style="width:90px">공식 성적표</th></tr></thead><tbody>${ir.map(x=>`<tr><td class="c nw">${us(x.date)}</td><td class="c nw">Action ${esc(x.action)}</td><td>${esc(x.category)}${x.behavior?" · "+esc(x.behavior):""}</td><td class="c nw">${x.record?"<b>기재</b>":"기재 안 함"}</td></tr>`).join("")||`<tr><td colspan="4" class="c muted">기록 없음</td></tr>`}</tbody></table>
      <div style="font-size:7.5pt;color:#444;margin:3px 0 6px">위 기록은 모두 학교 내부 기록으로 보관됩니다. 학교는 학생의 성장을 기대하며 Action 1–3을 공식 성적표에 기재하지 않습니다. 같은 행동이 반복되면 규정에 따라 상위 단계로 다뤄질 수 있습니다.</div></div>`; })()}
      ${mode==="s"?`<table class="sg"><tr><th style="vertical-align:top;padding-top:6px">담임 종합 의견</th><td style="line-height:1.55;height:60px;vertical-align:top;white-space:pre-line">${esc(cmt(st.id,HOME))}</td></tr></table>`:`<table class="sg"><tr><th style="vertical-align:top;padding-top:6px">담임 의견</th><td style="line-height:1.55;height:48px;vertical-align:top;white-space:pre-line">${esc(cmm[st.id]||"")}</td></tr></table>`}
      <div style="font-size:7.5pt;color:#444;margin:3px 0 6px">미리 점수는 주차별 평가 최고점의 평균이며 성취도는 A(60–100)·B(50–59)·C(40–49)·F(39 이하)입니다. 진도(밀린 과제 수) — 보고서 작성 시점 기준이며 학생 LMS 화면의 현재 숫자와 다를 수 있습니다.<br>※ 심화 과목의 점수와 밀린 과제 수는 채점이 끝나지 않은 상태라 정확하지 않을 수 있습니다. 학생이 과제를 제출했더라도 선생님이 아직 채점하지 않았으면 밀린 과제(overdue)로 남아 있습니다.</div>
      <table class="sg sign3"><thead><tr><th style="width:auto">확인</th><th style="width:45%">서명</th><th style="width:25%">날짜</th></tr></thead><tbody><tr><td>학부모</td><td></td><td></td></tr><tr><td>담임 교사</td><td></td><td></td></tr></tbody></table></div>`; };
  $("#view").innerHTML=head+`<div id="prList" class="cond-off">${studs.map(page).join("")||`<p class="muted" style="text-align:center">이 반에 학생이 없습니다.</p>`}</div>`;
  ["rH","rT","rMode","rM"].forEach(i=>{ if($("#"+i)) $("#"+i).onchange=go; });
  $("#condOn").onchange=e=>$("#prList").classList.toggle("cond-off",!e.target.checked);
  $("#pr").onclick=()=>{ const t=document.title; document.title=one?`ProgressReport_${studs[0]?.last_en||""}${studs[0]?.first_en||""}_${mode==="m"?month:term}`.replace(/\s+/g,""):`ProgressReport_${h.title}_${mode==="m"?month:term}`; window.print(); document.title=t; };
}

/* ---------- 선택과목 성적 일괄 입력 (과거 자체 선택과목: DIY·R&D 등) ---------- */
async function viewElectives(){
  const parts=location.hash.replace(/^#\/?/,"").split("/"); const term=parts[1]||""; const cid=decodeURIComponent(parts[2]||""); const showAll=parts[3]==="all";
  courseCache=null; const [cs, ss] = await Promise.all([loadCourses(), getDocs(col("students"))]);
  const electives=cs.filter(c=>!c.code||String(c.code).startsWith("9")||c.platform==="inhouse").sort((a,b)=>String(a.title).localeCompare(b.title));
  const c=cs.find(x=>x.id===cid);
  const curAY=ayOf(school.termCode), ay=ayOf(term);
  const gl=s=>{ const g=parseInt(s.grade); return g&&ay!=null? g-(curAY-ay) : null; };
  const go=(all)=>{ location.hash=`#/electives/${$("#et").value.trim()}/${encodeURIComponent($("#ec").value)}${all?"/all":""}`; };
  const termOK=/^\d{4}[FSU]$/.test(term);
  $("#view").innerHTML=`<div class="card"><h2>선택과목 성적 입력</h2>
    <p class="muted">과목과 학기를 고르면 그 학기 재학생 명단이 나옵니다. 성적을 고르고 '저장'. 과목이 목록에 없으면 '과목' 화면에서 코드 없이 추가하세요(코드 없는 자체 선택과목은 제목으로 구분). 여러 과목을 한꺼번에 넣을 때는 '가져오기 → 성적'에 CSV(studentId, termCode, title, grade, credit, source=elective)도 됩니다.</p>
    <div class="row"><input id="et" value="${esc(term)}" placeholder="학기 (2023S)" style="max-width:110px"><select id="ec" style="max-width:380px"><option value="">과목 선택</option>${electives.map(x=>`<option value="${esc(x.id)}" ${x.id===cid?"selected":""}>${esc(x.title)}${x.code?` (${esc(x.code)})`:""} · ${x.credit}학점</option>`).join("")}</select>
      ${termOK&&c?`<label style="font-size:13px"><input type="checkbox" id="eall" style="width:auto" ${showAll?"checked":""}> 학년과 상관없이 전체 학생</label>`:""}</div>
    <div id="eb" style="margin-top:12px">${!termOK?`<p class="muted">학기 코드를 넣으세요 (예: 2024F = Fall 2024-25, 2025S = Spring 2024-25).</p>`:!c?`<p class="muted">과목을 고르세요.</p>`:""}</div></div>`;
  $("#et").onchange=()=>go(); $("#ec").onchange=()=>go(); if ($("#eall")) $("#eall").onchange=e=>go(e.target.checked);
  if (!termOK||!c) return;
  const ex=(await getDocs(query(col("grades"), where("termCode","==",term)))).docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.courseId===c.id);
  const exBy={}; ex.forEach(r=>exBy[r.studentId]=r);
  const studs=ss.docs.map(d=>({id:d.id,...d.data()})).map(s=>({...s,gl:gl(s)})).filter(s=>exBy[s.id]||showAll||(s.gl!=null&&s.gl>=6&&s.gl<=12&&(s.status==="active"||!s.status||s.status==="graduated")))
    .sort((a,b)=>(a.gl??99)-(b.gl??99)||String(a.last_en).localeCompare(b.last_en));
  const G=["","A","B","C","D","F","P","IP"];
  $("#eb").innerHTML=`<div class="row" style="margin-bottom:8px"><b>${esc(c.title)}</b><span class="muted">${termLabel(term)} · ${c.credit}학점${c.weighted?" · "+esc(c.weighted):""} · 입력된 ${ex.length}명</span><button class="btn sm" id="esave">저장</button><span class="muted">빈칸으로 바꾸면 그 학생 성적 줄은 지워집니다.</span></div>
    <table><thead><tr><th>그때 학년</th><th>학생</th><th>성적</th></tr></thead><tbody>${studs.map(s=>`<tr><td>${s.gl??""}</td><td class="nw">${esc(s.last_en)}, ${esc(s.first_en)} <span class="muted">${esc(s.name_ko||"")} · ${esc(s.id)}</span></td>
      <td><select data-eg="${s.id}" style="max-width:90px;padding:3px 6px;${exBy[s.id]?"background:#eef7ee":""}">${G.map(g=>`<option ${(exBy[s.id]?.grade||"")===g?"selected":""}>${g}</option>`).join("")}</select></td></tr>`).join("")||`<tr><td colspan=3 class=muted>해당 학년 학생이 없습니다 — '전체 학생'을 켜 보세요.</td></tr>`}</tbody></table>`;
  $("#esave").onclick=async()=>{ let b=writeBatch(db), n=0, del=0;
    document.querySelectorAll("[data-eg]").forEach(sel=>{ const sidv=sel.dataset.eg, g=sel.value, old=exBy[sidv]; const s=studs.find(x=>x.id===sidv);
      if (!g){ if (old){ b.delete(ref("grades",old.id)); del++; } return; }
      if (old && old.grade===g) return;
      const gid=old?old.id:`${sidv}_${term}_${c.id}`.replace(/[\/\s]/g,"_");
      b.set(ref("grades",gid),{studentId:sidv,courseId:c.id,code:c.code||"",title:c.title,school:school.schoolName,gLevel:s?.gl||null,termCode:term,grade:g,credit:parseFloat(c.credit)||0,weighted:!!c.weighted,source:"elective",needsReview:false,enteredBy:me.email,enteredAt:serverTimestamp()},{merge:true}); n++; });
    await b.commit(); toast(`${n}명 저장${del?`, ${del}명 삭제`:""}`); viewElectives(); };
}

async function viewMe(){
  if (!me.studentId) { $("#view").innerHTML="<p>학생 ID가 연결되지 않았습니다. 학교에 문의하세요.</p>"; return; }
  return viewStudent(me.studentId);
}
</script>

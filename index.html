<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qum Academic System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#6b1f2a;        /* 踰꾧굔??*/
  --brand-ink:#3f1118;
  --accent:#b8923a;       /* 怨⑤뱶 */
  --paper:#f6f1e7;        /* 紐⑤옒 ?щ┝ */
  --paper-2:#ede5d6;
  --ink:#2a2420;
  --muted:#7a6f66;
  --line:#d9cfbf;
  --ok:#2f6b3a; --warn:#b3261e; --pending:#8a6d1f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:"Noto Serif KR",serif;margin:0}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:500}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
/* layout */
#top{background:var(--brand);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;height:58px;position:sticky;top:0;z-index:5}
#top .logo{display:flex;align-items:center;gap:10px}
#top .logo img{height:34px;width:34px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
#top .logo h1{font-size:18px;letter-spacing:.3px}
#top nav{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
#top nav a{color:#f3e6e8;text-decoration:none;padding:6px 10px;border-radius:5px;font-size:14px}
#top nav a.on,#top nav a:hover{background:rgba(255,255,255,.14);color:#fff}
#top .me{margin-left:auto;font-size:13px;opacity:.9;display:flex;gap:10px;align-items:center}
#top .me button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:5px;padding:4px 10px;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px}
.card h2{font-size:19px;color:var(--brand);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--paper-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px}
.grid label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 18px;min-width:140px}
.stat b{display:block;font-size:26px;font-family:"Noto Serif KR",serif;color:var(--brand)}
.stat span{font-size:12.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;background:var(--paper-2);padding:8px 8px;font-weight:600;font-size:12.5px;color:var(--brand-ink);position:sticky;top:58px}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fbf8f2}
td[contenteditable]{outline:none;background:#fffdf7;border-bottom:1px dashed var(--accent)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:12px;background:var(--paper-2);color:var(--brand-ink)}
.tag.ok{background:#e3efe4;color:var(--ok)}.tag.warn{background:#f9e2df;color:var(--warn)}.tag.pend{background:#f3ead2;color:var(--pending)}
.muted{color:var(--muted);font-size:13px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brand-ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
[hidden]{display:none!important}#login{min-height:100vh;display:grid;place-items:center}
#login .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:40px 44px;text-align:center;width:min(420px,92vw)}
#login img{height:72px;margin-bottom:12px}
#login h1{color:var(--brand);font-size:26px;margin-bottom:6px}
#login p{color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:5px 14px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
@media(max-width:720px){#top nav{display:none}}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="box">
    <img id="loginLogo" src="" alt="" hidden>
    <h1 id="loginTitle">Qum Academic System</h1>
    <p id="loginSub">?숆탳 援ш? 怨꾩젙?쇰줈 濡쒓렇?명븯?몄슂</p>
    <button class="btn" id="btnLogin">Google 濡쒓렇??/button>
    <div class="foot">Educclesia Group</div>
  </div>
</div>
<div id="app" hidden>
  <header id="top">
    <div class="logo"><img id="topLogo" src="" alt="" hidden><h1 id="topTitle">Qum Academic System</h1></div>
    <nav id="nav"></nav>
    <div class="me"><span id="meName"></span><span class="tag" id="meRole"></span><button id="btnOut">?섍?湲?/button></div>
  </header>
  <main id="view"></main>
  <div class="foot">Educclesia Group</div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, where, orderBy, limit, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBh_YwVF6xaQv0P5csZwhD9tzz3i7jv2_A",
  authDomain: "qum-sis.firebaseapp.com",
  projectId: "qum-sis",
  storageBucket: "qum-sis.firebasestorage.app",
  messagingSenderId: "324861037215",
  appId: "1:324861037215:web:32f3e749d2fcac93d430aa"
};
const OWNER = "joon.kim@educclesia.com";   // ?뚮옯???뚯쑀???먮??대젅?쒖븘)
const DEFAULT_SCHOOL = "qum";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT; const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); };

/* ---------- ?몄뀡 ---------- */
let me = null;          // {email, name, role, schoolId, studentId}
let school = null;      // settings doc
let sid = DEFAULT_SCHOOL;
const col = name => collection(db, "schools", sid, name);
const ref = (name, id) => doc(db, "schools", sid, name, String(id));

const ROLES = { owner:"?뚯쑀??, admin:"?됱젙", principal:"援먯옣", teacher:"援먯궗", student:"?숈깮" };
const can = {
  manage: () => ["owner","admin","principal"].includes(me.role),
  settings: () => ["owner","principal"].includes(me.role),
};

async function resolveMember(user){
  const email = user.email.toLowerCase();
  if (email === OWNER) {
    // ?뚯쑀??泥?濡쒓렇?? ?숆탳쨌硫ㅻ쾭???놁쑝硫?留뚮뱺??    const m = await getDoc(doc(db,"memberships",email));
    if (!m.exists()) await setDoc(doc(db,"memberships",email), {schoolId:DEFAULT_SCHOOL, role:"owner", createdAt:serverTimestamp()});
    sid = m.exists() ? m.data().schoolId : DEFAULT_SCHOOL;
    const s = await getDoc(doc(db,"schools",sid));
    if (!s.exists()) await setDoc(doc(db,"schools",sid), {
      name:"Qum Academic System", nameKo:"荑??꾩뭅?곕? ?쒖뒪??, schoolName:"Qum Educlesia", schoolNameKo:"?댁삤?먯뒪 誘몃옒 由щ뜑??,
      logoUrl:"", color:"#6b1f2a", accent:"#b8923a", address:"", phone:"", ceeb:"", principal:"Joon Kim",
      termCode:"2026F", nextId:9001, createdAt:serverTimestamp()
    });
    return {email, name:user.displayName, role:"owner"};
  }
  const m = await getDoc(doc(db,"memberships",email));
  if (!m.exists()) return null;
  sid = m.data().schoolId;
  return {email, name:user.displayName, role:m.data().role, studentId:m.data().studentId||null};
}

async function loadSchool(){
  school = (await getDoc(doc(db,"schools",sid))).data();
  document.documentElement.style.setProperty("--brand", school.color || "#6b1f2a");
  document.documentElement.style.setProperty("--accent", school.accent || "#b8923a");
  $("#topTitle").textContent = school.name; $("#loginTitle").textContent = school.name;
  document.title = school.name;
  for (const id of ["topLogo","loginLogo"]) { const el=$("#"+id); el.hidden=!school.logoUrl; el.src=school.logoUrl||""; }
}

/* ---------- 濡쒓렇??---------- */
$("#btnLogin").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e=>toast("濡쒓렇???ㅽ뙣: "+e.code));
$("#btnOut").onclick = () => signOut(auth);
onAuthStateChanged(auth, async user => {
  if (!user) { $("#login").hidden=false; $("#app").hidden=true; return; }
  const m = await resolveMember(user);
  if (!m) { toast("??怨꾩젙? ?꾩쭅 ?깅줉?섏? ?딆븯?듬땲?? ?숆탳??臾몄쓽?섏꽭??"); await signOut(auth); return; }
  me = m; await loadSchool();
  $("#meName").textContent = me.name || me.email; $("#meRole").textContent = ROLES[me.role] || me.role;
  $("#login").hidden=true; $("#app").hidden=false;
  buildNav(); route();
});

/* ---------- ?쇱슦??---------- */
const routes = {
  "":        {label:"?꾪솴",       show:()=>true,          view:viewHome},
  "students":{label:"?숈깮",       show:()=>can.manage() || me.role==="teacher", view:viewStudents},
  "new":     {label:"?좎엯???깅줉", show:()=>can.manage(),  view:viewNew},
  "import":  {label:"媛?몄삤湲?,   show:()=>can.manage(),  view:viewImport},
  "settings":{label:"?숆탳 ?ㅼ젙",  show:()=>can.settings(),view:viewSettings},
  "me":      {label:"???뺣낫",    show:()=>me.role==="student", view:viewMe},
};
function buildNav(){
  $("#nav").innerHTML = Object.entries(routes).filter(([k,r])=>r.show()).map(([k,r])=>`<a href="#/${k}" data-k="${k}">${r.label}</a>`).join("");
}
window.addEventListener("hashchange", route);
async function route(){
  if (!me) return;
  const [k, arg] = location.hash.replace(/^#\/?/,"").split("/");
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.k===(k||"")));
  const v = $("#view"); v.innerHTML = `<p class="muted">遺덈윭?ㅻ뒗 以묅?/p>`;
  if (k==="students" && arg) return viewStudent(arg);
  const r = routes[k||""]; if (!r || !r.show()) { v.innerHTML="<p>沅뚰븳???놁뒿?덈떎.</p>"; return; }
  await r.view();
}

/* ---------- ?꾪솴 ---------- */
async function viewHome(){
  const snap = await getDocs(col("students"));
  const all = snap.docs.map(d=>({id:d.id,...d.data()}));
  const byGrade = {}; let review=0, pending=0;
  for (const s of all){ byGrade[s.grade]=(byGrade[s.grade]||0)+1; if (s.needsReview) review++; if (s.status==="pending") pending++; }
  const grades = Object.keys(byGrade).sort((a,b)=>(parseInt(a)||99)-(parseInt(b)||99));
  $("#view").innerHTML = `
  <div class="card"><h2>${esc(school.schoolName)} 쨌 ${esc(school.termCode)}</h2>
    <div class="stat">
      <div><b>${all.length}</b><span>?숈깮 ?꾩껜</span></div>
      ${grades.map(g=>`<div><b>${byGrade[g]}</b><span>${g}?숇뀈</span></div>`).join("")}
      <div><b style="color:var(--pending)">${review}</b><span>?뺤씤 ?꾩슂</span></div>
      <div><b style="color:var(--warn)">${pending}</b><span>?뺣낫 誘몄엯??/span></div>
    </div></div>
  <div class="card"><h2>?ㅼ쓬 ?④퀎</h2>
    <p class="muted">1?④퀎: ?숈깮 紐낅? ??怨쇰ぉ쨌?깆쟻 ??Transcript 諛쒗뻾. 2?④퀎: 異쒓껐. 3?④퀎: ?숈깮 ?먭린 ?낅젰(?섏긽쨌?쒕룞). 4?④퀎: ?숈뒿?깆옣湲곕줉遺. 5?④퀎: ?숆탳 ?ㅼ젙쨌濡쒓퀬.</p></div>`;
}

/* ---------- ?숈깮 紐⑸줉 ---------- */
async function viewStudents(){
  const snap = await getDocs(col("students"));
  const gnum = g => parseInt(g) || 99;
  const all = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>gnum(a.grade)-gnum(b.grade) || String(a.last_en).localeCompare(b.last_en));
  const v=$("#view");
  v.innerHTML = `<div class="card"><h2>?숈깮 ${all.length}紐?/h2>
    <div class="row" style="margin-bottom:12px"><input id="q" placeholder="?대쫫쨌ID쨌?대찓??寃?? style="max-width:280px">
    <select id="g" style="max-width:140px"><option value="">???숇뀈</option>${[...new Set(all.map(s=>s.grade))].map(g=>`<option>${g}</option>`).join("")}</select>
    <label style="font-size:13px"><input type="checkbox" id="onlyReview" style="width:auto"> ?뺤씤 ?꾩슂留?/label></div>
    <div class="scroll"><table><thead><tr><th>ID</th><th>?대쫫</th><th>?숇뀈</th><th>?앸뀈?붿씪</th><th>?대찓??/th><th>怨쇱젙</th><th>?곹깭</th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
  const draw=()=>{
    const q=$("#q").value.toLowerCase(), g=$("#g").value, r=$("#onlyReview").checked;
    $("#tb").innerHTML = all.filter(s=>(!g||String(s.grade)===g)&&(!r||s.needsReview)&&(!q||[s.id,s.last_en,s.first_en,s.name_ko,s.email].join(" ").toLowerCase().includes(q)))
      .map(s=>`<tr><td><a href="#/students/${s.id}">${esc(s.id)}</a></td><td>${esc(s.last_en)}, ${esc(s.first_en)} ${s.name_ko?`<span class="muted">${esc(s.name_ko)}</span>`:""}</td><td>${esc(s.grade)}</td><td>${esc(s.dob)}</td><td class="muted">${esc(s.email)}</td><td>${esc(s.curriculum)}</td><td>${statusTag(s)}</td></tr>`).join("");
  };
  ["q","g","onlyReview"].forEach(i=>$("#"+i).oninput=draw); draw();
}
const statusTag = s => s.status==="pending"?`<span class="tag warn">誘몄엯??/span>`: s.needsReview?`<span class="tag pend">?뺤씤 ?꾩슂</span>`:`<span class="tag ok">${s.status==="active"?"?ы븰":esc(s.status)}</span>`;

/* ---------- ?숈깮 ?꾨뱶 ?뺤쓽(??怨녹뿉??愿由? ---------- */
const FIELDS = [
  ["湲곕낯",[["last_en","?곷Ц ??],["first_en","?곷Ц ?대쫫"],["name_ko","?쒓? ?대쫫"],["dob","?앸뀈?붿씪","date"],["gender","?깅퀎","select",["","F","M"]],["grade","?숇뀈"],["gradYear","議몄뾽?곕룄"],["track","?몃옓","select",["","CAI","CEI","UI"]]]],
  ["?숈쟻",[["status","?곹깭","select",["active","pending","graduated","transferred","leave"]],["enrollDate","?낇븰??,"date"],["endDate","醫낅즺??,"date"],["prevSchool","?꾩엯?숆탳"],["curriculum","怨쇱젙(Apex/Buzz/CW)"],["distinctions","Distinctions"]]],
  ["?곕씫",[["email","?숆탳 ?대찓??],["phone","?숈깮 ?대???],["address_en","二쇱냼(?곷Ц)"],["address_ko","二쇱냼(?쒓?)"],["postal","?고렪踰덊샇"]]],
  ["蹂댄샇??,[["g1_name","蹂댄샇?? ?대쫫"],["g1_rel","愿怨?],["g1_phone","?대???],["g1_email","?대찓??],["g2_name","蹂댄샇?? ?대쫫"],["g2_rel","愿怨?],["g2_phone","?대???],["smsConsent","?뚮┝ ?섏떊 ?숈쓽","select",["","Y","N"]]]],
  ["留곹겕",[["infoSheetUrl","Student Information Sheet"],["resumeUrl","Resume"],["driveUrl","?쒕씪?대툕 ?대뜑"]]],
  ["硫붾え",[["note","硫붾え"]]],
];
const ACCOUNT_FIELDS = [["genius_login","Genius 濡쒓렇??],["apex_id","Apex/Buzz ID"],["cw_id","Courseware ID"],["iready_id","iReady ID"]];
function fieldHtml(f, val){
  const [k,label,type,opts]=f;
  if (type==="select") return `<div><label>${label}</label><select name="${k}">${opts.map(o=>`<option ${o===(val??"")?"selected":""}>${o}</option>`).join("")}</select></div>`;
  return `<div><label>${label}</label><input name="${k}" type="${type||"text"}" value="${esc(val)}"></div>`;
}
const readForm = form => Object.fromEntries([...form.querySelectorAll("[name]")].map(e=>[e.name,e.value.trim()]));

/* ---------- ?숈깮 ?곸꽭 ---------- */
async function viewStudent(id){
  const [s, a] = await Promise.all([getDoc(ref("students",id)), getDoc(ref("accounts",id))]);
  if (!s.exists()) { $("#view").innerHTML="<p>?녿뒗 ?숈깮?낅땲??</p>"; return; }
  const d = s.data(), acct = a.exists()? a.data():{};
  $("#view").innerHTML = `<div class="card"><h2>${esc(d.last_en)}, ${esc(d.first_en)} <span class="muted" style="font-size:14px">ID ${esc(id)}</span> ${statusTag({...d})}</h2>
    <form id="f">${FIELDS.map(([g,fs])=>`<h3 style="font-size:14px;color:var(--muted);margin:16px 0 8px">${g}</h3><div class="grid">${fs.map(f=>fieldHtml(f,d[f[0]])).join("")}</div>`).join("")}
    ${can.manage()?`<h3 style="font-size:14px;color:var(--muted);margin:16px 0 8px">怨꾩젙 (?됱젙 ?꾩슜)</h3><div class="grid">${ACCOUNT_FIELDS.map(f=>`<div><label>${f[1]}</label><input data-acct name="${f[0]}" value="${esc(acct[f[0]])}"></div>`).join("")}</div>`:""}
    <div class="row" style="margin-top:18px"><button class="btn" type="submit">???/button>
    ${d.needsReview?`<button class="btn ghost" type="button" id="confirm">?뺤씤 ?꾨즺</button>`:""}
    <a class="muted" href="#/students">紐⑸줉?쇰줈</a></div></form></div>`;
  $("#f").onsubmit = async e => {
    e.preventDefault();
    const all = readForm($("#f")); const acc={}; const stu={};
    for (const [k,v] of Object.entries(all)) (ACCOUNT_FIELDS.some(f=>f[0]===k) ? acc : stu)[k]=v;
    await updateDoc(ref("students",id), {...stu, updatedAt:serverTimestamp(), updatedBy:me.email});
    if (can.manage()) await setDoc(ref("accounts",id), acc, {merge:true});
    toast("??ν뻽?듬땲??);
  };
  const c=$("#confirm"); if (c) c.onclick = async ()=>{ await updateDoc(ref("students",id),{needsReview:false, reviewedBy:me.email, reviewedAt:serverTimestamp()}); toast("?뺤씤 ?꾨즺"); viewStudent(id); };
}

/* ---------- ?좎엯???깅줉 ---------- */
async function viewNew(){
  const sref = doc(db,"schools",sid); const next = (await getDoc(sref)).data().nextId || 9001;
  $("#view").innerHTML = `<div class="card"><h2>?좎엯???깅줉</h2>
    <form id="f"><div class="grid"><div><label>?숈깮 ID</label><input name="id" value="${next}"><div class="muted">蹂몄궗 Genius ID媛 ?덉쑝硫?洹멸구濡?諛붽퓭 ?ｌ쑝?몄슂. ?놁쑝硫?${next}.</div></div></div>
    ${FIELDS.map(([g,fs])=>`<h3 style="font-size:14px;color:var(--muted);margin:16px 0 8px">${g}</h3><div class="grid">${fs.map(f=>fieldHtml(f,f[0]==="status"?"active":"")).join("")}</div>`).join("")}
    <div class="row" style="margin-top:18px"><button class="btn" type="submit">?깅줉</button></div></form></div>`;
  $("#f").onsubmit = async e => {

function parseDelimited(text){
  text = text.replace(/\r/g,"").trim(); if (!text) return [];
  const delim = text.split("\n")[0].includes("\t") ? "\t" : ",";
  const rows=[]; let row=[], cell="", inQ=false;
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if (inQ){ if (ch==='"'){ if (text[i+1]==='"'){cell+='"';i++;} else inQ=false; } else cell+=ch; }
    else if (ch==='"') inQ=true;
    else if (ch===delim){ row.push(cell); cell=""; }
    else if (ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch; }
  row.push(cell); rows.push(row);
  const hdr = rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(c=>c.trim())).map(r=>Object.fromEntries(hdr.map((h,i)=>[h,(r[i]||"").trim()])));
}
